# Dependency updates — weekly, grouped so a week's bumps arrive as a handful of PRs rather than dozens.
# Security updates are separate (enabled in the repository settings) and arrive as soon as an advisory
# lands. Every PR here is merged by hand after CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      angular:
        patterns: ['@angular/*', 'angular-eslint']
      ai-sdks:
        patterns: ['ai', '@ai-sdk/*', '@anthropic-ai/*', '@openai/*']
      # The terminal and its addons are released together on the same day and peer-depend on each
      # other, so they only resolve as a set: xterm 6 arrived as three separate PRs, and every one of
      # them failed `npm ci` on its own — the addon PRs against the old core, the core PR against the
      # old addons. Grouped, that upgrade is one PR that installs.
      xterm:
        patterns: ['@xterm/*']
      # Same story as xterm: `@vitest/coverage-v8` peer-depends on the exact `vitest` version, so a
      # split pair can never install — vitest 5 arrived as #637 and #635 and both failed `npm ci`
      # with ERESOLVE, each against the other's old version. Grouped, they move as one.
      vitest:
        patterns: ['vitest', '@vitest/*']
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ['electron', '@angular/*', 'angular-eslint']
    ignore:
      # Electron majors change the Node ABI node-pty is rebuilt against; they are taken deliberately,
      # not on a Monday.
      - dependency-name: electron
        update-types: ['version-update:semver-major']
      # `ng test` runs through @angular/build's vitest integration, and that package peer-depends on
      # `vitest ^4.0.8` — still true on 22.1.7, the newest release of the line. A vitest major is
      # therefore not ours to take: it cannot resolve, and the builder is written against vitest 4's
      # API. Lift this (both entries) once @angular/build widens the peer range.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
