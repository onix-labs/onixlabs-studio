# Continuous integration — runs the green gate (format, lint, test, build) on every PR and on main.
# Mirrors the wiki's Build, test and tooling page: prettier --check, eslint, vitest, ng build,
# electron typecheck+bundle.
name: CI

on:
  pull_request:
  push:
    branches: [main, release]

# One run per ref: a new push to the same PR cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Nothing in CI launches Electron (tests are Vitest/jsdom; builds are esbuild/ng),
      # so skip the ~100 MB Electron binary download during npm ci.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/onixlabs-studio
          retention-days: 14

      - name: Build renderer (Angular)
        run: npm run build

      - name: Build Electron main + preload (typecheck + bundle)
        run: npm run build:electron

  e2e:
    name: E2E (Playwright + Electron)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Unlike the checks job, this job needs the real Electron binary — the suite launches the app.
      # The postinstall hook rebuilds node-pty for the Electron ABI (the main process requires it
      # at startup), so no explicit rebuild step is needed.
      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Angular)
        run: npm run build

      - name: Build Electron main + preload
        run: npm run build:electron

      - name: Run E2E suite
        run: xvfb-run --auto-servernum -- npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  pack:
    name: Packaging smoke (electron-builder --dir)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # electron-builder downloads its own Electron dist zip, and electron-rebuild only needs the
      # headers — neither uses the ~100 MB binary an npm ci would fetch into node_modules.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack unpackaged app directory
        run: npm run pack

      # The main process loads node-pty's compiled binary and spawns the agent-sdk/ripgrep/codex
      # executables at runtime, so they must land outside the asar archive (see #141). The scoped
      # directories are not enough to assert: ripgrep, the agent SDK and codex each ship their
      # executable in a *per-platform* optional dependency, and a package built with the wrong one
      # installed still has the parent directory. Check the binaries themselves — the missing
      # `@vscode/ripgrep-darwin-x64` that killed 2026.1.0-beta.1 would have passed a directory test.
      - name: Verify native modules are asar-unpacked
        run: |
          UNPACKED="release/linux-unpacked/resources/app.asar.unpacked/node_modules"
          test -d "$UNPACKED/node-pty" || { echo "node-pty not unpacked"; exit 1; }
          find "$UNPACKED/node-pty" -name "*.node" | grep -q . || { echo "node-pty .node binary missing"; exit 1; }
          test -f "$UNPACKED/@vscode/ripgrep-linux-x64/bin/rg" || { echo "ripgrep binary missing"; exit 1; }
          test -f "$UNPACKED/@anthropic-ai/claude-agent-sdk-linux-x64/claude" || { echo "claude executable missing"; exit 1; }
          test -d "$UNPACKED/@openai/codex-linux-x64/vendor" || { echo "codex vendor binaries missing"; exit 1; }
          echo "asar-unpack verified: node-pty (+.node), rg, claude, codex vendor all present"
