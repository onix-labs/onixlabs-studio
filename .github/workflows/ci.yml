# Continuous integration — runs the green gate (format, lint, test, build) on every PR and on main.
# Mirrors docs/agents.md §8: prettier --check, eslint, vitest, ng build, electron typecheck+bundle.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push to the same PR cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Nothing in CI launches Electron (tests are Vitest/jsdom; builds are esbuild/ng),
      # so skip the ~100 MB Electron binary download during npm ci.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/onixlabs-studio
          retention-days: 14

      - name: Build renderer (Angular)
        run: npm run build

      - name: Build Electron main + preload (typecheck + bundle)
        run: npm run build:electron

  e2e:
    name: E2E (Playwright + Electron)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Unlike the checks job, this job needs the real Electron binary — the suite launches the app.
      - name: Install dependencies
        run: npm ci

      # The main process requires node-pty at startup, so it must match the Electron ABI.
      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Build renderer (Angular)
        run: npm run build

      - name: Build Electron main + preload
        run: npm run build:electron

      - name: Run E2E suite
        run: xvfb-run --auto-servernum -- npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
