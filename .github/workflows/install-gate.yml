# Install gate (#1546) — installs Studio from its installers on clean Windows, macOS and Linux machines
# that already have every toolchain the plugins drive, completes a full first-run setup through the
# real plugin index (every plugin the wizard offers is downloaded, hash-checked, unpacked and
# started), checks the end state, restarts, and checks that nothing is installed or asked again.
#
# When it runs:
#   - In the release dry run. release.yml calls it on the `main → release` PR with the installers its
#     build matrix has just produced (`reuse-installers: true`), and its own "Install gate" job is the
#     check a release ruleset requires.
#   - On a PR into `main` that changes the gate itself (this file, e2e/install/**, its scripts), so a
#     change to the gate is proved on its own PR. It then builds its own installers the way release.yml
#     does, except that macOS is not signed or notarised: the signing secrets stay with the release.
#   - By hand (Actions → Install gate → Run workflow), building its own installers.
# Never on ordinary PRs into `main`, nor on pushes: it takes the better part of an hour of runners.
#
# The toolchain versions come from e2e/install/toolchains.env, which the Linux images read as well.
# Docker and Podman are not installed on any leg (macOS runners have no Docker, and the Linux legs
# would need Docker-in-Docker): the container-engine plugins install and read as installed, and simply
# have no engine to talk to, which is not a failure of the install.
name: Install gate

on:
  workflow_call:
    inputs:
      reuse-installers:
        description: Use the calling run's `installers-<target>` artifacts rather than building them.
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/install-gate.yml'
      - 'e2e/install/**'
      - 'scripts/e2e-install.mjs'
      - 'scripts/e2e-install-report.mjs'
      - 'scripts/package-linux.mjs'
      - '.linux-builder-image'

# A newer push to the PR supersedes the run in progress. Keyed apart from release.yml's own group, so
# a dry run calling this cannot wait on itself.
concurrency:
  group: install-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The installers, built exactly as release.yml's build matrix builds them, when there is no calling
  # run to take them from. One runner per target, of the target's own architecture (see release.yml
  # for why a cross-architecture build is never used).
  build:
    name: Build (${{ matrix.name }})
    if: ${{ !inputs.reuse-installers }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, id: macos-arm64, os: macos-latest, args: --mac --arm64 }
          - { name: macOS x64, id: macos-x64, os: macos-15-intel, args: --mac --x64 }
          - { name: Windows x64, id: windows-x64, os: windows-latest, args: --win --x64 }
          - { name: Linux x64, id: linux-x64, os: ubuntu-latest, args: --linux --x64 }
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: runner.os != 'Linux'
        run: npm ci

      - name: Build renderer (Angular)
        if: runner.os != 'Linux'
        run: npm run build

      - name: Build Electron main + preload
        if: runner.os != 'Linux'
        run: npm run build:electron

      - name: Package (unsigned)
        if: runner.os != 'Linux'
        run: npx electron-builder ${{ matrix.args }} --publish never

      # In Debian 12, for its glibc, as release.yml does (see scripts/package-linux.mjs).
      - name: Package (Linux, unsigned, built in Debian 12)
        if: runner.os == 'Linux'
        run: node scripts/package-linux.mjs

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.id }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 3

  gate:
    name: Gate (${{ matrix.name }})
    needs: build
    # The build is skipped when the caller supplies the installers; anything else than success or
    # skipped means there is nothing to install.
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # Every platform's result is worth having, whichever fails first.
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, id: macos-arm64, os: macos-latest, target: macos-arm64 }
          - { name: macOS x64, id: macos-x64, os: macos-15-intel, target: macos-x64 }
          - { name: Windows x64, id: windows-x64, os: windows-latest, target: windows-x64 }
          - {
              name: Linux x64 (Debian),
              id: linux-debian,
              os: ubuntu-latest,
              target: linux-x64,
              distro: debian,
            }
          - {
              name: Linux x64 (Fedora),
              id: linux-fedora,
              os: ubuntu-latest,
              target: linux-x64,
              distro: fedora,
            }
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      OUTPUT: e2e/install/output/${{ matrix.distro || matrix.id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Node the toolchain pins (.nvmrc), which the harness runs on too.
      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The harness needs Playwright and nothing compiled, so no install scripts run.
      - name: Install the harness
        run: npm ci --ignore-scripts

      - name: Download the installer
        uses: actions/download-artifact@v8
        with:
          name: installers-${{ matrix.target }}
          path: installers

      # ── Linux: the containers of e2e/install, as `npm run e2e:install` runs them locally ──
      - name: Install and set up Studio (${{ matrix.name }})
        if: runner.os == 'Linux'
        run: node scripts/e2e-install.mjs --distro "${{ matrix.distro }}" --installer installers/*.AppImage

      # ── macOS and Windows: the runner is the clean machine; the toolchains go on first ──
      - name: Read the toolchain pins
        if: runner.os != 'Linux'
        run: grep -E '^[A-Z_]+=' e2e/install/toolchains.env >> "$GITHUB_ENV"

      - name: Set up .NET
        if: runner.os != 'Linux'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Go
        if: runner.os != 'Linux'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up the JDK (Temurin)
        if: runner.os != 'Linux'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Maven, Gradle and CMake come straight from their projects: they have no setup action under
      # actions/*, and this repository allows no other publisher's actions. Each is checked against the
      # checksum its project publishes before it is unpacked, as toolchains.sh checks them on Linux.
      - name: Set up Maven, Gradle and CMake
        if: runner.os != 'Linux'
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/gate-tools"
          mkdir -p "$tools"
          fetch() { curl -fsSL --retry 5 -o "$2" "$1"; }
          # check <bits> <file> <expected hex>: shasum on macOS, sha<bits>sum on Windows. The file goes
          # in on stdin: given a Windows path, sha<bits>sum escapes its output line with a leading `\`.
          check() {
            local actual
            if command -v "sha$1sum" >/dev/null; then
              actual="$("sha$1sum" < "$2" | cut -d' ' -f1)"
            else
              actual="$(shasum -a "$1" < "$2" | cut -d' ' -f1)"
            fi
            if [ -z "$3" ] || [ "$actual" != "$3" ]; then
              echo "::error::$2 does not match its published SHA-$1 (got $actual, expected '$3')"
              exit 1
            fi
            echo "verified $(basename "$2")"
          }

          maven="https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.zip"
          fetch "$maven" "$tools/maven.zip"
          check 512 "$tools/maven.zip" "$(curl -fsSL --retry 5 "$maven.sha512" | cut -d' ' -f1)"
          unzip -q "$tools/maven.zip" -d "$tools"
          echo "$tools/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"

          gradle="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          fetch "$gradle" "$tools/gradle.zip"
          check 256 "$tools/gradle.zip" "$(curl -fsSL --retry 5 "$gradle.sha256")"
          unzip -q "$tools/gradle.zip" -d "$tools"
          echo "$tools/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"

          base="https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION"
          fetch "$base/cmake-$CMAKE_VERSION-SHA-256.txt" "$tools/cmake.sha256"
          if [ "$RUNNER_OS" = macOS ]; then
            cmake="cmake-$CMAKE_VERSION-macos-universal.tar.gz"
          else
            cmake="cmake-$CMAKE_VERSION-windows-x86_64.zip"
          fi
          fetch "$base/$cmake" "$tools/$cmake"
          check 256 "$tools/$cmake" "$(awk -v name="$cmake" '$2 == name { print $1 }' "$tools/cmake.sha256")"
          if [ "$RUNNER_OS" = macOS ]; then
            tar -xzf "$tools/$cmake" -C "$tools"
            echo "$tools/cmake-$CMAKE_VERSION-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"
          else
            unzip -q "$tools/$cmake" -d "$tools"
            echo "$tools/cmake-$CMAKE_VERSION-windows-x86_64/bin" >> "$GITHUB_PATH"
          fi

      # rustup is on both runner images; the toolchain is pinned, with what rust-analyzer reads.
      - name: Set up Rust
        if: runner.os != 'Linux'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rust-src,rustfmt,clippy
          rustup default "$RUST_VERSION"

      # The C and C++ compilers are the platform's own and come with the images: Apple's clang
      # (Xcode) on macOS, MSVC (Visual Studio) on Windows.

      # A Mac app started from the Finder sees only what the login shell's profile adds to PATH, so
      # the toolchains go where a user's would. Windows has no such capture: an app started from
      # Explorer inherits the user's environment, which the setup steps have already extended.
      - name: Put the toolchains on the login shell's PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          {
            echo "export PATH=\"$PATH\""
            echo "export JAVA_HOME=\"$JAVA_HOME\""
            echo "export DOTNET_ROOT=\"${DOTNET_ROOT:-}\""
          } >> "$HOME/.zprofile"

      - name: Install and set up Studio (${{ matrix.name }})
        if: runner.os != 'Linux'
        env:
          STUDIO_GATE_OUTPUT: ${{ github.workspace }}/${{ env.OUTPUT }}
          STUDIO_GATE_DISTRO: ${{ matrix.name }}
          STUDIO_GATE_TOOLCHAINS: e2e/install/toolchains.sh
          CI: true
        run: |
          shopt -s nullglob
          installers=(installers/*.dmg installers/*.exe)
          export STUDIO_GATE_INSTALLER="$PWD/${installers[0]}"
          status=0
          npx playwright test --config e2e/install/playwright.config.ts || status=$?
          node scripts/e2e-install-report.mjs "$STUDIO_GATE_OUTPUT/summary.json" "${{ matrix.name }}" "$status"
          exit "$status"

      # The per-plugin summary always; everything else only when something went wrong.
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-gate-summary-${{ matrix.id }}
          path: ${{ env.OUTPUT }}/summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-gate-evidence-${{ matrix.id }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: warn
          retention-days: 14

  # One result for the whole matrix, under a name that does not change as legs are added, so a single
  # required check can gate a release.
  result:
    name: Install gate
    needs: [build, gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          BUILD: ${{ needs.build.result }}
          GATE: ${{ needs.gate.result }}
        run: |
          echo "build: $BUILD, gate: $GATE"
          [ "$BUILD" = success ] || [ "$BUILD" = skipped ] || exit 1
          [ "$GATE" = success ]
