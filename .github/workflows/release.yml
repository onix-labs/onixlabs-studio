# Release — builds every target from the `release` branch and, only when all of them succeeded, creates
# the `v<version>` tag and a DRAFT GitHub Release holding the artifacts. The tag comes after the build
# on purpose: a build that fails leaves nothing behind to delete or explain.
#
# The procedure (also on the wiki, Releases):
#   1. PR to `main`: `chore(release): 2026.1.0` bumping package.json `version`.
#   2. PR `main → release`. CI runs on it like any PR, and so does this workflow as a dry run: every
#      target is built and verified, but nothing is tagged or drafted. Merge it once both are green.
#   3. This workflow runs on the push to `release`. When it is green there is a draft release —
#      read the notes, then Publish.
#
# The macOS builds are signed and notarised with five more secrets: MAC_CERTIFICATE_P12_BASE64 and
# MAC_CERTIFICATE_PASSWORD (the ONIXLABS LIMITED Developer ID Application certificate, which Apple now
# issues for about a year: renew it before it runs out, 2027-12-25 for the first), and
# APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER (an App Store Connect team key with the
# Developer role, for the notary service).
#
# `RELEASE_TOKEN` is a fine-grained PAT of a repository admin (contents: read/write), because the
# `v*` tag ruleset only lets admins create tags and the workflow's own token is not one.
name: Release

on:
  push:
    branches: [release]
  # The dry run: a broken Windows or macOS package is found on the PR, not after the merge.
  pull_request:
    branches: [release]

# A real release is never cancelled and never runs beside another; a dry run belongs to its PR, and a
# new push to the PR supersedes it.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('release-dry-run-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  # A release must not ship an index it has not verified. Every entry in `curated-plugins.json` is a
  # claim about an external artifact — this URL exists, its bytes hash to this — and nothing in the
  # normal gate can check that, because a test that stubs the artifact tests everything except the
  # claim. If an upstream asset has been deleted or retagged since the last release, the build will
  # succeed and the install will fail SHA-256 verification on the user's machine.
  #
  # Runs beside the build rather than before it, so hundreds of megabytes of downloads do not
  # serialise ahead of packaging; `release` needs both, so a rotten pin still stops the tag.
  plugin-index:
    name: Verify the curated plugin index
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Every tag: an older release listed under an entry's `releases` pins its lockfile at its tag.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # `--all`, not this runner's platform: the index pins per-platform downloads, and a release ships
      # every platform. `--published`, because by now every first-party plugin release the index pins
      # must be out: without it a pin to a tag that was never pushed passes (claude-harness 0.22.0
      # did). Retried once so a briefly unreachable host does not fail a release.
      - name: Verify every pinned download
        shell: bash
        run: |
          if node scripts/verify-plugin-index.mjs --all --published; then
            exit 0
          fi
          echo "::warning::First pass failed; retrying once in 60s in case a host was briefly unreachable."
          sleep 60
          node scripts/verify-plugin-index.mjs --all --published

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # 90, not 60: a macOS build waits on Apple's notary service, which usually answers in minutes but
    # can take much longer when it is busy.
    timeout-minutes: 90
    strategy:
      fail-fast: true
      # One entry per target, and every entry runs on a runner of that target's own architecture.
      # A runtime dependency that ships its executable as a per-platform optional dependency
      # (@vscode/ripgrep) is installed by `npm ci` only in the variant matching the *host*, so a
      # cross-arch package silently omits it and the built app dies at startup on `import { rgPath }`. Building macOS x64 on `macos-latest` (arm64) is how
      # 2026.1.0-beta.1 shipped a broken Intel dmg. Never merge two arches into one entry again.
      matrix:
        include:
          - name: macOS arm64
            id: macos-arm64
            os: macos-latest
            platform: darwin
            arch: arm64
            args: --mac --arm64
          - name: macOS x64
            id: macos-x64
            os: macos-15-intel
            platform: darwin
            arch: x64
            args: --mac --x64
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            platform: win32
            arch: x64
            args: --win --x64
          - name: Linux x64
            id: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            args: --linux --x64
    env:
      # electron-builder downloads its own Electron dist per target; the npm ci binary is unused.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm ci` resolves optionalDependencies against the host, so this is the one thing a
      # cross-arch runner gets wrong — and it gets it wrong silently, with no install warning and no
      # build failure. Assert the target's variants are on disk before anything is packaged.
      - name: Verify the target's platform packages are installed
        shell: bash
        env:
          SUFFIX: ${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          missing=0
          for pkg in "@vscode/ripgrep-$SUFFIX"; do
            if [ -d "node_modules/$pkg" ]; then
              echo "ok       $pkg"
            else
              echo "::error::$pkg is not installed — this runner's architecture does not match the build target ($SUFFIX)."
              missing=1
            fi
          done
          exit $missing

      - name: Build renderer (Angular)
        if: matrix.platform != 'linux'
        run: npm run build

      - name: Build Electron main + preload (typecheck + bundle)
        if: matrix.platform != 'linux'
        run: npm run build:electron

      # The macOS builds are signed with the ONIXLABS LIMITED Developer ID and notarised, in the dry run
      # as well as the release: the install gate then installs what will ship, and the dry run's disk
      # image can be tried on a real Mac before the merge. electron-builder takes the certificate and
      # the App Store Connect key as files, so the secrets are written to the runner's temporary
      # directory, which is emptied when the job ends. A missing secret fails here: without it
      # electron-builder would quietly build an unsigned app. It also skips signing on any pull request
      # unless CSC_FOR_PULL_REQUEST is set, to keep secrets from a fork's code; a fork's PR is given no
      # secrets, so it fails at this step instead, and only admins open PRs into `release` anyway.
      - name: Prepare the signing credentials (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=0
          for name in CERTIFICATE CERTIFICATE_PASSWORD API_KEY API_KEY_ID API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is empty — macOS cannot be signed and notarised without it."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/notary-key.p8"
          # The password in the multi-line form, so no character it may contain can end the value early.
          # The IDs lose any whitespace a paste brought with them.
          delimiter="PASSWORD_$(uuidgen)"
          {
            echo "CSC_LINK=$RUNNER_TEMP/developer-id.p12"
            printf 'CSC_KEY_PASSWORD<<%s\n%s\n%s\n' "$delimiter" "$CERTIFICATE_PASSWORD" "$delimiter"
            echo "APPLE_API_KEY=$RUNNER_TEMP/notary-key.p8"
            echo "APPLE_API_KEY_ID=${API_KEY_ID//[[:space:]]/}"
            echo "APPLE_API_ISSUER=${API_ISSUER//[[:space:]]/}"
            echo "CSC_FOR_PULL_REQUEST=true"
          } >> "$GITHUB_ENV"

      - name: Package
        if: matrix.platform != 'linux'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Remove the signing credentials (macOS)
        if: always() && matrix.platform == 'darwin'
        shell: bash
        run: rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"

      # Linux is built inside Debian 12, not on the runner. The AppImage's native module (node-pty) is
      # compiled against the builder's glibc and will not load on a system with an older one: built on
      # `ubuntu-latest` it needed glibc 2.42, and Studio could not start on Debian 13 or Ubuntu 24.04
      # (the install gate found it, #1546). Debian 12's 2.36 is one every supported distribution has.
      - name: Package (Linux, built in Debian 12)
        if: matrix.platform == 'linux'
        run: node scripts/package-linux.mjs

      # A job must emit its own target and nothing else. An `arch:` list in electron-builder.yml
      # silently overrides the CLI arch flag, and when both macOS jobs built both architectures they
      # produced identical filenames — which the release job's artifact merge then wrote concurrently,
      # splicing beta.4's Intel dmg out of two different builds (#617). A stray architecture here is
      # that failure a step before it can happen, so fail the build on it.
      - name: Verify this job built only its own target
        shell: bash
        env:
          SUFFIX: ${{ matrix.platform == 'darwin' && format('mac-{0}', matrix.arch) || '' }}
        run: |
          shopt -s nullglob
          status=0
          for f in release/*.dmg release/*.zip release/*.exe release/*.AppImage; do
            echo "built    $f"
            if [ -n "$SUFFIX" ] && [[ "$f" != *"-$SUFFIX."* ]]; then
              echo "::error::$f is not a $SUFFIX artifact — this job built more than its own target."
              status=1
            fi
          done
          exit $status

      # electron-builder reports success for a disk image macOS cannot mount: beta.4's Intel dmg was
      # the right size, had an intact UDIF trailer, and still failed with "The disk you attached was
      # not readable by this computer". Only attaching it proves otherwise.
      - name: Verify the disk images mount
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          shopt -s nullglob
          for dmg in release/*.dmg; do
            echo "verifying $dmg"
            hdiutil verify "$dmg"
            mount="$(mktemp -d)"
            hdiutil attach "$dmg" -readonly -nobrowse -noverify -mountpoint "$mount" >/dev/null
            ls -1 "$mount"
            hdiutil detach "$mount" >/dev/null
          done

      # electron-builder signs with whatever identity it is given and skips notarisation with only a
      # warning, so its success says nothing about whether a Mac will open the app without a warning.
      # Check the app as it ships, inside each disk image and each zip: signed by ONIXLabs' team,
      # intact, and notarised with the ticket stapled (so it opens offline). Every command in `check`
      # carries its own `|| return 1`: a function called on the left of `||` runs with `set -e` off, so
      # without them a failure inside it would be ignored.
      #
      # Gatekeeper's own verdict is asked for too, but only counts when Gatekeeper is on: a runner image
      # may switch it off, and then `spctl` accepts anything. The stapled ticket is the proof either way.
      - name: Verify the app is signed and notarised
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          TEAM_ID: 66F8GTCBT9
        run: |
          shopt -s nullglob
          gatekeeper=off
          if spctl --status 2>&1 | grep -q 'assessments enabled'; then gatekeeper=on; fi
          echo "Gatekeeper on this runner: $gatekeeper"
          check() {
            local app="$1" team verdict
            echo "checking $app"
            codesign --verify --deep --strict --verbose=2 "$app" || return 1
            team="$(codesign --display --verbose=2 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            if [ "$team" != "$TEAM_ID" ]; then
              echo "::error::$app is signed by team '${team:-none}', not $TEAM_ID."
              return 1
            fi
            xcrun stapler validate "$app" || return 1
            verdict="$(spctl --assess --type execute --verbose=2 "$app" 2>&1)" || { echo "$verdict"; return 1; }
            echo "$verdict"
            if [ "$gatekeeper" = on ] && [[ "$verdict" != *"source=Notarized Developer ID"* ]]; then
              echo "::error::Gatekeeper did not accept $app as notarised."
              return 1
            fi
          }
          # Each archive must hold exactly one app, and every archive is checked: one good zip must not
          # stand in for an empty disk image, which is what users install.
          one_app() {
            local apps=("$1"/*.app)
            if [ "${#apps[@]}" -ne 1 ]; then
              echo "::error::$2 holds ${#apps[@]} apps, not 1."
              return 1
            fi
            check "${apps[0]}"
          }
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          if [ "${#dmgs[@]}" -eq 0 ] || [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::Expected a disk image and a zip; found ${#dmgs[@]} and ${#zips[@]}."
            exit 1
          fi
          status=0
          for dmg in release/*.dmg; do
            mount="$(mktemp -d)"
            hdiutil attach "$dmg" -readonly -nobrowse -noverify -mountpoint "$mount" >/dev/null
            one_app "$mount" "$dmg" || status=1
            hdiutil detach "$mount" >/dev/null
          done
          for zip in release/*.zip; do
            dir="$(mktemp -d)"
            ditto -x -k "$zip" "$dir"
            one_app "$dir" "$zip" || status=1
          done
          exit $status

      # Hashes recorded at the source, checked again after the release job downloads them. This is the
      # only guard that covers the journey itself — beta.4 was corrupted in transit, between a build
      # that succeeded and a release that published, where nothing was looking.
      - name: Record checksums
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.exe release/*.AppImage)
          node -e '
            const { createHash } = require("crypto");
            const { readFileSync, writeFileSync } = require("fs");
            const { basename } = require("path");
            const lines = process.argv.slice(1).map((f) => {
              const hash = createHash("sha256").update(readFileSync(f)).digest("hex");
              return `${hash}  ${basename(f)}`;
            });
            writeFileSync(process.env.OUT, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          ' "${files[@]}"
        env:
          OUT: release/SHA256SUMS.txt

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          # Keyed on the target, not `runner.os`: the two macOS jobs would collide under one name.
          name: installers-${{ matrix.id }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # The install gate (#1546): every installer just built is installed on a clean machine of its own
  # platform, and a full first-run setup is completed through the real plugin index, then restarted.
  # See install-gate.yml. Only on the dry run, because that is where a release can still be stopped:
  # the `release` branch's ruleset requires the "Install gate" check below, so a `main → release` PR
  # whose installers cannot be installed and set up cannot merge, and the push that tags and drafts
  # never happens.
  #
  # Not repeated on the push to `release`. The push builds from the commit the PR proved, so the
  # installers it releases are the ones the gate installed; running it again would spend most of an
  # hour proving the same thing. Should that ever stop being true — a step that changes what the push
  # builds — give `release` a `needs:` on a gate run here too.
  install-gate-legs:
    name: Install gate legs
    needs: build
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/install-gate.yml
    with:
      reuse-installers: true

  # The check the `release` ruleset requires, under a name of its own: a job inside a called workflow
  # is reported as "<caller> / <job>", which is no name to pin a ruleset to.
  install-gate:
    name: Install gate
    needs: install-gate-legs
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          RESULT: ${{ needs.install-gate-legs.result }}
        run: |
          echo "install gate: $RESULT"
          [ "$RESULT" = success ]

  release:
    name: Tag and draft the release
    needs: [build, plugin-index]
    # Only the push to `release` publishes; a PR's dry run stops once every target has built.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the three version numbers
        id: versions
        run: |
          version="$(node -p "require('./package.json').version")"
          api="$(sed -nE "s/^export const PLUGIN_API_VERSION: string = '([^']+)';/\1/p" src/shared/api/plugin-manifest.ts)"
          revision="$(node -p "require('./src/shared/electron/contributions/plugins/curated-plugins.json').revision")"
          test -n "$version" && test -n "$api" && test -n "$revision"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Studio $version · Plugin API $api · Catalogue revision $revision"

      - name: Refuse to overwrite an existing tag
        env:
          TAG: v${{ steps.versions.outputs.version }}
        run: |
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists — bump package.json version before releasing again."
            exit 1
          fi

      # No `merge-multiple`. It flattens every artifact into one directory, and the four downloads run
      # concurrently: two jobs that happen to emit the same filename write the same path at the same
      # time, and the loser is not overwritten but interleaved. That is how beta.4's Intel dmg was
      # spliced out of two builds (#617). One directory per artifact makes the collision impossible
      # rather than merely unlikely.
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers

      - name: Verify the installers survived the journey
        run: |
          shopt -s nullglob
          dirs=(installers/*/)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::No artifacts were downloaded — there is nothing to verify or publish."
            exit 1
          fi
          status=0
          for dir in "${dirs[@]}"; do
            if [ ! -f "$dir/SHA256SUMS.txt" ]; then
              echo "::error::$dir carries no SHA256SUMS.txt, so its contents cannot be checked."
              status=1
              continue
            fi
            echo "checking $dir"
            (cd "$dir" && sha256sum --check --strict SHA256SUMS.txt) || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::An installer does not match the checksum recorded when it was built — it was corrupted between the build and here. Do not publish."
          fi
          exit $status

      - name: Create the tag
        env:
          TAG: v${{ steps.versions.outputs.version }}
        run: gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --jq '"tagged \(.ref) at \(.object.sha[0:8])"'

      - name: Draft the release
        env:
          TAG: v${{ steps.versions.outputs.version }}
          VERSION: ${{ steps.versions.outputs.version }}
          API: ${{ steps.versions.outputs.api }}
          REVISION: ${{ steps.versions.outputs.revision }}
        run: |
          cat > notes.md <<EOF
          | | |
          | --- | --- |
          | Studio | \`$VERSION\` |
          | Plugin API | \`$API\` |
          | Curated catalogue revision | \`$REVISION\` |

          > **The Windows installer is not code-signed.** Windows SmartScreen will warn on first run — More info → Run anyway. The macOS builds are signed and notarised by ONIXLabs, and open without a warning.

          EOF
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # Named by extension, one directory per artifact: the checksum files stay behind, and an
          # unexpected file in `release/` cannot become a release asset by accident.
          shopt -s nullglob
          assets=(installers/*/*.dmg installers/*/*.zip installers/*/*.exe installers/*/*.AppImage)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No installers were found to publish."
            exit 1
          fi
          printf 'publishing %s\n' "${assets[@]}"
          gh release create "$TAG" "${assets[@]}" \
            --repo "$REPO" \
            --draft $prerelease \
            --verify-tag \
            --title "ONIXLabs Studio $VERSION" \
            --generate-notes \
            --notes-file notes.md
          echo "Draft release $TAG created — review the notes, then publish."
