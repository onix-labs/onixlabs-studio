# Release — builds every target from the `release` branch and, only when all of them succeeded, creates
# the `v<version>` tag and a DRAFT GitHub Release holding the artifacts. The tag comes after the build
# on purpose: a build that fails leaves nothing behind to delete or explain.
#
# The procedure (also on the wiki, Releases):
#   1. PR to `main`: `chore(release): 2026.1.0` bumping package.json `version`.
#   2. PR `main → release`. CI runs on it like any PR; merge it.
#   3. This workflow runs on the push to `release`. When it is green there is a draft release —
#      read the notes, then Publish.
#
# `RELEASE_TOKEN` is a fine-grained PAT of a repository admin (contents: read/write), because the
# `v*` tag ruleset only lets admins create tags and the workflow's own token is not one.
name: Release

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A release must not ship an index it has not verified. Every entry in `curated-plugins.json` is a
  # claim about an external artifact — this URL exists, its bytes hash to this — and nothing in the
  # normal gate can check that, because a test that stubs the artifact tests everything except the
  # claim. If an upstream asset has been deleted or retagged since the last release, the build will
  # succeed and the install will fail SHA-256 verification on the user's machine.
  #
  # Runs beside the build rather than before it, so hundreds of megabytes of downloads do not
  # serialise ahead of packaging; `release` needs both, so a rotten pin still stops the tag.
  plugin-index:
    name: Verify the curated plugin index
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # `--all`, not this runner's platform: the index pins per-platform downloads, and a release ships
      # every platform. Retried once so a briefly unreachable host does not fail a release.
      - name: Verify every pinned download
        shell: bash
        run: |
          if node scripts/verify-plugin-index.mjs --all; then
            exit 0
          fi
          echo "::warning::First pass failed; retrying once in 60s in case a host was briefly unreachable."
          sleep 60
          node scripts/verify-plugin-index.mjs --all

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      # One entry per target, and every entry runs on a runner of that target's own architecture.
      # Three runtime dependencies ship their executables as per-platform optional dependencies
      # (@vscode/ripgrep, @anthropic-ai/claude-agent-sdk, @openai/codex): `npm ci` installs only the
      # variant matching the *host*, so a cross-arch package silently omits it and the built app
      # dies at startup on `import { rgPath }`. Building macOS x64 on `macos-latest` (arm64) is how
      # 2026.1.0-beta.1 shipped a broken Intel dmg. Never merge two arches into one entry again.
      matrix:
        include:
          - name: macOS arm64
            id: macos-arm64
            os: macos-latest
            platform: darwin
            arch: arm64
            args: --mac --arm64
          - name: macOS x64
            id: macos-x64
            os: macos-15-intel
            platform: darwin
            arch: x64
            args: --mac --x64
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            platform: win32
            arch: x64
            args: --win --x64
          - name: Linux x64
            id: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            args: --linux --x64
    env:
      # electron-builder downloads its own Electron dist per target; the npm ci binary is unused.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm ci` resolves optionalDependencies against the host, so this is the one thing a
      # cross-arch runner gets wrong — and it gets it wrong silently, with no install warning and no
      # build failure. Assert the target's variants are on disk before anything is packaged.
      - name: Verify the target's platform packages are installed
        shell: bash
        env:
          SUFFIX: ${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          missing=0
          for pkg in "@vscode/ripgrep-$SUFFIX" "@anthropic-ai/claude-agent-sdk-$SUFFIX" "@openai/codex-$SUFFIX"; do
            if [ -d "node_modules/$pkg" ]; then
              echo "ok       $pkg"
            else
              echo "::error::$pkg is not installed — this runner's architecture does not match the build target ($SUFFIX)."
              missing=1
            fi
          done
          exit $missing

      - name: Build renderer (Angular)
        run: npm run build

      - name: Build Electron main + preload (typecheck + bundle)
        run: npm run build:electron

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      # A job must emit its own target and nothing else. An `arch:` list in electron-builder.yml
      # silently overrides the CLI arch flag, and when both macOS jobs built both architectures they
      # produced identical filenames — which the release job's artifact merge then wrote concurrently,
      # splicing beta.4's Intel dmg out of two different builds (#617). A stray architecture here is
      # that failure a step before it can happen, so fail the build on it.
      - name: Verify this job built only its own target
        shell: bash
        env:
          SUFFIX: ${{ matrix.platform == 'darwin' && format('mac-{0}', matrix.arch) || '' }}
        run: |
          shopt -s nullglob
          status=0
          for f in release/*.dmg release/*.zip release/*.exe release/*.AppImage; do
            echo "built    $f"
            if [ -n "$SUFFIX" ] && [[ "$f" != *"-$SUFFIX."* ]]; then
              echo "::error::$f is not a $SUFFIX artifact — this job built more than its own target."
              status=1
            fi
          done
          exit $status

      # electron-builder reports success for a disk image macOS cannot mount: beta.4's Intel dmg was
      # the right size, had an intact UDIF trailer, and still failed with "The disk you attached was
      # not readable by this computer". Only attaching it proves otherwise.
      - name: Verify the disk images mount
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          shopt -s nullglob
          for dmg in release/*.dmg; do
            echo "verifying $dmg"
            hdiutil verify "$dmg"
            mount="$(mktemp -d)"
            hdiutil attach "$dmg" -readonly -nobrowse -noverify -mountpoint "$mount" >/dev/null
            ls -1 "$mount"
            hdiutil detach "$mount" >/dev/null
          done

      # Hashes recorded at the source, checked again after the release job downloads them. This is the
      # only guard that covers the journey itself — beta.4 was corrupted in transit, between a build
      # that succeeded and a release that published, where nothing was looking.
      - name: Record checksums
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.exe release/*.AppImage)
          node -e '
            const { createHash } = require("crypto");
            const { readFileSync, writeFileSync } = require("fs");
            const { basename } = require("path");
            const lines = process.argv.slice(1).map((f) => {
              const hash = createHash("sha256").update(readFileSync(f)).digest("hex");
              return `${hash}  ${basename(f)}`;
            });
            writeFileSync(process.env.OUT, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          ' "${files[@]}"
        env:
          OUT: release/SHA256SUMS.txt

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          # Keyed on the target, not `runner.os`: the two macOS jobs would collide under one name.
          name: installers-${{ matrix.id }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Tag and draft the release
    needs: [build, plugin-index]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the three version numbers
        id: versions
        run: |
          version="$(node -p "require('./package.json').version")"
          api="$(sed -nE "s/^export const PLUGIN_API_VERSION: string = '([^']+)';/\1/p" src/shared/api/plugin-manifest.ts)"
          revision="$(node -p "require('./src/shared/electron/contributions/plugins/curated-plugins.json').revision")"
          test -n "$version" && test -n "$api" && test -n "$revision"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Studio $version · Plugin API $api · Catalogue revision $revision"

      - name: Refuse to overwrite an existing tag
        env:
          TAG: v${{ steps.versions.outputs.version }}
        run: |
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists — bump package.json version before releasing again."
            exit 1
          fi

      # No `merge-multiple`. It flattens every artifact into one directory, and the four downloads run
      # concurrently: two jobs that happen to emit the same filename write the same path at the same
      # time, and the loser is not overwritten but interleaved. That is how beta.4's Intel dmg was
      # spliced out of two builds (#617). One directory per artifact makes the collision impossible
      # rather than merely unlikely.
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers

      - name: Verify the installers survived the journey
        run: |
          shopt -s nullglob
          dirs=(installers/*/)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::No artifacts were downloaded — there is nothing to verify or publish."
            exit 1
          fi
          status=0
          for dir in "${dirs[@]}"; do
            if [ ! -f "$dir/SHA256SUMS.txt" ]; then
              echo "::error::$dir carries no SHA256SUMS.txt, so its contents cannot be checked."
              status=1
              continue
            fi
            echo "checking $dir"
            (cd "$dir" && sha256sum --check --strict SHA256SUMS.txt) || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::An installer does not match the checksum recorded when it was built — it was corrupted between the build and here. Do not publish."
          fi
          exit $status

      - name: Create the tag
        env:
          TAG: v${{ steps.versions.outputs.version }}
        run: gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --jq '"tagged \(.ref) at \(.object.sha[0:8])"'

      - name: Draft the release
        env:
          TAG: v${{ steps.versions.outputs.version }}
          VERSION: ${{ steps.versions.outputs.version }}
          API: ${{ steps.versions.outputs.api }}
          REVISION: ${{ steps.versions.outputs.revision }}
        run: |
          cat > notes.md <<EOF
          | | |
          | --- | --- |
          | Studio | \`$VERSION\` |
          | Plugin API | \`$API\` |
          | Curated catalogue revision | \`$REVISION\` |

          > **These builds are not code-signed.** macOS will say the app "cannot be opened because the developer cannot be verified" — right-click → Open, or run \`xattr -d com.apple.quarantine\` on the app. Windows SmartScreen will warn on first run — More info → Run anyway.

          EOF
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # Named by extension, one directory per artifact: the checksum files stay behind, and an
          # unexpected file in `release/` cannot become a release asset by accident.
          shopt -s nullglob
          assets=(installers/*/*.dmg installers/*/*.zip installers/*/*.exe installers/*/*.AppImage)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No installers were found to publish."
            exit 1
          fi
          printf 'publishing %s\n' "${assets[@]}"
          gh release create "$TAG" "${assets[@]}" \
            --repo "$REPO" \
            --draft $prerelease \
            --verify-tag \
            --title "ONIXLabs Studio $VERSION" \
            --generate-notes \
            --notes-file notes.md
          echo "Draft release $TAG created — review the notes, then publish."
