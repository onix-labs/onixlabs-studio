# Static analysis with CodeQL on the TypeScript in both compilations. Findings land under Security →
# Code scanning; a PR run annotates the diff. Runs weekly as well, so newly published queries are
# applied to code that has not changed.
name: CodeQL

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
