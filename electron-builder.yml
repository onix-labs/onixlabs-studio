# electron-builder configuration — the single source of truth for packaging (the package.json
# `build` key was removed; keeping both risks one silently shadowing the other).
# Docs: https://www.electron.build/configuration
appId: com.onixlabs.studio
productName: ONIXLabs Studio
copyright: Copyright © 2026 ONIXLabs

directories:
  output: release # installers are written here (git-ignored)
  buildResources: build # icon.icns (mac, rounded per Apple style) + icon.png (win/linux, full-bleed)

# Only ship the compiled Electron main/preload and the built Angular app.
files:
  - dist-electron/**/*
  - dist/onixlabs-studio/browser/**/*
  - package.json

asar: true

# Native and self-spawning modules must live outside the asar archive: node-pty loads a compiled
# .node binary, and the Claude Agent SDK / Codex SDK / ripgrep spawn bundled executables (Claude
# validated in #141; Codex mirrors it — the codex CLI ships as a per-platform native binary under
# @openai/codex-<plat>-<arch>/vendor, resolved via codex-executable.ts).
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  - node_modules/@openai/codex/**
  - node_modules/@openai/codex-*/**
  - node_modules/@vscode/ripgrep/**
  - node_modules/@vscode/ripgrep-*/**

# The version is CalVer (YYYY.MINOR.PATCH). No spaces in the name: a GitHub Release asset with a space
# is renamed with dots, and a download link should be typeable.
artifactName: onixlabs-studio-${version}-${os}-${arch}.${ext}

# The release workflow uploads the artifacts itself, after every target built; electron-builder must
# never publish on its own (it would, given a GH_TOKEN in the environment).
publish: null

# Register the app with the operating system as an editor for the file types its editors handle
# (macOS: CFBundleDocumentTypes; Windows: NSIS registry associations; Linux: MimeType entries in the
# .desktop file). Registration makes the app available in "Open with" and eligible to be chosen as
# the default; it does not forcibly steal existing defaults. Keep this list in step with the
# renderer's extension→editor routing (monaco-languages EXTENSION_TO_LANGUAGE + the markdown editor).
fileAssociations:
  - ext: [md, markdown]
    name: Markdown Document
    role: Editor
  - ext:
      [
        txt,
        js,
        mjs,
        cjs,
        jsx,
        ts,
        tsx,
        json,
        html,
        htm,
        css,
        scss,
        sass,
        less,
        xml,
        yaml,
        yml,
        py,
        rb,
        java,
        c,
        cpp,
        h,
        cs,
        go,
        rs,
        php,
        sql,
        sh,
        bash,
        zsh,
        ps1,
        swift,
        kt,
        r,
        lua,
        pl,
        graphql,
        vue,
        svelte,
      ]
    name: Source File
    role: Editor

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.developer-tools
  identity: null # disable code signing for local/unsigned builds

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Development
  synopsis: A modern cross-platform integrated development environment
