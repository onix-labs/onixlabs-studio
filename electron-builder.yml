# electron-builder configuration — the single source of truth for packaging (the package.json
# `build` key was removed; keeping both risks one silently shadowing the other).
# Docs: https://www.electron.build/configuration
appId: com.onixlabs.studio
productName: ONIXLabs Studio
copyright: Copyright © 2026 ONIXLabs

directories:
  output: release # installers are written here (git-ignored)
  buildResources: build # icon.icns (mac, rounded per Apple style) + icon.png (win/linux, full-bleed)

# Only ship the compiled Electron main/preload and the built Angular app.
files:
  - dist-electron/**/*
  - dist/onixlabs-studio/browser/**/*
  - package.json

asar: true

# The licences (#1612): Studio's own, and the notices its dependencies' licences ask to travel with it,
# generated by `npm run build` from what the build actually bundled. They land beside the app's
# resources, where a user can read them without unpacking anything; Electron adds its own
# LICENSE.electron.txt and LICENSES.chromium.html. The About dialog reads licences.json, which ships
# inside the renderer build.
extraResources:
  - from: dist/licences/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  - from: .
    to: .
    filter:
      - LICENSE
      - NOTICE

# Native and self-spawning modules must live outside the asar archive: node-pty loads a compiled
# .node binary, and ripgrep spawns a bundled executable. The app ships no agent SDK: Claude and Codex
# run from their plugins, which install their own SDKs and binaries.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@vscode/ripgrep/**
  - node_modules/@vscode/ripgrep-*/**

# The version is CalVer (YYYY.MINOR.PATCH). No spaces in the name: a GitHub Release asset with a space
# is renamed with dots, and a download link should be typeable.
artifactName: onixlabs-studio-${version}-${os}-${arch}.${ext}

# The release workflow uploads the artifacts itself, after every target built; electron-builder must
# never publish on its own (it would, given a GH_TOKEN in the environment).
publish: null

# Register the app with the operating system as an editor for the file types its editors handle
# (macOS: CFBundleDocumentTypes; Windows: NSIS registry associations; Linux: MimeType entries in the
# .desktop file). Registration makes the app available in "Open with" and eligible to be chosen as
# the default; it does not forcibly steal existing defaults. Keep this list in step with the
# renderer's extension→editor routing (monaco-languages EXTENSION_TO_LANGUAGE + the markdown editor).
fileAssociations:
  - ext: [md, markdown]
    name: Markdown Document
    role: Editor
  - ext:
      [
        txt,
        js,
        mjs,
        cjs,
        jsx,
        ts,
        tsx,
        json,
        html,
        htm,
        css,
        scss,
        sass,
        less,
        xml,
        yaml,
        yml,
        py,
        rb,
        java,
        c,
        cpp,
        h,
        cs,
        go,
        rs,
        php,
        sql,
        sh,
        bash,
        zsh,
        ps1,
        swift,
        kt,
        r,
        lua,
        pl,
        graphql,
        vue,
        svelte,
      ]
    name: Source File
    role: Editor

# No `arch:` on the mac targets. An explicit arch list here *overrides* electron-builder's
# `--x64` / `--arm64` CLI flags, so pinning `[arm64, x64]` made both release runners build both
# architectures: every macOS job emitted all four artifacts under identical filenames, and the
# release job's artifact merge then had two jobs writing the same paths at once. That spliced the
# 2026.1.0-beta.4 Intel dmg out of two different builds and macOS refused to mount it (#617).
# Omitting `arch` lets the CLI flag decide, which is what the per-architecture release matrix means.
mac:
  target:
    - target: dmg
    - target: zip
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Signed with the ONIXLABS LIMITED Developer ID and notarised, but only when the credentials are
  # there: the release workflow supplies them (CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY,
  # APPLE_API_KEY_ID, APPLE_API_ISSUER) and checks the result. Without them electron-builder signs
  # with a Developer ID it finds in the local keychain, or with none, and skips notarisation with a
  # warning, so a local build still works. No `identity:` pin, which would fail every machine without
  # the certificate. Notarisation requires the hardened runtime (on by default, stated here so it is
  # never turned off by accident) and the entitlements below.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Development
  synopsis: A modern cross-platform integrated development environment
