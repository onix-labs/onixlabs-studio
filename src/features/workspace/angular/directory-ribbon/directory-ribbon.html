<app-ribbon-overflow>
  <app-ribbon-strip-group title="Solution">
    <app-ribbon-strip-button
      [icon]="Icon.BUILD"
      label="Build"
      [disabled]="!canBuild() || running()"
      (action)="onBuild()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.REBUILD"
      label="Rebuild"
      [disabled]="!canRebuild() || running()"
      (action)="onRebuild()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.CLEAN"
      label="Clean"
      [disabled]="!canClean() || running()"
      (action)="onClean()"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Edit">
    <app-ribbon-strip-column>
      <app-ribbon-strip-button-small [icon]="Icon.CUT" label="Cut" (action)="onCut()" />
      <app-ribbon-strip-button-small [icon]="Icon.COPY" label="Copy" (action)="onCopy()" />
      <app-ribbon-strip-button-small [icon]="Icon.PASTE" label="Paste" (action)="onPaste()" />
    </app-ribbon-strip-column>
    <app-ribbon-strip-column>
      <app-ribbon-strip-button-small [icon]="Icon.UNDO" label="Undo" (action)="onUndo()" />
      <app-ribbon-strip-button-small [icon]="Icon.REDO" label="Redo" (action)="onRedo()" />
      <app-ribbon-strip-button-small [icon]="Icon.SEARCH" label="Find" (action)="onFind()" />
    </app-ribbon-strip-column>
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Run">
    @if (running()) {
      <app-ribbon-strip-button [icon]="Icon.STOP" label="Stop" (action)="onStop()" />
    } @else {
      <app-ribbon-strip-button
        [icon]="Icon.PLAY"
        label="Start"
        [disabled]="!canRun()"
        (action)="onRun()"
      />
    }
    <app-ribbon-strip-column [spread]="true">
      <app-dropdown
        [options]="runOptions()"
        [value]="selectedRunId() ?? ''"
        [disabled]="running() || !canRun()"
        [fullWidth]="true"
        ariaLabel="Run configuration"
        (valueChange)="onSelectRunItem($event)"
      />
      <app-ribbon-strip-row>
        <app-ribbon-strip-button-small [icon]="Icon.DEBUG" label="Debug" [disabled]="true" />
        <app-ribbon-strip-button-small [icon]="Icon.SETTINGS" label="Configure" [disabled]="true" />
      </app-ribbon-strip-row>
    </app-ribbon-strip-column>
  </app-ribbon-strip-group>

  @if (targetGroupVisible()) {
    <app-ribbon-strip-group title="Target">
      <app-ribbon-strip-column [spread]="true">
        @if (buildConfigNames().length > 0) {
          <app-ribbon-strip-field
            label="Configuration"
            [options]="buildConfigNames()"
            [value]="buildConfigValue()"
            (changed)="onSelectBuildConfiguration($event)"
          />
        }
        @if (targetAxis() !== null) {
          <app-ribbon-strip-field
            [label]="targetAxis()!.label"
            [options]="targetNames()"
            [value]="targetValue()"
            (changed)="onSelectTarget($event)"
          />
        }
      </app-ribbon-strip-column>
    </app-ribbon-strip-group>
  }

  <app-ribbon-strip-group title="Source Control">
    <app-ribbon-strip-column>
      <app-ribbon-strip-button
        [icon]="Icon.SOURCE_CONTROL"
        label="Source Control"
        [disabled]="!hasRepository()"
        (action)="onOpenSourceControl()"
      />
    </app-ribbon-strip-column>
    <app-ribbon-strip-column>
      <app-ribbon-strip-button-small
        [icon]="Icon.GIT_COMMIT"
        label="Commit"
        [disabled]="!hasRepository()"
        (action)="onCommit()"
      />
      <app-ribbon-strip-button-small
        [icon]="Icon.ARROW_UP"
        label="Push"
        [disabled]="!hasRepository()"
        (action)="onPush()"
      />
      <app-ribbon-strip-button-small
        [icon]="Icon.ARROW_DOWN"
        label="Pull"
        [disabled]="!hasRepository()"
        (action)="onPull()"
      />
    </app-ribbon-strip-column>
  </app-ribbon-strip-group>
</app-ribbon-overflow>
