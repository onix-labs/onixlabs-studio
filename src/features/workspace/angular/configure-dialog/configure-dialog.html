<app-modal
  [open]="isOpen()"
  [width]="58"
  [height]="34"
  [expandable]="true"
  ariaLabel="Run Configurations"
  (dismiss)="onCancel()"
>
  <ng-template appModalContent>
    <div class="configure">
      <!-- Title and Auto-configure share the header line: the dialog says what it is, and the one
           action that authors configurations rather than editing them sits opposite. -->
      <header class="configure__header">
        <h2 class="configure__title">Run Configurations</h2>
        <app-button
          [icon]="Icon.AGENT"
          label="Auto-configure"
          tooltip="Let the agent set up this project's run configurations"
          (click)="onAutoConfigure()"
        />
      </header>

      <div class="configure__body">
        <!-- The list panel owns its own controls: New, Duplicate and Delete sit inside its border,
             above the tree they act on, rather than floating over the dialog. -->
        <div class="configure__sidebar">
          <div class="configure__toolbar">
            <app-button
              variant="none"
              size="small"
              [icon]="Icon.PLUS"
              ariaLabel="New configuration"
              tooltip="New configuration"
              (click)="onNew()"
            />
            <app-button
              variant="none"
              size="small"
              [icon]="Icon.COPY"
              ariaLabel="Duplicate configuration"
              tooltip="Duplicate configuration"
              [disabled]="selected() === null"
              (click)="onDuplicate()"
            />
            <app-button
              variant="none"
              size="small"
              [icon]="Icon.TRASH"
              ariaLabel="Delete configuration"
              tooltip="Delete configuration"
              [disabled]="selected() === null"
              (click)="onDelete()"
            />
          </div>

          <div class="configure__list">
            @if (rows().length > 0) {
              <app-tree-view
                [rows]="rows()"
                [selectedId]="selectedRowId()"
                (rowClick)="onRowClick($event)"
              >
                <!-- The shared tree classes, so a group row reads as a heading exactly as a root row
                     does in the Solution Explorer: semibold, no colour lift. -->
                <ng-template let-row>
                  <span class="tree-name" [class.bold]="asRow(row).isGroup">{{
                    asRow(row).label
                  }}</span>
                </ng-template>
              </app-tree-view>
            } @else {
              <p class="configure__empty">No run configurations. Use + to add one.</p>
            }
          </div>
        </div>

        <div class="configure__detail">
          @if (selected(); as configuration) {
            <app-setting-row label="Name">
              <app-text-field [value]="configuration.name" (valueChange)="onName($event)" />
            </app-setting-row>

            <app-setting-row
              label="Default"
              description="Run this on a single press, from Mission Control's Run button"
            >
              <app-toggle [checked]="isDefault()" (checkedChange)="onDefaultChange($event)" />
            </app-setting-row>

            @if (hasBuildConfigs()) {
              <app-setting-row label="Configuration">
                <app-dropdown
                  [options]="buildConfigOptions()"
                  [value]="configuration.buildConfiguration ?? ''"
                  [fullWidth]="true"
                  (valueChange)="onBuildConfiguration($event)"
                />
              </app-setting-row>
            }

            @if (hasTarget()) {
              <app-setting-row [label]="targetLabel()">
                <app-dropdown
                  [options]="targetOptions()"
                  [value]="configuration.target ?? ''"
                  [fullWidth]="true"
                  (valueChange)="onTarget($event)"
                />
              </app-setting-row>
            }

            <app-setting-row label="Program">
              <app-text-field
                [value]="configuration.program ?? ''"
                placeholder="Resolved by the provider when empty"
                (valueChange)="onProgram($event)"
              />
            </app-setting-row>

            <app-setting-row label="Arguments">
              <app-text-field [value]="argsText()" (valueChange)="onArgs($event)" />
            </app-setting-row>

            <app-setting-row label="Working Directory">
              <app-text-field
                [value]="configuration.cwd ?? ''"
                placeholder="Workspace root when empty"
                (valueChange)="onCwd($event)"
              />
            </app-setting-row>

            <app-setting-row label="Environment" description="One KEY=value per line">
              <app-textarea
                #env
                class="configure__env"
                ariaLabel="Environment variables"
                [rows]="3"
                [value]="envText()"
                (blurred)="onEnv(env.value())"
              />
            </app-setting-row>

            <app-setting-row label="Debug" description="Run under the debugger">
              <app-toggle [checked]="isDebug()" (checkedChange)="onModeChange($event)" />
            </app-setting-row>

            <app-setting-row
              label="New Window"
              description="Show this run's terminal in its own window"
            >
              <app-toggle
                [checked]="isWindowPresentation()"
                (checkedChange)="onPresentationChange($event)"
              />
            </app-setting-row>
          } @else {
            <p class="configure__empty">Select or create a configuration to edit.</p>
          }
        </div>
      </div>

      <div class="configure__actions">
        <app-button label="Cancel" (click)="onCancel()" />
        <app-button variant="solid" label="Save" (click)="onSave()" />
      </div>
    </div>

    <!-- Declared INSIDE this dialog's content so it is raised from the Run Configurations window: it
         parents to that window and dims it, rather than reaching past it to the main window. Its
         content is still to be designed. -->
    <app-modal
      [open]="autoConfigureOpen()"
      [width]="34"
      [height]="22"
      ariaLabel="Auto-configure run configurations"
      (dismiss)="onAutoConfigureClose()"
    >
      <ng-template appModalContent>
        <div class="configure-auto">
          <h2 class="configure__title">Auto-configure</h2>
          <div class="configure__actions">
            <app-button label="Close" (click)="onAutoConfigureClose()" />
          </div>
        </div>
      </ng-template>
    </app-modal>
  </ng-template>
</app-modal>
