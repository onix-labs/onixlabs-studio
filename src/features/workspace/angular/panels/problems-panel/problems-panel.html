@if (diagnostics.all().length > 0) {
  <div class="problems-summary">
    <span class="problems-count problems-count--error">
      <app-icon [icon]="Icon.ERROR" />
      {{ diagnostics.errorCount() }}
    </span>
    <span class="problems-count problems-count--warning">
      <app-icon [icon]="Icon.WARNING" />
      {{ diagnostics.warningCount() }}
    </span>
  </div>

  <ul class="problems-list" role="list">
    @for (diagnostic of diagnostics.all(); track trackBy($index, diagnostic)) {
      <li>
        <button
          type="button"
          class="problems-row"
          [class]="'problems-row problems-row--' + diagnostic.severity"
          [disabled]="diagnostic.documentId === null"
          (click)="reveal(diagnostic)"
        >
          <app-icon class="problems-icon" [icon]="iconFor(diagnostic.severity)" />
          <span class="problems-message">{{ diagnostic.message }}</span>
          <span class="problems-location">
            @if (diagnostic.source) {
              <span class="problems-source">{{ diagnostic.source }}</span>
            }
            {{ diagnostic.file }}:{{ diagnostic.line }}:{{ diagnostic.column }}
          </span>
        </button>
      </li>
    }
  </ul>
} @else {
  <div class="problems-empty">
    <app-icon [icon]="Icon.SUCCESS" />
    <p>No problems detected.</p>
  </div>
}
