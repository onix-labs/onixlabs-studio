@if (workspace.hasWorkspace()) {
  <app-explorer-toolbar
    [query]="query()"
    searchPlaceholder="Search files"
    (queryChange)="onSearch($event)"
    (expandAll)="expandAll()"
    (collapseAll)="collapseAll()"
  />

  <app-tree-view
    [rows]="rows()"
    [selectedId]="workspace.selectedPath()"
    (rowClick)="onRowClick($event)"
  >
    <ng-template let-row>
      @let node = nodeOf(row);
      <app-icon
        class="tree-icon"
        [class.tree-icon--folder]="node.type === 'directory'"
        [icon]="iconFor(node)"
      />
      <span class="tree-name" [class.bold]="node.type === 'directory' && node.expanded">
        <app-highlighted-text [text]="node.name" [query]="query()" />
      </span>

      @if (statusFor(node.path); as status) {
        <span class="tree-status">{{ statusLetter(status) }}</span>
      } @else if (node.type === 'directory' && folderChanged(node.path)) {
        <span class="tree-status tree-status--dot" aria-hidden="true">•</span>
      }

      @if (node.loading) {
        <app-icon class="tree-loading" [icon]="Icon.SPINNER" />
      }
    </ng-template>
  </app-tree-view>
} @else {
  <div class="tree-empty">
    <p>You haven't opened a folder yet.</p>
    <app-button [icon]="Icon.FOLDER_OPEN" label="Open Folder…" (click)="workspace.openFolder()" />
  </div>
}
