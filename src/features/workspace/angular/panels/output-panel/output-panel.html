<app-panel-toolbar>
  <app-dropdown
    class="logs__channel"
    [options]="channelOptions()"
    [value]="channelValue()"
    (valueChange)="selectChannel($event)"
    ariaLabel="Output channel"
    data-testid="logs-channel"
  />
  <app-dropdown
    class="logs__level"
    [options]="levelOptions"
    [value]="levelFilter()"
    (valueChange)="levelFilter.set($event)"
    ariaLabel="Level"
    data-testid="logs-level"
  />
  <app-text-field
    class="logs__search"
    kind="search"
    [value]="query()"
    placeholder="Filter"
    ariaLabel="Filter log lines"
    (valueChange)="query.set($event)"
  />
  <app-button
    variant="none"
    [icon]="Icon.CLEAR"
    ariaLabel="Clear output"
    tooltip="Clear"
    (click)="clear()"
  />
</app-panel-toolbar>
<div class="logs__list">
  <app-table
    class="logs__table"
    [columns]="columns()"
    [rows]="rows()"
    [virtual]="true"
    [followEnd]="true"
    [emptyText]="emptyText()"
  >
    <!-- Every string is built once per line (rows), so a pass only reads them. -->
    <ng-template appTableRow let-row>
      @let line = lineOf(row);
      <td class="logs__time">{{ line.time }}</td>
      <td>
        <app-chip class="logs__badge" [tone]="line.tone">{{ line.level }}</app-chip>
      </td>
      @if (showAll()) {
        <td class="logs__source" [title]="line.source">{{ line.source }}</td>
      }
      <td class="logs__message" [title]="line.message">{{ line.message }}</td>
    </ng-template>
  </app-table>
</div>
