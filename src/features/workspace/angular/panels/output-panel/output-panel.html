<app-panel-toolbar>
  <app-dropdown
    [options]="channelOptions()"
    [value]="activeChannelId()"
    (valueChange)="selectChannel($event)"
    ariaLabel="Output channel"
  />
  <span class="panel-toolbar__spacer"></span>
  <app-button
    variant="none"
    [icon]="Icon.CLEAR"
    ariaLabel="Clear output"
    tooltip="Clear"
    (click)="clear()"
  />
</app-panel-toolbar>
<div #container class="output-host"></div>
