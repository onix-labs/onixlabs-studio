@if (model(); as solution) {
  <app-explorer-toolbar
    [query]="query()"
    searchPlaceholder="Search solution"
    (queryChange)="onSearch($event)"
    (expandAll)="expandAll()"
    (collapseAll)="collapseAll()"
  />

  <app-tree-view
    [rows]="rows()"
    [selectedId]="selectedKey()"
    [virtual]="true"
    (rowClick)="onRowClick($event)"
  >
    <ng-template let-row>
      @let r = rowOf(row);
      <app-icon
        class="tree-icon"
        [class.tree-icon--folder]="r.kind === 'folder' || r.kind === 'item-folder'"
        [class.tree-icon--project]="r.kind === 'project' || r.kind === 'solution'"
        [class.tree-icon--loading]="r.loading"
        [icon]="iconFor(r)"
      />
      <span class="tree-name" [class.bold]="r.kind === 'solution'">
        <app-highlighted-text [text]="r.label" [query]="query()" />
      </span>

      @if (statusFor(r.path); as status) {
        <span class="tree-status">{{ statusLetter(status) }}</span>
      }

      @if (r.loading) {
        <app-icon class="tree-loading" [icon]="Icon.SPINNER" />
      }
    </ng-template>
  </app-tree-view>
} @else {
  <div class="tree-empty">
    <p>No solution or projects detected in this folder.</p>
  </div>
}
