<app-panel-layout layoutKey="code">
  <div main class="code-layout__editor">
    <app-code-document
      [documentId]="tabId()"
      [removeOnDestroy]="removeOnDestroy()"
      [isActive]="isActive()"
      (ready)="onReady()"
      (cursorChange)="onCursorChange($event)"
      (eolChange)="onEolChange($event)"
    />
  </div>

  @if (terminalMounted()) {
    <app-panel
      panelId="terminal"
      defaultEdge="bottom"
      [visible]="terminalVisible()"
      [defaultSize]="260"
      [minSize]="80"
      [maxSize]="1600"
    >
      <app-code-terminal-panel [tabId]="tabId()" [isActive]="isActive() && terminalVisible()" />
    </app-panel>
  }

  @if (agentMounted()) {
    <app-panel
      panelId="agent"
      defaultEdge="right"
      [visible]="agentVisible()"
      [defaultSize]="360"
      [minSize]="240"
      [maxSize]="900"
    >
      <app-code-agent-panel [tabId]="tabId()" [isActive]="isActive() && agentVisible()" />
    </app-panel>
  }

  @if (findVisible()) {
    <app-panel
      panelId="find"
      defaultEdge="right"
      [defaultSize]="320"
      [minSize]="260"
      [maxSize]="520"
    >
      <app-find-panel [adapter]="findAdapter" (closed)="onFindClosed()" />
    </app-panel>
  }
</app-panel-layout>
