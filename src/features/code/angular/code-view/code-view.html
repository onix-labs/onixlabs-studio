<ng-template
  [appDockPanel]="editorPanel"
  panelTitle="Editor"
  [panelIcon]="Icon.CODE"
  panelRole="main"
>
  <div class="code-layout__editor">
    <app-code-document
      [documentId]="tabId()"
      [removeOnDestroy]="removeOnDestroy()"
      [isActive]="isActive()"
      (ready)="onReady()"
      (cursorChange)="onCursorChange($event)"
      (eolChange)="onEolChange($event)"
      (indentationChange)="indent.set($event)"
      (selectionChange)="onSelectionChange($event)"
    />
  </div>
</ng-template>

<ng-template
  [appDockPanel]="terminalPanel"
  panelTitle="Terminal"
  [panelIcon]="Icon.TERMINAL"
  [minBlockSize]="5"
  [defaultSize]="260"
  [maxSize]="1600"
>
  <app-code-terminal-panel [tabId]="tabId()" [isActive]="isActive()" />
</ng-template>

<ng-template
  [appDockPanel]="agentPanel"
  panelTitle="Agent"
  [panelIcon]="Icon.AGENT"
  [defaultSize]="360"
  [maxSize]="900"
>
  <app-agent-conversation-panel
    [tabId]="tabId()"
    [isActive]="isActive()"
    [context]="fileContext()"
    [language]="language()"
  />
</ng-template>

<!-- Drawn only while it shows, and reads nothing until it first is. -->
<ng-template
  [appDockPanel]="generatedPanel"
  panelTitle="Generated code"
  [panelIcon]="Icon.CODE"
  [minInlineSize]="17.5"
  [defaultSize]="420"
  [maxSize]="900"
>
  <app-code-generated-panel
    [sourcePath]="generatedSourcePath()"
    [caretLine]="generatedCaretLine()"
    (editorCreated)="onGeneratedEditor($event)"
  />
</ng-template>

<ng-template
  [appDockPanel]="findPanel"
  [panelTitle]="editorSearch.replaceable() ? 'Find and Replace' : 'Find'"
  [panelIcon]="Icon.SEARCH"
  [defaultSize]="320"
  [maxSize]="520"
>
  <app-editor-search-panel [search]="editorSearch" (closed)="onFindClosed()" />
</ng-template>

<!-- Find All References outside a workspace (#1014): the tab's own list, beside the editor. -->
<ng-template
  [appDockPanel]="referencesPanel"
  panelTitle="References"
  [panelIcon]="Icon.REFERENCES"
  [defaultSize]="320"
  [maxSize]="520"
>
  <app-editor-references-panel
    [list]="references()"
    (chosen)="onReferenceChosen($event)"
    (closed)="onReferencesClosed()"
  />
</ng-template>

<app-dock-container />
