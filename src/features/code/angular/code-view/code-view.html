<app-panel-layout layoutKey="code">
  <div main class="code-layout__editor">
    <app-code-document
      [documentId]="tabId()"
      [removeOnDestroy]="removeOnDestroy()"
      [isActive]="isActive()"
      (ready)="onReady()"
      (cursorChange)="onCursorChange($event)"
      (eolChange)="onEolChange($event)"
      (selectionChange)="onSelectionChange($event)"
    />
  </div>

  @if (terminalMounted()) {
    <app-panel
      panelId="terminal"
      defaultEdge="bottom"
      [allowedEdges]="terminalDockEdges"
      [visible]="terminalVisible()"
      [defaultSize]="260"
      [minSize]="80"
      [maxSize]="1600"
    >
      <app-code-terminal-panel [tabId]="tabId()" [isActive]="isActive() && terminalVisible()" />
    </app-panel>
  }

  <!-- The agent panel mounts on first show; Mission Control registration is service-only (the view
       provides the agent and registers it in ngOnInit), so an unopened panel costs no DOM. -->
  @if (agentMounted()) {
    <app-panel
      panelId="agent"
      defaultEdge="right"
      [visible]="agentVisible()"
      [defaultSize]="360"
      [minSize]="240"
      [maxSize]="900"
    >
      <app-code-agent-panel [tabId]="tabId()" [isActive]="isActive() && agentVisible()" />
    </app-panel>
  }

  <!-- Mounts on first show, like the agent panel: an unopened panel reads no build output and costs
       no DOM. -->
  @if (generatedMounted()) {
    <app-panel
      panelId="generated"
      defaultEdge="right"
      [visible]="generatedVisible()"
      [defaultSize]="420"
      [minSize]="280"
      [maxSize]="900"
    >
      <app-code-generated-panel
        [sourcePath]="generatedSourcePath()"
        [caretLine]="generatedCaretLine()"
        (closed)="onGeneratedClosed()"
      />
    </app-panel>
  }

  @if (findVisible()) {
    <app-panel
      panelId="find"
      defaultEdge="right"
      [defaultSize]="320"
      [minSize]="260"
      [maxSize]="520"
    >
      <app-find-panel [adapter]="findAdapter" (closed)="onFindClosed()" />
    </app-panel>
  }
</app-panel-layout>
