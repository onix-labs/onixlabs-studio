<div class="code-agent">
  <div class="code-agent__bar" appPanelDragHandle="Agent">
    <app-icon class="code-agent__icon" [icon]="Icon.AGENT" />
    <span class="code-agent__title">Agent</span>
    <span class="code-agent__spacer"></span>
    <app-button
      variant="none"
      size="small"
      [icon]="Icon.CLOSE"
      ariaLabel="Close agent"
      tooltip="Close agent"
      (click)="onClose()"
    />
  </div>
  <div class="code-agent__body">
    @if (tabId()) {
      <app-agent-conversation-panel
        [tabId]="tabId()"
        [isActive]="isActive()"
        [context]="fileContext()"
      />
    }
  </div>
</div>
