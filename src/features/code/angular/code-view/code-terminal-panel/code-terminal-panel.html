<div class="code-terminal">
  <div class="code-terminal__bar" appPanelDragHandle="Terminal">
    <span class="code-terminal__title">Terminal</span>
    <span class="code-terminal__spacer"></span>
    <button
      type="button"
      aria-label="Move terminal to side or bottom"
      title="Move terminal to side or bottom"
      (click)="onLayout()"
    >
      <app-icon [icon]="Icon.LAYOUT_SPLIT" />
    </button>
    <button type="button" aria-label="Cut" title="Cut" (click)="onCut()">
      <app-icon [icon]="Icon.CUT" />
    </button>
    <button type="button" aria-label="Copy" title="Copy" (click)="onCopy()">
      <app-icon [icon]="Icon.COPY" />
    </button>
    <button type="button" aria-label="Clear" title="Clear" (click)="onClear()">
      <app-icon [icon]="Icon.CLEAR" />
    </button>
    <button type="button" aria-label="Close terminal" title="Close terminal" (click)="onClose()">
      <app-icon [icon]="Icon.CLOSE" />
    </button>
  </div>
  <div class="code-terminal__body">
    @if (tabId()) {
      <app-terminal [terminalId]="runTerminalId()" [isActive]="isActive()" (ready)="onReady()" />
    }
  </div>
</div>
