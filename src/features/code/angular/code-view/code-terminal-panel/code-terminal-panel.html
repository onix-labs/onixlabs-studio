<app-panel-toolbar>
  <app-button
    variant="none"
    [icon]="Icon.LAYOUT_SPLIT"
    ariaLabel="Move terminal to side or bottom"
    tooltip="Move terminal to side or bottom"
    (click)="onLayout()"
  />
  <app-button variant="none" [icon]="Icon.CUT" ariaLabel="Cut" tooltip="Cut" (click)="onCut()" />
  <app-button
    variant="none"
    [icon]="Icon.COPY"
    ariaLabel="Copy"
    tooltip="Copy"
    (click)="onCopy()"
  />
  <app-button
    variant="none"
    [icon]="Icon.CLEAR"
    ariaLabel="Clear"
    tooltip="Clear"
    (click)="onClear()"
  />
</app-panel-toolbar>

<div class="code-terminal__body">
  @if (tabId()) {
    <app-terminal
      [terminalId]="runTerminalId()"
      [persistent]="true"
      [isActive]="isActive()"
      (ready)="onReady()"
    />
  }
</div>
