<app-tool-panel
  title="Terminal"
  [icon]="Icon.TERMINAL"
  closeLabel="Close terminal"
  [flush]="true"
  (closed)="onClose()"
>
  <!-- The terminal's own controls sit in the shared header's action slot, so this panel's chrome is
       the same chrome every other docked panel wears. -->
  <app-button
    panelActions
    variant="none"
    size="small"
    [icon]="Icon.LAYOUT_SPLIT"
    ariaLabel="Move terminal to side or bottom"
    tooltip="Move terminal to side or bottom"
    (click)="onLayout()"
  />
  <app-button
    panelActions
    variant="none"
    size="small"
    [icon]="Icon.CUT"
    ariaLabel="Cut"
    tooltip="Cut"
    (click)="onCut()"
  />
  <app-button
    panelActions
    variant="none"
    size="small"
    [icon]="Icon.COPY"
    ariaLabel="Copy"
    tooltip="Copy"
    (click)="onCopy()"
  />
  <app-button
    panelActions
    variant="none"
    size="small"
    [icon]="Icon.CLEAR"
    ariaLabel="Clear"
    tooltip="Clear"
    (click)="onClear()"
  />

  <div class="code-terminal__body">
    @if (tabId()) {
      <app-terminal [terminalId]="runTerminalId()" [isActive]="isActive()" (ready)="onReady()" />
    }
  </div>
</app-tool-panel>
