<div class="code-terminal">
  <div class="code-terminal__bar" appPanelDragHandle="Terminal">
    <span class="code-terminal__title">Terminal</span>
    <span class="code-terminal__spacer"></span>
    <app-button
      variant="none"
      size="small"
      [icon]="Icon.LAYOUT_SPLIT"
      ariaLabel="Move terminal to side or bottom"
      tooltip="Move terminal to side or bottom"
      (click)="onLayout()"
    />
    <app-button
      variant="none"
      size="small"
      [icon]="Icon.CUT"
      ariaLabel="Cut"
      tooltip="Cut"
      (click)="onCut()"
    />
    <app-button
      variant="none"
      size="small"
      [icon]="Icon.COPY"
      ariaLabel="Copy"
      tooltip="Copy"
      (click)="onCopy()"
    />
    <app-button
      variant="none"
      size="small"
      [icon]="Icon.CLEAR"
      ariaLabel="Clear"
      tooltip="Clear"
      (click)="onClear()"
    />
    <app-button
      variant="none"
      size="small"
      [icon]="Icon.CLOSE"
      ariaLabel="Close terminal"
      tooltip="Close terminal"
      (click)="onClose()"
    />
  </div>
  <div class="code-terminal__body">
    @if (tabId()) {
      <app-terminal [terminalId]="runTerminalId()" [isActive]="isActive()" (ready)="onReady()" />
    }
  </div>
</div>
