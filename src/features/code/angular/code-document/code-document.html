<app-text-editor
  [content]="doc()?.content() ?? ''"
  [language]="doc()?.language() ?? 'plaintext'"
  [options]="editorOptions()"
  [readOnly]="doc()?.readOnly() ?? false"
  [newDocumentEol]="newDocumentEol()"
  [editorConfig]="doc()?.editorConfig() ?? null"
  [isActive]="isActive()"
  (ready)="onReady()"
  (contentChange)="onContentChange($event)"
  (cursorChange)="onCursorChange($event)"
  (eolChange)="onEolChange($event)"
  (indentationChange)="indentationChange.emit($event)"
  (selectionChange)="onSelectionChange($event)"
/>

@if (editingLine() !== null) {
  <div class="breakpoint-editor">
    <div class="breakpoint-editor__title">Breakpoint · line {{ editingLine() }}</div>
    <div class="breakpoint-editor__field">
      <span class="breakpoint-editor__label">Condition</span>
      <app-text-field
        [value]="editCondition()"
        placeholder="e.g. count > 3"
        (valueChange)="editCondition.set($event)"
      />
    </div>
    <div class="breakpoint-editor__field">
      <span class="breakpoint-editor__label">Log message</span>
      <app-text-field
        [value]="editLogMessage()"
        placeholder="logpoint, e.g. value = {value}"
        (valueChange)="editLogMessage.set($event)"
      />
    </div>
    <div class="breakpoint-editor__toggle">
      <app-toggle [checked]="editEnabled()" (checkedChange)="editEnabled.set($event)" />
      <span class="breakpoint-editor__label">Enabled</span>
    </div>
    <app-button-row class="breakpoint-editor__actions">
      <app-button variant="solid" label="Save" (click)="saveBreakpointEdit()" />
      <app-button variant="ghost" tone="danger" label="Remove" (click)="removeBreakpointEdit()" />
      <app-button variant="none" label="Cancel" (click)="closeBreakpointEdit()" />
    </app-button-row>
  </div>
}

<!--
  Print-only full-file rendering. Monaco is virtualised — only the visible lines exist in the DOM — so
  it prints just the viewport. This mirror of the whole document is hidden on screen, filled just
  before a print (coloured and numbered as the Printing settings choose) and swapped in for the editor
  by the print stylesheet, so the entire file paginates. It is emptied again once the print is done.
-->
<pre #printMirror class="code-print" aria-hidden="true"></pre>
