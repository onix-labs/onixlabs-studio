@switch (kind()) {
  @case ('toggle') {
    <app-toggle
      [checked]="$any(current())"
      [disabled]="disabled()"
      (checkedChange)="onChange($event)"
    />
  }
  @case ('text') {
    <app-text-field
      [value]="$any(current())"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      (valueChange)="onChange($event)"
    />
  }
  @case ('folder') {
    <span class="setting-control__folder">
      <app-text-field
        [value]="$any(current())"
        [placeholder]="placeholder()"
        [disabled]="disabled()"
        (valueChange)="onChange($event)"
      />
      <app-button
        variant="ghost"
        label="Choose Folder"
        [icon]="Icon.FOLDER_OPEN"
        [disabled]="disabled()"
        data-testid="setting-folder-choose"
        (click)="chooseFolder()"
      />
    </span>
  }
  @case ('number') {
    <app-number-field
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="$any(current())"
      [disabled]="disabled()"
      (valueChange)="onChange($event)"
    />
  }
  @case ('select') {
    <app-dropdown
      [options]="options()"
      [value]="currentString()"
      [disabled]="disabled()"
      (valueChange)="onChange($event)"
    />
  }
  @case ('buttonGroup') {
    <app-button-group
      [options]="options()"
      [value]="$any(current())"
      (valueChange)="onChange($event)"
    />
  }
  @case ('accent') {
    <app-accent-picker [value]="$any(current())" (valueChange)="onChange($event)" />
  }
}
