<div class="write-paths">
  <div class="write-paths__group">
    <app-setting-row
      label="Allowed write paths"
      description="Absolute directories the agent may write to beyond the workspace root. A write is otherwise confined to the workspace."
    >
      <app-button
        variant="solid"
        [icon]="Icon.FOLDER_PLUS"
        label="Add folder…"
        (click)="choose('allow')"
      />
    </app-setting-row>

    @if (allowed().length) {
      <ul class="write-paths__list">
        @for (path of allowed(); track $index) {
          <li class="write-paths__item">
            <span class="write-paths__path">{{ path }}</span>
            <app-button
              variant="none"
              size="small"
              [icon]="Icon.CLOSE"
              [ariaLabel]="'Remove allowed path ' + path"
              (click)="remove('allow', $index)"
            />
          </li>
        }
      </ul>
    }
  </div>

  <div class="write-paths__group">
    <app-setting-row
      label="Denied write paths"
      description="Directories the agent may never write to, even inside the workspace."
    >
      <app-button
        variant="solid"
        [icon]="Icon.FOLDER_PLUS"
        label="Add folder…"
        (click)="choose('deny')"
      />
    </app-setting-row>

    @if (denied().length) {
      <ul class="write-paths__list">
        @for (path of denied(); track $index) {
          <li class="write-paths__item">
            <span class="write-paths__path">{{ path }}</span>
            <app-button
              variant="none"
              size="small"
              [icon]="Icon.CLOSE"
              [ariaLabel]="'Remove denied path ' + path"
              (click)="remove('deny', $index)"
            />
          </li>
        }
      </ul>
    }
  </div>
</div>
