<!-- General: settings that apply to every agent, whichever provider it runs through. -->
@if (view() === 'general') {
  <section class="ai-group">
    <app-setting-row
      label="Auto-Scroll Transcripts"
      description="Keep agent conversations pinned to the newest message as the response streams. Scrolling up pauses the follow; scrolling back to the bottom resumes it. Applies to every agent view."
    >
      <app-setting-control key="ai.autoScroll" />
    </app-setting-row>

    <app-setting-row
      label="Conversation Text Size"
      description="How large agent conversations render: the transcript, and the prompt you type into. Applies to every agent view."
    >
      <app-setting-control key="ai.conversationTextSize" />
    </app-setting-row>

    <app-setting-row
      label="Report Background Tasks Back"
      description="When a task the agent backgrounded finishes, let the agent pick the conversation back up and tell you what it found, rather than only noting that it finished. The agent resumes on its own and spends tokens to do it, so turn this off to keep an idle conversation idle."
    >
      <app-setting-control key="ai.reportBackgroundTasks" />
    </app-setting-row>

    <app-ai-remote-notifications />

    <app-setting-row
      label="Per-Request Token Cap"
      description="Token budget per turn. 0 means no cap (the provider default)."
    >
      <app-setting-control key="ai.tokenCap" />
    </app-setting-row>

    <app-setting-row
      label="Run Timeout"
      description="How long a single agent run may take before it is cancelled, in minutes."
    >
      <app-setting-control key="ai.runTimeoutMinutes" />
    </app-setting-row>

    <app-setting-row
      label="Keep Agent Sessions Alive For"
      description="How long an idle agent keeps its live session — and its background process — before it is reaped to free resources. The conversation reopens transparently on your next message, keeping its context. 'Indefinitely' never reaps on idle."
    >
      <app-setting-control key="ai.agentSessionLifetime" />
    </app-setting-row>

    <app-setting-row
      label="Maximum Live Agent Sessions"
      description="How many agent conversations keep a live session, and its background process, open at once. Beyond this the least recently used is closed; it reopens on its next message."
    >
      <app-setting-control key="ai.maxLiveSessions" />
    </app-setting-row>
  </section>

  <section class="ai-group">
    <app-setting-row
      label="Send Message With"
      description="The key that sends a message. The other two insert a new line."
    >
      <app-setting-control key="ai.sendMessageWith" />
    </app-setting-row>

    <app-setting-row
      label="Images per Message"
      description="The most images one message can carry. A provider's own limit still applies."
    >
      <app-setting-control key="ai.maxImagesPerMessage" />
    </app-setting-row>

    <app-setting-row
      label="Size per Image"
      description="The largest image that can be attached. A provider's own limit still applies."
    >
      <app-setting-control key="ai.maxImageSizeMb" />
    </app-setting-row>

    <app-setting-row
      label="Expand Tool Calls"
      description="Show each tool call open, with its input and output, rather than folded."
    >
      <app-setting-control key="ai.expandToolCalls" />
    </app-setting-row>

    <app-setting-row
      label="Expand Thinking"
      description="Show the agent's reasoning open, rather than folded behind its label."
    >
      <app-setting-control key="ai.expandThinking" />
    </app-setting-row>

    <app-setting-row
      label="Confirm Before Deleting Conversations"
      description="Ask before conversations are deleted from the conversation list."
    >
      <app-setting-control key="ai.confirmDeleteConversations" />
    </app-setting-row>
  </section>

  <section class="ai-group">
    <app-setting-row
      label="Agent Shell"
      description="The shell whose profile the agent sources its environment (PATH, tokens) from. Choose an installed shell, or use the default login shell."
    >
      <app-shell-picker
        defaultLabel="Default login shell"
        [value]="agentShell()"
        (valueChange)="onAgentShellChange($event)"
      />
    </app-setting-row>
  </section>
}

<!-- Security & permissions: global limits on what any agent may do and where it may write. -->
@if (view() === 'security') {
  <section class="ai-group">
    <app-setting-row
      label="Permission Posture"
      description="How much the agent may do before asking you."
    >
      <app-setting-control key="ai.permissionPosture" />
    </app-setting-row>

    <app-setting-row
      label="Remote Control Posture"
      description="How much a remote peer may do on an agent you expose via Remote Control. Each agent chooses only whether it is exposed; this decides what that exposure means. Full Control lets a peer drive the session; Read-Only lets them watch it."
    >
      <app-setting-control key="ai.remoteControlPosture" />
    </app-setting-row>

    <app-ai-tool-policies />

    <app-setting-row
      label="Keep Agents off the Code Host's Command-Line Tool"
      description="While a code-hosting plugin serves the repository, agents may not run that host's own command-line tool (gh for GitHub) and go through the plugin instead, which asks before it changes anything. Enforced for Claude and for providers that run commands through Studio's terminal; Codex is only told."
    >
      <app-setting-control key="ai.blockHostCommandLine" />
    </app-setting-row>

    <app-ai-write-paths />

    <app-ai-network-locations />
  </section>
}

<!-- Provider: one company's page — a list of configurations the user adds per authentication method. -->
@if (view() === 'provider') {
  <section class="ai-group">
    <app-ai-provider-configurations [pageId]="providerId()" />
  </section>
}
