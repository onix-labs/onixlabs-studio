<div class="tool-policies">
  @for (tool of tools; track tool.name) {
    <app-setting-row [label]="tool.label" [description]="tool.description">
      <app-dropdown
        [options]="policyOptions"
        [value]="policyFor(tool.name)"
        [ariaLabel]="'Permission for ' + tool.label"
        (valueChange)="setPolicy(tool.name, $event)"
      />
    </app-setting-row>
  }
</div>
