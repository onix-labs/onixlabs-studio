<div class="profiles">
  <div class="profiles__header">
    <h3 class="profiles__title">Language profiles</h3>
    <app-button
      class="profiles__add"
      [icon]="Icon.PLUS"
      label="Add profile"
      (click)="addProfile()"
    />
  </div>

  @for (profile of profiles(); track profile.id) {
    <app-accordion [heading]="profile.name">
      <app-setting-row label="Languages" description="Languages this profile applies to.">
        <app-language-select
          [languages]="languageOptions"
          [value]="profile.languages"
          (valueChange)="onLanguagesChange(profile.id, $event)"
        />
      </app-setting-row>

      @for (setting of overridable; track setting.key) {
        <div class="override">
          <!-- The label wraps the checkbox's projected native input, associating them at runtime;
               the lint rule cannot see through the component boundary to verify this statically. -->
          <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
          <label class="override__check">
            <app-checkbox
              [checked]="isOverridden(profile, setting.key)"
              (checkedChange)="onOverrideToggle(profile, setting.key, $event)"
            />
            <span>Override {{ setting.title }}</span>
          </label>

          @switch (setting.control.kind) {
            @case ('toggle') {
              <app-toggle
                [checked]="$any(resolved(profile, setting.key))"
                [disabled]="!isOverridden(profile, setting.key)"
                (checkedChange)="onOverrideValue(profile, setting.key, $event)"
              />
            }
            @case ('number') {
              <app-number-field
                [min]="numberMin(setting)"
                [max]="numberMax(setting)"
                [value]="$any(resolved(profile, setting.key))"
                [disabled]="!isOverridden(profile, setting.key)"
                (valueChange)="onOverrideValue(profile, setting.key, $event)"
              />
            }
            @case ('select') {
              <app-dropdown
                [options]="selectOptions(setting)"
                [value]="$any(resolved(profile, setting.key))"
                [disabled]="!isOverridden(profile, setting.key)"
                (valueChange)="onOverrideValue(profile, setting.key, $event)"
              />
            }
          }
        </div>
      }

      <app-button
        class="profiles__delete"
        [icon]="Icon.TRASH"
        label="Delete profile"
        (click)="deleteProfile(profile.id)"
      />
    </app-accordion>
  }
</div>
