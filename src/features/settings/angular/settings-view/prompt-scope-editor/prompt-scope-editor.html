<app-setting-row label="Applies in" description="Leave empty to apply everywhere.">
  <app-multi-select
    [options]="surfaceOptions"
    [value]="scope().surfaces"
    [disabled]="disabled()"
    placeholder="Everywhere"
    ariaLabel="Surfaces this applies in"
    (valueChange)="onSurfaces($event)"
  />
</app-setting-row>

<app-setting-row
  label="Languages"
  description="Narrows editor runs to these languages. Leave empty for every language; the other surfaces have none."
>
  <app-multi-select
    [options]="languageOptions"
    [value]="scope().languages"
    [disabled]="disabled()"
    placeholder="Every language"
    ariaLabel="Languages this applies to"
    (valueChange)="onLanguages($event)"
  />
</app-setting-row>
