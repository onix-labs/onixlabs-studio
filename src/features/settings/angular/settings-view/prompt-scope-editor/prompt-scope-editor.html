<app-setting-row label="Applies in" description="Leave every box unticked to apply everywhere.">
  <span class="scope__surfaces">
    @for (surface of surfaces; track surface) {
      <!-- The label wraps the checkbox's projected native input, associating them at runtime; the
           lint rule cannot see through the component boundary to verify this statically. -->
      <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
      <label class="scope__surface">
        <app-checkbox
          [checked]="has(surface)"
          [disabled]="disabled()"
          (checkedChange)="toggle(surface, $event)"
        />
        <span>{{ labels[surface] }}</span>
      </label>
    }
  </span>
</app-setting-row>

<app-setting-row
  label="Languages"
  description="Narrows editor runs to these languages. Leave empty for every language; the other surfaces have none."
>
  <app-language-select
    [languages]="languageOptions"
    [value]="scope().languages"
    [disabled]="disabled()"
    (valueChange)="onLanguages($event)"
  />
</app-setting-row>
