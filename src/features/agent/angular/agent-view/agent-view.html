<app-panel-layout layoutKey="agent">
  <app-agent-chat
    main
    [tabId]="tabId()"
    [isActive]="isActive()"
    surface="project"
  />

  @if (conversation.historyOpen()) {
    <app-panel
      panelId="history"
      defaultEdge="right"
      [defaultSize]="320"
      [minSize]="240"
      [maxSize]="600"
    >
      <app-tool-panel
        title="Conversation History"
        [icon]="Icon.RECENT"
        [flush]="true"
        (closed)="conversation.toggleHistory()"
      >
        <app-agent-conversation-list />
      </app-tool-panel>
    </app-panel>
  }
</app-panel-layout>
