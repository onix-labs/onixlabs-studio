<ng-template
  [appDockPanel]="chatPanel"
  panelTitle="Agent"
  [panelIcon]="Icon.AGENT"
  panelRole="main"
>
  <app-agent-chat
    [tabId]="tabId()"
    [isActive]="isActive()"
    [promptFocus]="isActive()"
    surface="project"
  />
</ng-template>

<ng-template
  [appDockPanel]="historyPanel"
  panelTitle="Conversation History"
  [panelIcon]="Icon.RECENT"
  [sides]="DockSides.Horizontal"
  [minInlineSize]="16"
  [defaultInlineSize]="320"
  [maxInlineSize]="600"
>
  <app-agent-conversation-list />
</ng-template>

<app-dock-container />
