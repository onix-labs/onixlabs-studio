<app-ribbon-overflow>
  <app-ribbon-strip-group title="Session">
    <app-ribbon-strip-button
      [icon]="Icon.CHAT_NEW"
      label="New"
      [disabled]="!hasMessages()"
      (action)="newChat()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.STOP"
      label="Stop"
      [disabled]="!isRunning()"
      (action)="stop()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.COMPACT"
      label="Compact"
      [disabled]="isRunning() || !hasMessages()"
      (action)="compact()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.CLEAR"
      label="Clear"
      [disabled]="!hasContext()"
      (action)="clearContext()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.RECENT"
      label="History"
      [toggle]="true"
      [pressed]="historyOpen()"
      (action)="toggleHistory()"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Engine">
    <app-ribbon-strip-column [spread]="true">
      <app-ribbon-strip-field
        label="Provider"
        [options]="providerLabels()"
        [value]="providerLabel()"
        (changed)="onProviderLabel($event)"
      />
      <app-ribbon-strip-field
        label="Model"
        [options]="modelLabels()"
        [value]="modelLabel()"
        (changed)="onModelLabel($event)"
      />
    </app-ribbon-strip-column>
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Attachments">
    <app-ribbon-strip-button [icon]="Icon.ATTACH" label="File" (action)="attachFile()" />
    <app-ribbon-strip-button [icon]="Icon.FOLDER_PLUS" label="Folder" (action)="attachFolder()" />
    <app-ribbon-strip-button
      [icon]="Icon.SELECTION"
      label="Selection"
      (action)="attachSelection()"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Options">
    <app-ribbon-strip-column [spread]="true">
      <app-ribbon-strip-field
        label="Mode"
        [options]="modeLabels"
        [value]="modeLabel()"
        (changed)="onModeLabel($event)"
      />
      <app-ribbon-strip-check
        label="Auto-scroll"
        [checked]="autoScroll()"
        (toggled)="onAutoScroll($event)"
      />
    </app-ribbon-strip-column>
  </app-ribbon-strip-group>
</app-ribbon-overflow>
