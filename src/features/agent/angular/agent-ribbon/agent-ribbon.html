<app-ribbon-overflow>
  <app-ribbon-strip-group title="Session">
    <app-ribbon-strip-button
      [icon]="Icon.CHAT_NEW"
      label="New Chat"
      [disabled]="!hasMessages()"
      (action)="newChat()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.STOP"
      label="Stop"
      tone="danger"
      [disabled]="!isRunning()"
      (action)="stop()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.COMPACT"
      label="Compact"
      [disabled]="isRunning() || !hasMessages()"
      (action)="compact()"
    />
    <!-- Remote Control is on or off; how much a peer may do once on is the global posture, set in
         Settings. The press only opens the confirmation — the toggle flips on Yes. -->
    @if (supportsRemoteControl()) {
      <app-ribbon-strip-button
        [icon]="Icon.REMOTE_CONTROL"
        label="Remote Control"
        [toggle]="true"
        [pressed]="remoteControlEnabled()"
        (action)="onRemoteControlToggle()"
      />
    }
  </app-ribbon-strip-group>

  <!-- What is looked at rather than what is run: where the transcript is scrolled to, and whether the
       past conversations are listed beside it. -->
  <app-ribbon-strip-group title="View">
    <app-ribbon-strip-button
      [icon]="Icon.SCROLL_TO_BOTTOM"
      label="Scroll to Bottom"
      (action)="scrollToBottom()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.RECENT"
      label="History"
      [toggle]="true"
      [pressed]="historyOpen()"
      (action)="toggleHistory()"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Engine">
    <app-ribbon-strip-column [spread]="true">
      <!-- One field for the pair: the models of every connection, grouped under their provider's
           label. The autonomy mode sits beneath, since it too settles how a run is carried out. -->
      <app-ribbon-strip-field
        label="Provider and model"
        [options]="engineOptions()"
        [value]="engineSelection()"
        (changed)="onEngine($event)"
      />
      <app-ribbon-strip-field
        label="Mode"
        [options]="modeLabels"
        [value]="modeLabel()"
        (changed)="onModeLabel($event)"
      />
    </app-ribbon-strip-column>
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Attachments">
    <app-ribbon-strip-button [icon]="Icon.ATTACH" label="File" (action)="attachFile()" />
    <app-ribbon-strip-button [icon]="Icon.FOLDER_PLUS" label="Folder" (action)="attachFolder()" />
    <app-ribbon-strip-button
      [icon]="Icon.SELECTION"
      label="Selection"
      [disabled]="!hasSelection()"
      (action)="attachSelection()"
    />
  </app-ribbon-strip-group>
</app-ribbon-overflow>

<app-agent-remote-modal
  [open]="remoteConfirmOpen()"
  [enabling]="!remoteControlEnabled()"
  (confirmed)="onRemoteControlConfirmed()"
  (dismissed)="onRemoteControlDismissed()"
/>
