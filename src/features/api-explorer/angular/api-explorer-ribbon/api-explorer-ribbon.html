<app-ribbon-overflow>
  <app-ribbon-strip-group title="File">
    <app-ribbon-strip-menu-button
      [icon]="Icon.SAVE"
      label="Save"
      [items]="saveItems"
      (action)="onSave()"
      (selected)="onSaveVariant($event)"
    />
  </app-ribbon-strip-group>

  <!-- The three things a collection is built out of. Send is not here: it belongs to the request open
       in the well, and lives in that request's own tool strip. -->
  <app-ribbon-strip-group title="New">
    <app-ribbon-strip-column>
      <app-ribbon-strip-button-small
        [icon]="Icon.API_COLLECTION"
        label="Collection"
        (action)="onNewCollection()"
      />
      <app-ribbon-strip-button-small
        [icon]="Icon.API_ENVIRONMENT"
        label="Environment"
        (action)="onNewEnvironment()"
      />
      <app-ribbon-strip-button-small
        [icon]="Icon.API_REQUEST"
        label="Request"
        (action)="onNewRequest()"
      />
    </app-ribbon-strip-column>
  </app-ribbon-strip-group>
</app-ribbon-overflow>
