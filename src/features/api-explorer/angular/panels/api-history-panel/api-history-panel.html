<!-- The panel's own tool strip (#882): narrow the sends down, or clear them. -->
<app-panel-toolbar>
  <app-text-field
    class="history__filter"
    kind="search"
    placeholder="Filter History"
    ariaLabel="Filter History"
    [value]="query()"
    (valueChange)="query.set($event)"
  />
  <span class="panel-toolbar__spacer"></span>
  <app-button
    variant="none"
    [icon]="Icon.TRASH"
    label="Clear"
    tooltip="Clear History"
    [disabled]="workspace.history().length === 0"
    (click)="workspace.clearHistory()"
  />
</app-panel-toolbar>

@if (workspace.history().length === 0) {
  <p class="history__empty">Nothing sent yet this session.</p>
} @else if (entries().length === 0) {
  <p class="history__empty">No sends match “{{ query().trim() }}”.</p>
} @else {
  <ul class="history__list">
    @for (entry of entries(); track entry.id) {
      <li class="history__row">
        <button type="button" class="history__button" (click)="reopen(entry)">
          <span class="history__result" [attr.data-tone]="tone(entry)">{{ result(entry) }}</span>
          <span class="history__method">{{ entry.method }}</span>
          <span class="history__name">{{ entry.name }}</span>
          <span class="history__meta">{{ duration(entry) }} ms</span>
          <span class="history__meta">{{ entry.at | date: 'HH:mm:ss' }}</span>
        </button>
        <p class="history__url" [title]="entry.url">{{ entry.url }}</p>
      </li>
    }
  </ul>
}
