<app-ribbon-overflow>
  <!-- The ribbon chooses the sub-view (#948): one is shown at a time, each with its own side panel,
       so these are toggles that always show which is pressed. -->
  <app-ribbon-strip-group title="View">
    <app-ribbon-strip-button
      [icon]="Icon.AI_MODELS"
      label="Local Models"
      [toggle]="true"
      [pressed]="section() === 'models'"
      (action)="onShow('models')"
    />
    <app-ribbon-strip-button
      [icon]="Icon.AI_PROFILES"
      label="Prompt Profiles"
      [toggle]="true"
      [pressed]="section() === 'profiles'"
      (action)="onShow('profiles')"
    />
    <app-ribbon-strip-button
      [icon]="Icon.AI_SKILLS"
      label="Skills"
      [toggle]="true"
      [pressed]="section() === 'skills'"
      (action)="onShow('skills')"
    />
  </app-ribbon-strip-group>

  @switch (section()) {
    @case ('models') {
      <app-ribbon-strip-group title="Runtime">
        @if (needsInstall()) {
          <app-ribbon-strip-button
            [icon]="Icon.DOWNLOAD"
            label="Install"
            [disabled]="busy()"
            (action)="onInstall()"
          />
        } @else if (running()) {
          <app-ribbon-strip-button
            [icon]="Icon.STOP"
            label="Stop"
            [disabled]="busy() || !stoppable()"
            (action)="onStop()"
          />
        } @else {
          <app-ribbon-strip-button
            [icon]="Icon.PLAY"
            label="Start"
            [disabled]="busy()"
            (action)="onStart()"
          />
        }
        <app-ribbon-strip-button
          [icon]="Icon.REFRESH"
          label="Refresh"
          [disabled]="busy()"
          (action)="onRefresh()"
        />
      </app-ribbon-strip-group>
    }
    @case ('profiles') {
      <app-ribbon-strip-group title="Prompt Profiles">
        <app-ribbon-strip-button
          [icon]="Icon.PLUS"
          label="New Profile"
          [disabled]="!registered().has('profiles')"
          (action)="onAdd('profiles')"
        />
      </app-ribbon-strip-group>
    }
    @case ('skills') {
      <app-ribbon-strip-group title="Skills">
        <app-ribbon-strip-button
          [icon]="Icon.PLUS"
          label="New Skill"
          [disabled]="!registered().has('skills')"
          (action)="onAdd('skills')"
        />
        <app-ribbon-strip-button
          [icon]="Icon.DOWNLOAD"
          label="Import"
          [disabled]="!registered().has('skills')"
          (action)="onImportSkill()"
        />
      </app-ribbon-strip-group>
      <app-ribbon-strip-group title="Library">
        <app-ribbon-strip-button
          [icon]="Icon.FOLDER_OPEN"
          label="Open Folder"
          (action)="onOpenSkillFolder()"
        />
        <app-ribbon-strip-button
          [icon]="Icon.REFRESH"
          label="Refresh"
          [disabled]="skillsLoading()"
          (action)="onRefreshSkills()"
        />
      </app-ribbon-strip-group>
    }
  }
</app-ribbon-overflow>
