<app-ribbon-overflow>
  <!-- The sub-view is chosen in the sidebar; the ribbon follows it with that sub-view's groups. -->
  @switch (section()) {
    @case ('models') {
      <app-ribbon-strip-group title="Runtime">
        @if (needsInstall()) {
          <app-ribbon-strip-button
            [icon]="Icon.DOWNLOAD"
            label="Install"
            [disabled]="busy()"
            (action)="onInstall()"
          />
        } @else if (running()) {
          <app-ribbon-strip-button
            [icon]="Icon.STOP"
            label="Stop"
            [disabled]="busy() || !stoppable()"
            (action)="onStop()"
          />
        } @else {
          <app-ribbon-strip-button
            [icon]="Icon.PLAY"
            label="Start"
            [disabled]="busy()"
            (action)="onStart()"
          />
        }
        <app-ribbon-strip-button
          [icon]="Icon.REFRESH_DUOTONE"
          label="Refresh"
          [disabled]="busy()"
          (action)="onRefresh()"
        />
      </app-ribbon-strip-group>
    }
    @case ('profiles') {
      <app-ribbon-strip-group title="Library">
        <app-ribbon-strip-button
          [icon]="Icon.PLUS_CIRCLE"
          label="New Profile"
          [disabled]="!registered().has('profiles')"
          (action)="onAdd('profiles')"
        />
        <app-ribbon-strip-button
          [icon]="Icon.REFRESH_DUOTONE"
          label="Refresh"
          [disabled]="false"
          (action)="onRefreshProfiles()"
        />
        <app-ribbon-strip-column>
          <app-ribbon-strip-button-small
            [icon]="Icon.DOWNLOAD"
            label="Import"
            [disabled]="!registered().has('profiles') || !canTransfer"
            (action)="onImportProfiles()"
          />
          <app-ribbon-strip-button-small
            [icon]="Icon.UPLOAD_SIMPLE"
            label="Export"
            [disabled]="!canTransfer"
            (action)="onExportLibrary()"
          />
          <app-ribbon-strip-button-small
            [icon]="Icon.FOLDER_OPEN"
            label="Open Folder"
            (action)="onOpenProfileFolder()"
          />
        </app-ribbon-strip-column>
      </app-ribbon-strip-group>
    }
    @case ('skills') {
      <app-ribbon-strip-group title="Library">
        <app-ribbon-strip-button
          [icon]="Icon.PLUS_CIRCLE"
          label="New Skill"
          [disabled]="!registered().has('skills')"
          (action)="onAdd('skills')"
        />
        <app-ribbon-strip-button
          [icon]="Icon.REFRESH_DUOTONE"
          label="Refresh"
          [disabled]="skillsLoading()"
          (action)="onRefreshSkills()"
        />
        <app-ribbon-strip-column>
          <app-ribbon-strip-button-small
            [icon]="Icon.DOWNLOAD"
            label="Import"
            [disabled]="!registered().has('skills') || !canTransfer"
            (action)="onImportSkill()"
          />
          <app-ribbon-strip-button-small
            [icon]="Icon.UPLOAD_SIMPLE"
            label="Export"
            [disabled]="!canTransfer"
            (action)="onExportLibrary()"
          />
          <app-ribbon-strip-button-small
            [icon]="Icon.FOLDER_OPEN"
            label="Open Folder"
            (action)="onOpenSkillFolder()"
          />
        </app-ribbon-strip-column>
      </app-ribbon-strip-group>
    }
  }

  <app-ribbon-strip-group title="Agent">
    <app-ribbon-strip-button
      [icon]="Icon.AGENT"
      label="Agent"
      [toggle]="true"
      [pressed]="agentShown()"
      (action)="onToggleAgent()"
    />
  </app-ribbon-strip-group>
</app-ribbon-overflow>
