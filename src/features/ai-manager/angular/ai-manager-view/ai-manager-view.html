<app-panel-layout class="ai-manager">
  <!-- One sidebar for every sub-view: the search, then Local Models, Prompt Profiles and Skills as
       accordions, one open at a time. The open one is the sub-view shown beside it. -->
  <app-panel
    panelId="ai-manager-sidebar"
    defaultEdge="left"
    [allowedEdges]="sideEdges"
    [movable]="false"
    [defaultSize]="260"
    [minSize]="240"
    [maxSize]="480"
  >
    <app-ai-manager-sidebar />
  </app-panel>

  <div main class="ai-manager__section">
    @switch (section()) {
      @case ('models') {
        <app-model-manager-view [isActive]="isActive()" />
      }
      @case ('profiles') {
        <app-prompt-profiles />
      }
      @case ('skills') {
        <app-skill-library />
      }
    }
  </div>

  <!-- The AI Manager's own agent (#967), docked on the right across every sub-view. It mounts on
       first show and stays mounted, so closing it keeps its conversation. -->
  @if (agentPanel.mounted()) {
    <app-panel
      panelId="agent"
      defaultEdge="right"
      [visible]="agentPanel.visible()"
      [defaultSize]="360"
      [minSize]="240"
      [maxSize]="900"
    >
      <app-tool-view-agent-panel
        surface="models"
        [context]="agentContext"
        [tabId]="tabId()"
        [isActive]="isActive() && agentPanel.visible()"
        (closed)="agentPanel.hide()"
      />
    </app-panel>
  }
</app-panel-layout>
