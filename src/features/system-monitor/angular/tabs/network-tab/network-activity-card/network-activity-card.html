<app-system-monitor-dashboard-card [icon]="Icon.MONITOR_ACTIVITY" [heading]="heading()">
  <app-button-group
    cardBadges
    ariaLabel="Direction"
    [options]="directions"
    [value]="direction()"
    (valueChange)="setDirection($event)"
  />
  <app-system-monitor-line-chart
    class="network-activity__chart"
    ariaLabel="The interface's traffic over time"
    [series]="series()"
    [base]="1024"
    [format]="format"
    [showLegend]="false"
    [intervalMs]="intervalMs"
  />
</app-system-monitor-dashboard-card>
