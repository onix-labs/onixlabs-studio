<app-system-monitor-dashboard-card [icon]="Icon.MONITOR_STATISTICS" [heading]="heading()">
  @if (statistics().length > 0) {
    <dl class="network-statistics" data-testid="network-statistics">
      @for (statistic of statistics(); track statistic.label) {
        <div class="network-statistics__row">
          <dt>{{ statistic.label }}</dt>
          <dd>{{ statistic.value }}</dd>
        </div>
      }
    </dl>
  } @else {
    <p class="network-statistics__empty">Reading the interface…</p>
  }
</app-system-monitor-dashboard-card>
