<app-system-monitor-dashboard-card [icon]="Icon.MONITOR_VOLUME" heading="Volumes">
  @if (rows().length > 0) {
    <div class="storage-volumes__scroll">
      <table class="storage-volumes" data-testid="storage-volumes">
        <thead>
          <tr>
            <th class="storage-volumes__name-column">Volume</th>
            <th>File System</th>
            <th>Mount Point</th>
            <th class="storage-volumes__number">Capacity</th>
            <th class="storage-volumes__number">Used</th>
            <th class="storage-volumes__number">Free</th>
            <th class="storage-volumes__usage-column">Usage</th>
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track row.mount) {
            <tr [class.storage-volumes__row--selected]="row.onSelected">
              <td [title]="row.name">
                <span class="storage-volumes__name">
                  <app-icon class="storage-volumes__icon" [icon]="Icon.MONITOR_VOLUME" [size]="1" />
                  {{ row.name }}
                </span>
              </td>
              <td>{{ row.type }}</td>
              <td [title]="row.mount">{{ row.mount }}</td>
              <td class="storage-volumes__number">{{ row.capacity }}</td>
              <td class="storage-volumes__number">{{ row.used }}</td>
              <td class="storage-volumes__number">{{ row.free }}</td>
              <td>
                <span class="storage-volumes__usage">
                  <span class="storage-volumes__share">{{ row.share }}</span>
                  <span
                    class="storage-volumes__track"
                    role="meter"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    [attr.aria-valuenow]="row.percent"
                    [attr.aria-label]="row.name + ' used'"
                  >
                    <span class="storage-volumes__fill" [style.inline-size.%]="row.percent"></span>
                  </span>
                </span>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  } @else {
    <p class="storage-volumes__empty">Reading the volumes…</p>
  }
</app-system-monitor-dashboard-card>
