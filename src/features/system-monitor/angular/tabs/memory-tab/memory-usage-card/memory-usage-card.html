<app-system-monitor-dashboard-card [icon]="Icon.MONITOR_MEMORY" heading="Memory Usage">
  <div class="memory-usage">
    <app-system-monitor-radial-meter
      class="memory-usage__meter"
      [percent]="used()"
      label="In Use"
      [innerPercent]="studio()"
      innerLabel="Studio"
    />
    <dl class="memory-usage__entries">
      @for (entry of entries(); track entry.label) {
        <div class="memory-usage__entry">
          <dt>
            <span
              class="memory-usage__key"
              [class.memory-usage__key--used]="entry.key === 'used'"
              [class.memory-usage__key--studio]="entry.key === 'studio'"
              [class.memory-usage__key--free]="entry.key === 'free'"
            ></span>
            {{ entry.label }}
          </dt>
          <dd>{{ entry.value }}</dd>
        </div>
      }
    </dl>
  </div>
</app-system-monitor-dashboard-card>
