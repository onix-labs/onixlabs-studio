<app-system-monitor-dashboard-card
  [icon]="Icon.MONITOR_NETWORK"
  heading="Network"
  subtitle="Network activity and interface statistics"
>
  <app-system-monitor-dashboard-badge
    cardBadges
    [icon]="Icon.MONITOR_IN"
    [value]="readings.networkRxValue()"
    caption="Received"
  />
  <app-system-monitor-dashboard-badge
    cardBadges
    [icon]="Icon.MONITOR_OUT"
    [value]="readings.networkTxValue()"
    caption="Sent"
  />

  <app-system-monitor-line-chart
    class="network-card__chart"
    ariaLabel="Network throughput over time, received and sent"
    [series]="series()"
    [base]="1024"
    [floor]="1024"
    [format]="rate"
    [intervalMs]="readings.intervalMs()"
  />

  <section class="network-card__interfaces" aria-label="Top interfaces">
    <h4 class="network-card__heading">Top Interfaces</h4>
    <table class="network-card__table" data-testid="network-card-interfaces">
      <thead>
        <tr>
          <th>Interface</th>
          <th class="network-card__number">Received</th>
          <th class="network-card__number">Sent</th>
        </tr>
      </thead>
      <tbody>
        @for (row of interfaces(); track row.name) {
          <tr>
            <td>{{ row.name }}</td>
            <td class="network-card__number">{{ row.received }}</td>
            <td class="network-card__number">{{ row.sent }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="network-card__none">
              Interfaces appear after the next reading.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</app-system-monitor-dashboard-card>
