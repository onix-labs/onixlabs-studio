<app-system-monitor-dashboard-card
  [icon]="Icon.MONITOR_CPU"
  heading="CPU"
  subtitle="Processor utilisation and core activity"
>
  <app-system-monitor-dashboard-badge cardBadges [value]="readings.cpuValue()" caption="System" />
  @if (readings.cpuAppValue(); as studio) {
    <app-system-monitor-dashboard-badge
      cardBadges
      tone="neutral"
      [value]="studio"
      caption="Studio"
    />
  }

  <app-system-monitor-line-chart
    class="cpu-card__chart"
    ariaLabel="CPU utilisation over time, the system's and Studio's"
    [series]="series()"
    [max]="100"
    [format]="percent"
    [showLegend]="false"
    [intervalMs]="readings.intervalMs()"
  />

  <section class="cpu-card__cores-section" aria-label="Core utilisation">
    <h4 class="cpu-card__heading">Core Utilisation</h4>
    @if (cores().length > 0) {
      <div class="cpu-card__cores" data-testid="cpu-card-cores" [style.--cores-per-row]="perRow()">
        @for (core of cores(); track core.number) {
          <div class="cpu-card__core" [title]="core.title">
            <app-sparkline [values]="core.values" [max]="100" />
          </div>
        }
      </div>
    } @else {
      <p class="cpu-card__empty">Each core's load appears after the next reading.</p>
    }
  </section>

  <!-- The processor's details sit at the foot of the card, as the Memory card's do; its load is the
       badge above. -->
  <dl class="cpu-card__facts">
    @for (fact of facts(); track fact.label) {
      <div>
        <dt>{{ fact.label }}</dt>
        <dd [title]="fact.value">{{ fact.value }}</dd>
      </div>
    }
  </dl>
</app-system-monitor-dashboard-card>
