<app-system-monitor-dashboard-card
  [icon]="Icon.MONITOR_SYSTEM"
  heading="System"
  subtitle="System information and status"
  (details)="details.emit()"
>
  <span cardBadges [title]="healthDetail()">
    <app-system-monitor-dashboard-badge
      [icon]="health().healthy ? Icon.SUCCESS_FILL : Icon.WARNING_FILL"
      [tone]="health().healthy ? 'success' : 'warning'"
      [value]="health().label"
    />
  </span>

  <app-system-monitor-system-facts [sessionStartedAt]="sessionStartedAt()" />
</app-system-monitor-dashboard-card>
