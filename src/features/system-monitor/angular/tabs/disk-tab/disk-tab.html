<div class="disk">
  <app-metric-tile class="disk__hero" label="Disk" [channels]="readings.diskChannels()" />

  <section>
    <h3 class="disk__heading">Volumes</h3>
    @if (volumes().length > 0) {
      <table class="disk__list" data-testid="disk-volumes">
        <thead>
          <tr>
            <th>Volume</th>
            <th>Type</th>
            <th class="disk__number">Used</th>
            <th class="disk__number">Free</th>
            <th class="disk__number">Size</th>
            <th class="disk__usage-column" aria-label="Usage"></th>
          </tr>
        </thead>
        <tbody>
          @for (volume of volumes(); track volume.mount) {
            <tr>
              <td [title]="volume.mount">{{ volume.mount }}</td>
              <td class="disk__muted">{{ volume.type }}</td>
              <td class="disk__number">{{ volume.used }}</td>
              <td class="disk__number">{{ volume.free }}</td>
              <td class="disk__number">{{ volume.size }}</td>
              <td>
                <div
                  class="disk__usage"
                  role="meter"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  [attr.aria-valuenow]="volume.percent"
                  [attr.aria-label]="volume.mount + ' in use'"
                  [title]="volume.percentLabel + ' in use'"
                >
                  <div
                    class="disk__usage-fill"
                    [class.disk__usage-fill--full]="volume.nearlyFull"
                    [style.inline-size.%]="volume.percent"
                  ></div>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    } @else {
      <p class="disk__empty">Volumes appear after the next reading.</p>
    }
  </section>
</div>
