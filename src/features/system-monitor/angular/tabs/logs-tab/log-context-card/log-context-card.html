<section class="log-context" aria-label="Log context" data-testid="log-context">
  <header class="log-context__head">
    <div class="log-context__views" role="group" aria-label="Show">
      <app-button
        variant="none"
        size="small"
        [icon]="Icon.MONITOR_CONTEXT"
        label="Context"
        [pressed]="tab() === 'context'"
        (click)="setTab('context')"
      />
      <app-button
        variant="none"
        size="small"
        [icon]="Icon.MONITOR_RAW"
        label="Raw"
        [pressed]="tab() === 'raw'"
        (click)="setTab('raw')"
      />
    </div>
    @if (code()) {
      <app-button
        variant="none"
        size="small"
        [icon]="copied() ? Icon.CHECK : Icon.COPY"
        [ariaLabel]="copied() ? 'Copied' : 'Copy'"
        [tooltip]="copied() ? 'Copied' : 'Copy'"
        (click)="copy()"
      />
    }
  </header>
  @if (code()) {
    <!-- The text with its line numbers in a gutter; the numbers are not part of a selection. -->
    <div class="log-context__body">
      <pre
        class="log-context__code"
        data-testid="log-context-code"
      ><code>@for (line of lines(); track $index) {<span class="log-context__line"><span class="log-context__number" aria-hidden="true">{{ $index + 1 }}</span><span class="log-context__text">@for (token of line; track $index) {<span [class]="'log-context__token--' + token.kind">{{ token.text }}</span>}</span></span>}</code></pre>
    </div>
  } @else {
    <p class="log-context__empty">{{ emptyText() }}</p>
  }
</section>
