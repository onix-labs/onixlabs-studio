<app-system-monitor-dashboard-card [icon]="Icon.MONITOR_GPU" heading="GPU Utilisation">
  <app-system-monitor-dashboard-badge cardBadges tone="neutral" [value]="readings.historyLabel()" />
  <app-system-monitor-dashboard-badge cardBadges [value]="value()" />
  <app-system-monitor-line-chart
    class="gpu-utilisation__chart"
    ariaLabel="GPU utilisation over time"
    [series]="series()"
    [max]="100"
    [format]="percent"
    [intervalMs]="intervalMs"
  />
</app-system-monitor-dashboard-card>
