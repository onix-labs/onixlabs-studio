<app-system-monitor-dashboard-card [icon]="Icon.MONITOR_TREND" heading="GPU Memory Usage">
  <app-system-monitor-dashboard-badge cardBadges tone="neutral" [value]="readings.historyLabel()" />
  @if (reported()) {
    <app-system-monitor-line-chart
      class="gpu-memory-history__chart"
      ariaLabel="Video memory in use over time"
      [series]="series()"
      [max]="total()"
      [base]="1024"
      [floor]="1024 * 1024"
      [format]="bytes"
      [intervalMs]="intervalMs"
    />
  } @else {
    <p class="gpu-memory-history__empty">This GPU does not report its video memory in use.</p>
  }
</app-system-monitor-dashboard-card>
