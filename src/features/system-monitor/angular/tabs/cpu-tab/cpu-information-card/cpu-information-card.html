<app-system-monitor-dashboard-card [icon]="Icon.MONITOR_SYSTEM" heading="CPU Information">
  @if (rows().length > 0) {
    <dl class="cpu-information" data-testid="cpu-information">
      @for (row of rows(); track row.label) {
        <div class="cpu-information__row">
          <dt>{{ row.label }}</dt>
          <dd [title]="row.value">{{ row.value }}</dd>
        </div>
      }
    </dl>
  } @else {
    <p class="cpu-information__empty">Reading the processor…</p>
  }
</app-system-monitor-dashboard-card>
