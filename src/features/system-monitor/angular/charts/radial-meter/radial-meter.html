<div
  class="radial-meter"
  role="meter"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-valuenow]="percent()"
  [attr.aria-label]="description()"
  [class.radial-meter--warning]="severity() === 'warning'"
  [class.radial-meter--danger]="severity() === 'danger'"
  [class.radial-meter--nested]="nested()"
>
  <svg class="radial-meter__svg" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="radial-meter__track" cx="50" cy="50" [attr.r]="radius" />
    <!-- Drawn from twelve o'clock, clockwise. -->
    @if (dash(); as pattern) {
      <circle
        class="radial-meter__fill"
        cx="50"
        cy="50"
        [attr.r]="radius"
        [attr.stroke-dasharray]="pattern"
        transform="rotate(-90 50 50)"
      />
    }
    @if (nested()) {
      <circle class="radial-meter__inner-track" cx="50" cy="50" [attr.r]="innerRadius" />
      @if (innerDash(); as pattern) {
        <circle
          class="radial-meter__inner-fill"
          cx="50"
          cy="50"
          [attr.r]="innerRadius"
          [attr.stroke-dasharray]="pattern"
          transform="rotate(-90 50 50)"
        />
      }
    }
  </svg>
  <div class="radial-meter__reading" aria-hidden="true">
    <span class="radial-meter__value">{{ value() }}</span>
    <!-- A nested meter's readings stand alone, each in its ring's colour, which names it; a single
         ring names its reading in words. Both are named in the meter's accessible label. -->
    @if (nested()) {
      <span class="radial-meter__inner">{{ innerValue() }}</span>
    } @else {
      <span class="radial-meter__label">{{ label() }}</span>
    }
  </div>
</div>
