<app-ribbon-overflow>
  <app-ribbon-strip-group title="Container">
    <app-ribbon-strip-menu-button
      [icon]="Icon.PLAY"
      label="Start"
      tone="success"
      [disabled]="!canStart()"
      [menuDisabled]="!hasTargets()"
      [items]="startItems()"
      (action)="onStart()"
      (selected)="onMenuItem($event)"
    />
    <app-ribbon-strip-menu-button
      [icon]="Icon.STOP"
      label="Stop"
      tone="warning"
      [disabled]="!canStop()"
      [menuDisabled]="!canPause()"
      [items]="stopItems()"
      (action)="onStop()"
      (selected)="onMenuItem($event)"
    />
    <app-ribbon-strip-button
      [icon]="Icon.TRASH"
      label="Remove"
      tone="danger"
      [disabled]="!hasTargets()"
      (action)="onRemove()"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="View">
    <app-ribbon-strip-button [icon]="Icon.REFRESH" label="Refresh" (action)="onRefresh()" />
    <app-ribbon-strip-menu-button
      [icon]="Icon.FILTER"
      label="Show All"
      [disabled]="!canShowAll()"
      [menuDisabled]="!showingContainers()"
      [items]="showItems()"
      (action)="onShowAll()"
      (selected)="onShowItem($event)"
    />
    <app-ribbon-strip-menu-button
      [icon]="Icon.CLOSE"
      label="Clear"
      [disabled]="!canClear()"
      [menuDisabled]="!showingContainers()"
      [items]="selectItems()"
      (action)="onClear()"
      (selected)="onSelectItem($event)"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Image">
    <app-ribbon-strip-button
      [icon]="Icon.DOWNLOAD"
      label="Pull Image"
      [disabled]="!engineReady()"
      (action)="onPullImage()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.PLAY"
      label="Run"
      [disabled]="!engineReady()"
      (action)="onRunImage()"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Terminal">
    <app-ribbon-strip-button
      [icon]="Icon.ARTICLE"
      label="Logs"
      [disabled]="!hasSelection()"
      (action)="onLogs()"
    />
    @if (shellAvailable()) {
      <app-ribbon-strip-button
        [icon]="Icon.TERMINAL"
        label="Shell"
        [disabled]="!hasSelection() || !selectionRunning()"
        (action)="onShell()"
      />
    }
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Agent">
    <app-ribbon-strip-button
      [icon]="Icon.AGENT"
      label="Agent"
      [toggle]="true"
      [pressed]="agentShown()"
      (action)="onToggleAgent()"
    />
  </app-ribbon-strip-group>
</app-ribbon-overflow>
