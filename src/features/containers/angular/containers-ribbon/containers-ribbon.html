<app-ribbon-overflow>
  <app-ribbon-strip-group title="Container">
    <app-ribbon-strip-button
      [icon]="Icon.PLAY"
      label="Start"
      tone="success"
      [disabled]="!hasSelection() || selectionRunning()"
      (action)="onStart()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.STOP"
      label="Stop"
      tone="warning"
      [disabled]="!hasSelection() || !selectionRunning()"
      (action)="onStop()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.RESTART"
      label="Restart"
      [disabled]="!hasSelection()"
      (action)="onRestart()"
    />
    <app-ribbon-strip-button
      [icon]="selectionPaused() ? Icon.PLAY : Icon.PAUSE"
      [label]="selectionPaused() ? 'Resume' : 'Pause'"
      [disabled]="!hasSelection() || (!selectionRunning() && !selectionPaused())"
      (action)="onTogglePause()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.TRASH"
      label="Remove"
      tone="danger"
      [disabled]="!hasSelection()"
      (action)="onRemove()"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Terminal">
    <app-ribbon-strip-button
      [icon]="Icon.ARTICLE"
      label="Logs"
      [disabled]="!hasSelection()"
      (action)="onLogs()"
    />
    @if (shellAvailable()) {
      <app-ribbon-strip-button
        [icon]="Icon.TERMINAL"
        label="Shell"
        [disabled]="!hasSelection() || !selectionRunning()"
        (action)="onShell()"
      />
    }
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="View">
    <app-ribbon-strip-button [icon]="Icon.REFRESH" label="Refresh" (action)="onRefresh()" />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Agent">
    <app-ribbon-strip-button
      [icon]="Icon.AGENT"
      label="Agent"
      [toggle]="true"
      [pressed]="agentShown()"
      (action)="onToggleAgent()"
    />
  </app-ribbon-strip-group>
</app-ribbon-overflow>
