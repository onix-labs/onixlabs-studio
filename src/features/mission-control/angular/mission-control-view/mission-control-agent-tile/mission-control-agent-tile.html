<header class="tile__header">
  <div class="tile__identity">
    @if (tabIcon(); as icon) {
      <app-icon class="tile__icon" [icon]="icon" [size]="1.05" />
    }
    @if (hasTab()) {
      <button
        type="button"
        class="tile__name tile__name--link"
        [title]="'Go to ' + host.label()"
        (click)="onOpenTab()"
      >
        {{ host.label() }}
      </button>
    } @else {
      <span class="tile__name" [title]="host.label()">{{ host.label() }}</span>
    }
    <span class="tile__kind">Agent</span>
  </div>
  <div class="tile__actions">
    @if (isRunning()) {
      <button type="button" class="tile__action" title="Stop" aria-label="Stop" (click)="onStop()">
        <app-icon [icon]="Icon.PAUSE" />
      </button>
    }
    <button type="button" class="tile__action" title="Focus" aria-label="Focus" (click)="openFocus()">
      <app-icon [icon]="Icon.FRAME_CORNERS" />
    </button>
  </div>
</header>

<div class="tile__status" [class.tile__status--busy]="isRunning()">
  <span class="tile__status-dot"></span>
  <span class="tile__status-label">{{ statusLabel() }}</span>
</div>

<div class="tile__body">
  <ng-container [ngTemplateOutlet]="panelBody" />
</div>

<div
  class="tile__resize"
  role="separator"
  aria-orientation="vertical"
  aria-label="Resize agent"
  (pointerdown)="onResizeDown($event)"
></div>

<!-- Focus mode: the same live session presented large and centred. The panel body is mounted afresh
     inside the modal only while open (a second live mirror of the same agent), so opening and closing
     focus never disturbs the column or the conversation. -->
<app-modal
  [open]="focusOpen()"
  [width]="72"
  [expandable]="true"
  [ariaLabel]="'Focus: ' + host.label()"
  (dismiss)="closeFocus()"
>
  @if (focusOpen()) {
    <div class="tile__focus">
      <header class="tile__focus-header">
        @if (tabIcon(); as icon) {
          <app-icon class="tile__icon" [icon]="icon" [size]="1.15" />
        }
        <span class="tile__focus-name" [title]="host.label()">{{ host.label() }}</span>
        <span class="tile__kind">Agent</span>
        <div class="tile__status tile__focus-status" [class.tile__status--busy]="isRunning()">
          <span class="tile__status-dot"></span>
          <span class="tile__status-label">{{ statusLabel() }}</span>
        </div>
      </header>
      <div class="tile__focus-body">
        <ng-container [ngTemplateOutlet]="panelBody" />
      </div>
    </div>
  }
</app-modal>

<ng-template #panelBody>
  <app-agent-tool-strip [history]="historyOpen()" (historyToggle)="toggleHistory()" />
  @if (historyOpen()) {
    <app-agent-conversation-list class="tile__panel-body" />
  } @else {
    <app-agent-chat
      class="tile__panel-body"
      [mirror]="true"
      [tabId]="tabId()"
      [isActive]="active()"
      [surface]="host.surface"
      [autoScroll]="conversation.autoScroll()"
    />
  }
</ng-template>
