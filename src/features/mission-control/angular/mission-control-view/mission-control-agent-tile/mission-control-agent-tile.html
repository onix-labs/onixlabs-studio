<header class="tile__header">
  <div class="tile__identity">
    <span class="tile__name" [title]="host.label()">{{ host.label() }}</span>
    <span class="tile__kind">Agent</span>
  </div>
  <div class="tile__actions">
    @if (isRunning()) {
      <button type="button" class="tile__action" title="Stop" aria-label="Stop" (click)="onStop()">
        <app-icon [icon]="Icon.PAUSE" />
      </button>
    } @else {
      <button type="button" class="tile__action" disabled title="Idle" aria-label="Idle">
        <app-icon [icon]="Icon.PLAY" />
      </button>
    }
    <button
      type="button"
      class="tile__action"
      title="Open source tab"
      aria-label="Open source tab"
      [disabled]="host.tabId === null"
      (click)="onOpenTab()"
    >
      <app-icon [icon]="Icon.DOTS_THREE_VERTICAL" />
    </button>
  </div>
</header>

<div class="tile__status" [class.tile__status--busy]="isRunning()">
  <span class="tile__status-dot"></span>
  <span class="tile__status-label">{{ statusLabel() }}</span>
</div>

<div class="tile__body">
  <app-agent-tool-strip [history]="historyOpen()" (historyToggle)="toggleHistory()" />
  @if (historyOpen()) {
    <app-agent-conversation-list class="tile__panel-body" />
  } @else {
    <app-agent-chat
      class="tile__panel-body"
      [mirror]="true"
      [tabId]="tabId()"
      [isActive]="active()"
      [surface]="host.surface"
      [autoScroll]="conversation.autoScroll()"
    />
  }
</div>

<div
  class="tile__resize"
  role="separator"
  aria-orientation="vertical"
  aria-label="Resize agent"
  (pointerdown)="onResizeDown($event)"
></div>
