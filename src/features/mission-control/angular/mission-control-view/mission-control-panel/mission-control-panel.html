<header class="panel__header">
  <h2 class="panel__title">Agents</h2>
</header>

<div class="panel__body">
  @if (items().length === 0) {
    <div class="panel__empty">
      <app-icon class="panel__empty-icon" [icon]="Icon.AGENT" />
      <p class="panel__empty-title">No active agents</p>
      <p class="panel__empty-text">Open an agent and it will appear here as a live column.</p>
    </div>
  } @else {
    <app-list-view
      [rows]="rows()"
      [reorderable]="true"
      [gripIcon]="Icon.GRIP_BOLD"
      (rowClick)="onRowClick($event)"
      (reorder)="onReorder($event)"
    >
      <ng-template let-row>
        @let item = itemOf(row);
        <div
          class="rail__item"
          [class.rail__item--waiting]="item.isWaiting"
          [title]="'Scroll to ' + item.label"
        >
          <!-- The head is one centred flex row: column 1 (the agent icon beside its title-over-branch
               stack) grows to fill, column 2 (the run-state) holds a fixed width so it and the list's
               trailing reorder grip line up down the rail. -->
          <div class="rail__head">
            <div class="rail__main">
              <!-- Sized to the full height of the title-over-branch stack beside it (see
                   `.rail__icon`), so it reads as one glyph against both lines rather than as a
                   bullet on the first. -->
              <app-icon class="rail__icon" [icon]="item.icon" [size]="2.05" />
              <div class="rail__text">
                <span class="rail__name">{{ item.label }}</span>
                <!-- A workspace or repository agent names the branch it is working on beneath its
                     title; an agent with no repository behind it says so, so every row reads the
                     same way. -->
                <span
                  class="rail__branch"
                  [class.rail__branch--none]="item.branch === null"
                  [title]="item.branch === null ? 'No repository' : 'On branch ' + item.branch"
                >
                  {{ item.branch ?? 'No repository' }}
                </span>
              </div>
            </div>
            <span class="rail__status" [class.rail__status--busy]="item.isRunning">
              <app-pulse-dot
                [tone]="item.isWaiting ? 'warning' : item.isRunning ? 'accent' : 'neutral'"
                [pulse]="item.isRunning"
                [size]="0.45"
              />
              <span class="rail__status-label">{{ item.statusLabel }}</span>
            </span>
          </div>
        </div>

        <!-- The hide toggle sits at the row's trailing edge, immediately left of the list's reorder
             grip (the grip is appended by the list view after this projected content). It hides this
             single agent's column independently of the blanket Hide Empty / Hide Idle toggles (the
             three are OR-ed). It is always visible so the column can be hidden or brought back at
             any time, and takes the standard button size so it reads as the same class of control as
             an agent's tool-strip buttons rather than as dense row chrome. -->
        <app-button
          class="rail__hide"
          variant="none"
          [tone]="item.isWaiting ? 'warning' : 'accent'"
          [icon]="isHidden(item.id) ? Icon.AGENT_HIDDEN : Icon.AGENT_VISIBLE"
          [pressed]="isHidden(item.id)"
          [ariaLabel]="isHidden(item.id) ? 'Show agent column' : 'Hide agent column'"
          [tooltip]="isHidden(item.id) ? 'Show agent column' : 'Hide agent column'"
          (click)="onToggleHidden(item, $event)"
        />
      </ng-template>
    </app-list-view>
  }
</div>
