<app-ribbon-overflow>
  <app-ribbon-strip-group title="File">
    <app-ribbon-strip-button
      [icon]="Icon.SAVE"
      label="Save"
      [disabled]="!dirty()"
      (action)="onSave()"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Edit">
    <app-ribbon-strip-button
      [icon]="Icon.UNDO"
      label="Undo"
      [disabled]="!canUndo()"
      (action)="onUndo()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.REDO"
      label="Redo"
      [disabled]="!canRedo()"
      (action)="onRedo()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.PENCIL"
      label="Insert"
      [toggle]="true"
      [pressed]="insertMode()"
      (action)="onToggleInsertMode()"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Navigate">
    <app-ribbon-strip-button [icon]="Icon.ARROW_UP" label="Start" (action)="onGoToStart()" />
    <app-ribbon-strip-button [icon]="Icon.ARROW_DOWN" label="End" (action)="onGoToEnd()" />
    @if (codeAvailable()) {
      <app-ribbon-strip-button [icon]="Icon.CODE" label="Code" (action)="onGoToCode()" />
    }
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Clipboard">
    <app-ribbon-strip-button [icon]="Icon.COPY" label="Copy Hex" (action)="onCopyHex()" />
    <app-ribbon-strip-button [icon]="Icon.LIST" label="Copy Text" (action)="onCopyText()" />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Layout">
    <app-ribbon-strip-field
      label="Bytes / Row"
      [options]="rowWidths"
      [value]="rowWidthValue()"
      [fullWidth]="false"
      (changed)="onRowWidthChange($event)"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Tools">
    <app-ribbon-strip-button
      [icon]="Icon.CODE"
      label="Disassembly"
      [toggle]="true"
      [pressed]="disassemblyShown()"
      (action)="onToggleDisassembly()"
    />
    <app-ribbon-strip-button
      [icon]="Icon.SEARCH"
      label="Inspector"
      [toggle]="true"
      [pressed]="inspectorShown()"
      (action)="onToggleInspector()"
    />
  </app-ribbon-strip-group>
</app-ribbon-overflow>
