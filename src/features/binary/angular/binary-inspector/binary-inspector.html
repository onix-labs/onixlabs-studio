<div class="inspector">
  <div class="inspector__bar" appPanelDragHandle="Inspector">
    <app-icon class="inspector__icon" [icon]="Icon.SEARCH" />
    <span class="inspector__title">Inspector</span>
    <span class="inspector__spacer"></span>
    <app-button
      variant="none"
      size="small"
      [icon]="Icon.CLOSE"
      ariaLabel="Close inspector"
      tooltip="Close inspector"
      (click)="onClose()"
    />
  </div>

  <div class="inspector__body">
    <div class="inspector__toggles">
      <app-button-group
        ariaLabel="Endianness"
        [options]="endianOptions"
        [value]="littleEndian() ? 'le' : 'be'"
        (valueChange)="setEndian($event === 'le')"
      />

      <app-button-group
        ariaLabel="Signedness"
        [options]="signOptions"
        [value]="signed() ? 'signed' : 'unsigned'"
        (valueChange)="setSigned($event === 'signed')"
      />
    </div>

    @if (rows().length > 0) {
      <dl class="inspector__list">
        @for (row of rows(); track row.label) {
          <div class="inspector__row">
            <dt class="inspector__label">{{ row.label }}</dt>
            <dd class="inspector__value">{{ row.value }}</dd>
          </div>
        }
      </dl>
    } @else {
      <p class="inspector__empty">Select a byte to inspect its value.</p>
    }
  </div>
</div>
