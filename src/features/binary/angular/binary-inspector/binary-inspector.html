<div class="inspector">
  <div class="inspector__bar">
    <app-icon class="inspector__icon" [icon]="Icon.SEARCH" />
    <span class="inspector__title">Inspector</span>
    <span class="inspector__spacer"></span>
    <button type="button" aria-label="Close inspector" title="Close inspector" (click)="onClose()">
      <app-icon [icon]="Icon.CLOSE" />
    </button>
  </div>

  <div class="inspector__body">
    <div class="inspector__toggles">
      <div class="inspector__seg" role="group" aria-label="Endianness">
        <button
          type="button"
          class="inspector__seg-btn"
          [class.inspector__seg-btn--active]="littleEndian()"
          (click)="setEndian(true)"
        >
          LE
        </button>
        <button
          type="button"
          class="inspector__seg-btn"
          [class.inspector__seg-btn--active]="!littleEndian()"
          (click)="setEndian(false)"
        >
          BE
        </button>
      </div>

      <div class="inspector__seg" role="group" aria-label="Signedness">
        <button
          type="button"
          class="inspector__seg-btn"
          [class.inspector__seg-btn--active]="signed()"
          (click)="setSigned(true)"
        >
          Signed
        </button>
        <button
          type="button"
          class="inspector__seg-btn"
          [class.inspector__seg-btn--active]="!signed()"
          (click)="setSigned(false)"
        >
          Unsigned
        </button>
      </div>
    </div>

    @if (rows().length > 0) {
      <dl class="inspector__list">
        @for (row of rows(); track row.label) {
          <div class="inspector__row">
            <dt class="inspector__label">{{ row.label }}</dt>
            <dd class="inspector__value">{{ row.value }}</dd>
          </div>
        }
      </dl>
    } @else {
      <p class="inspector__empty">Select a byte to inspect its value.</p>
    }
  </div>
</div>
