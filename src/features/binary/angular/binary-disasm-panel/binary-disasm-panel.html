<div class="disasm">
  <div class="disasm__bar">
    <app-icon class="disasm__icon" [icon]="Icon.CODE" />
    <span class="disasm__title">Disassembly</span>
    <span class="disasm__spacer"></span>
    <button
      type="button"
      aria-label="Close disassembly"
      title="Close disassembly"
      (click)="onClose()"
    >
      <app-icon [icon]="Icon.CLOSE" />
    </button>
  </div>

  <div class="disasm__body">
    @if (disassemblable()) {
      <div class="disasm__list">
        @for (row of disasmRows(); track row.startOffset) {
          <button
            type="button"
            class="disasm__row"
            [class.disasm__row--selected]="row.selected"
            (click)="onInstructionClick(row.startOffset, row.byteLength)"
          >
            <span class="disasm__addr">{{ row.address }}</span>
            <span class="disasm__mnemonic">{{ row.mnemonic }}</span>
            <span class="disasm__operands">{{ row.operands }}</span>
          </button>
        }
      </div>
    } @else {
      <p class="disasm__empty">No native disassembly for this format.</p>
    }
  </div>
</div>
