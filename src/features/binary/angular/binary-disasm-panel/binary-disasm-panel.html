<div class="disasm">
  <div class="disasm__bar" appPanelDragHandle="Disassembly">
    <app-icon class="disasm__icon" [icon]="Icon.CODE" />
    <span class="disasm__title">Assembly</span>
    <span class="disasm__spacer"></span>
    <app-button
      variant="none"
      size="small"
      [icon]="Icon.CLOSE"
      ariaLabel="Close assembly"
      tooltip="Close assembly"
      (click)="onClose()"
    />
  </div>

  <div class="disasm__body">
    <div class="disasm__editor">
      <app-text-editor
        [content]="content().text"
        [language]="ASM_LANGUAGE_ID"
        [readOnly]="true"
        [options]="editorOptions"
        (ready)="onReady()"
      />
    </div>
    @if (!disassemblable()) {
      <p class="disasm__empty">No native disassembly for this format.</p>
    }
  </div>
</div>
