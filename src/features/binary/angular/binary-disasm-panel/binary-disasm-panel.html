<div class="disasm">
  <div class="disasm__bar">
    <app-icon class="disasm__icon" [icon]="Icon.CODE" />
    <span class="disasm__title">Assembly</span>
    <span class="disasm__spacer"></span>
    <button type="button" aria-label="Close assembly" title="Close assembly" (click)="onClose()">
      <app-icon [icon]="Icon.CLOSE" />
    </button>
  </div>

  <div class="disasm__body">
    <div #host class="disasm__editor"></div>
    @if (!disassemblable()) {
      <p class="disasm__empty">No native disassembly for this format.</p>
    }
  </div>
</div>
