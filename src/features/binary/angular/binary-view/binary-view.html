@if (document(); as document) {
  <app-panel-layout layoutKey="binary">
    <app-binary-editor
      main
      [size]="document.size()"
      [bytesPerRow]="document.bytesPerRow()"
      [byteAt]="byteAt"
      [selection]="document.selection()"
      [dataVersion]="document.dataVersion()"
      [insertMode]="document.insertMode()"
      [revealOffset]="document.revealOffset"
      [revealVersion]="document.revealVersion()"
      (visibleRangeChange)="onVisibleRange($event)"
      (selectionChange)="onSelectionChange($event)"
      (cursorChange)="onCursorChange($event)"
      (op)="onOp($event)"
      (toggleInsertMode)="document.insertMode.set(!document.insertMode())"
      (unitSelect)="onUnitSelect($event)"
    />

    @if (disasmMounted()) {
      <app-panel
        panelId="disasm"
        defaultEdge="right"
        [visible]="disasmVisible()"
        [defaultSize]="320"
        [minSize]="220"
        [maxSize]="900"
      >
        <app-binary-disasm-panel [document]="document" (closed)="onHideDisasm()" />
      </app-panel>
    }

    @if (inspectorMounted()) {
      <app-panel
        panelId="inspector"
        defaultEdge="right"
        [visible]="inspectorVisible()"
        [defaultSize]="260"
        [minSize]="180"
        [maxSize]="600"
      >
        <app-binary-inspector [document]="document" (closed)="onHideInspector()" />
      </app-panel>
    }

    <!-- The agent panel mounts eagerly (hidden until shown) so this tab's live agent registers with
         Mission Control on open, whether or not the panel has been opened in the tab. -->
    <app-panel
      panelId="agent"
      defaultEdge="right"
      [visible]="agentVisible()"
      [defaultSize]="360"
      [minSize]="240"
      [maxSize]="900"
    >
      <app-binary-agent-panel [tabId]="tabId()" [isActive]="isActive() && agentVisible()" />
    </app-panel>
  </app-panel-layout>
}
