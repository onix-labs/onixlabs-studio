@if (document(); as document) {
  <ng-template
    [appDockPanel]="editorPanel"
    panelTitle="Binary"
    [panelIcon]="Icon.BINARY"
    panelRole="main"
  >
    <app-binary-editor
      [size]="document.size()"
      [bytesPerRow]="document.bytesPerRow()"
      [byteAt]="byteAt"
      [selection]="document.selection()"
      [dataVersion]="document.dataVersion()"
      [insertMode]="document.insertMode()"
      [readOnly]="document.readOnly()"
      [revealOffset]="document.revealOffset"
      [revealVersion]="document.revealVersion()"
      (visibleRangeChange)="onVisibleRange($event)"
      (selectionChange)="onSelectionChange($event)"
      (cursorChange)="onCursorChange($event)"
      (op)="onOp($event)"
      (toggleInsertMode)="document.insertMode.set(!document.insertMode())"
      (unitSelect)="onUnitSelect($event)"
    />
  </ng-template>

  <ng-template
    [appDockPanel]="disassemblyPanel"
    panelTitle="Assembly"
    [panelIcon]="Icon.CODE"
    [sides]="DockSides.Horizontal"
    [minInlineSize]="16"
    [defaultInlineSize]="320"
    [maxInlineSize]="900"
  >
    <app-binary-disasm-panel [document]="document" (editorCreated)="onDisassemblyEditor($event)" />
  </ng-template>

  <ng-template
    [appDockPanel]="inspectorPanel"
    panelTitle="Inspector"
    [panelIcon]="Icon.SEARCH"
    [sides]="DockSides.Horizontal"
    [minInlineSize]="16"
    [defaultInlineSize]="260"
    [maxInlineSize]="600"
  >
    <app-binary-inspector
      [document]="document"
      [(littleEndian)]="littleEndian"
      [(signed)]="signed"
    />
  </ng-template>

  <ng-template
    [appDockPanel]="agentPanel"
    panelTitle="Agent"
    [panelIcon]="Icon.AGENT"
    [sides]="DockSides.Horizontal"
    [minInlineSize]="22.5"
    [defaultInlineSize]="360"
    [maxInlineSize]="900"
  >
    <app-agent-conversation-panel [tabId]="tabId()" [isActive]="isActive()" surface="binary" />
  </ng-template>

  <ng-template
    [appDockPanel]="findPanel"
    panelTitle="Find"
    [panelIcon]="Icon.SEARCH"
    [sides]="DockSides.Horizontal"
    [minInlineSize]="16"
    [defaultInlineSize]="320"
    [maxInlineSize]="520"
  >
    <app-editor-search-panel
      [focuses]="dockReveal.isInUse(findPanel)"
      [search]="editorSearch"
      (closed)="onFindClosed()"
    />
  </ng-template>

  <app-dock-container />
}
