@if (document(); as document) {
  <app-panel-layout>
    <!-- Inner layout: the hex grid in the centre with the disassembly panel docked beside it. -->
    <app-panel-layout main>
      <app-binary-editor
        main
        [size]="document.size()"
        [bytesPerRow]="document.bytesPerRow()"
        [byteAt]="byteAt"
        [selection]="document.selection()"
        [dataVersion]="document.loadedVersion()"
        [revealOffset]="document.revealOffset"
        [revealVersion]="document.revealVersion()"
        (visibleRangeChange)="onVisibleRange($event)"
        (selectionChange)="onSelectionChange($event)"
        (cursorChange)="onCursorChange($event)"
      />

      @if (disasmMounted()) {
        <app-panel
          edge="right"
          [visible]="disasmVisible()"
          [(size)]="disasmSize"
          [minSize]="220"
          [maxSize]="900"
        >
          <app-binary-disasm-panel [document]="document" (closed)="onHideDisasm()" />
        </app-panel>
      }
    </app-panel-layout>

    @if (inspectorMounted()) {
      <app-panel
        edge="right"
        [visible]="inspectorVisible()"
        [(size)]="inspectorSize"
        [minSize]="180"
        [maxSize]="600"
      >
        <app-binary-inspector [document]="document" (closed)="onHideInspector()" />
      </app-panel>
    }
  </app-panel-layout>
}
