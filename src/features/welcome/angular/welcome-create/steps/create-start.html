<div class="step">
  <div class="step__list-frame" appOverlayScrollbar=".step__list">
    <ul class="step__list" aria-label="Templates">
      @for (template of templates; track template.skill) {
        <li>
          <button
            type="button"
            class="step__row"
            [class.step__row--picked]="draft.template()?.skill === template.skill"
            [attr.aria-pressed]="draft.template()?.skill === template.skill"
            (click)="draft.chooseTemplate(template)"
          >
            <span class="step__row-icon"><app-icon [icon]="template.icon" /></span>
            <span class="step__row-text">
              <span class="step__row-title">{{ template.title }}</span>
              <span class="step__row-summary">{{ template.summary }}</span>
            </span>
            @if (draft.template()?.skill === template.skill) {
              <app-icon class="step__row-mark" [icon]="Icon.WELCOME_STEP_DONE" />
            }
          </button>
        </li>
      }
    </ul>
  </div>

  <div class="step__field">
    <input
      id="create-idea"
      type="text"
      placeholder="Or describe what you want to build here…"
      aria-label="Describe what you want to build"
      [value]="draft.idea()"
      (input)="onIdeaInput($event)"
    />
  </div>
</div>
