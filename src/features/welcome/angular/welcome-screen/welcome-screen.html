<!-- The welcome screen is a themed modal in its own window. With no tabs open it stands free — the main
     window is hidden behind nothing at all — and closing it quits; summoned from the title strip's
     new-tab button it is an ordinary dismissable modal over a blurred main window. -->
<app-modal
  class="welcome-modal"
  [open]="visible()"
  [dismissable]="dismissable()"
  [closable]="true"
  [freestanding]="standsAlone()"
  [expandable]="true"
  [chromeless]="true"
  [width]="64"
  [height]="45"
  [minWidth]="60"
  [minHeight]="37.5"
  [maxWidth]="64"
  [maxHeight]="45"
  ariaLabel="ONIXLabs Studio"
  (dismiss)="close()"
>
  <ng-template appModalContent>
    <header class="welcome__header">
      <img class="welcome__logo" src="icon.svg" alt="" draggable="false" />
      <div class="welcome__intro">
        <h1 class="welcome__title" id="welcome-title">ONIXLabs Studio</h1>
        <p class="welcome__instruction">Create or open something to get started</p>
      </div>
    </header>

    <!-- The sections share one tab strip, drawn like the document tabs: the active tab is outlined in
         the accent and flares into the panel beneath it, so tab and panel read as one shape. -->
    <div class="welcome__tabs" role="tablist" aria-label="Welcome">
      @for (tab of shownSections; track tab.id; let index = $index) {
        <button
          type="button"
          class="welcome__tab"
          role="tab"
          [id]="'welcome-tab-' + tab.id"
          [class.welcome__tab--active]="section() === tab.id"
          [attr.aria-selected]="section() === tab.id"
          [attr.aria-controls]="'welcome-panel'"
          [attr.tabindex]="section() === tab.id ? 0 : -1"
          (click)="show(tab.id)"
          (keydown)="onTabKeydown($event, index)"
        >
          <app-icon class="welcome__tab-icon" [icon]="tab.icon" />
          <span class="welcome__tab-label">{{ tab.label }}</span>
        </button>
      }
    </div>

    <section
      class="welcome__panel"
      id="welcome-panel"
      role="tabpanel"
      [class.welcome__panel--first]="section() === 'get-started'"
      [attr.aria-labelledby]="'welcome-tab-' + section()"
    >
      <!-- Every section stays mounted and the inactive ones are hidden, so a section keeps what the
           user was doing in it — a half-written project description, a search — across a look at
           another tab. -->
      <app-welcome-get-started
        [hidden]="section() !== 'get-started'"
        (openTab)="create($event)"
        (opened)="opened()"
      />
      @if (isShown('create')) {
        <app-welcome-create [hidden]="section() !== 'create'" />
      }
      @if (isShown('source-control')) {
        <app-welcome-source-control
          [hidden]="section() !== 'source-control'"
          (openTab)="create($event)"
          (opened)="opened()"
        />
      }
      <app-welcome-tools [hidden]="section() !== 'tools'" (openTab)="create($event)" />
    </section>
  </ng-template>
</app-modal>
