<app-tool-panel title="Reader" [icon]="Icon.READER" (closed)="panels.close()">
  @if (canRead()) {
    <div class="ra-body">
      <div class="ra-transport">
        <button
          type="button"
          class="ra-skip"
          aria-label="Previous paragraph"
          (click)="onSkipBack()"
        >
          <app-icon [icon]="Icon.SKIP_BACK" />
        </button>
        <button
          type="button"
          class="ra-play"
          [attr.aria-label]="isPlaying() ? 'Pause' : 'Play'"
          (click)="onToggle()"
        >
          <app-icon [icon]="isPlaying() ? Icon.PAUSE : Icon.PLAY_FILL" />
        </button>
        <button type="button" class="ra-skip" aria-label="Next paragraph" (click)="onSkipForward()">
          <app-icon [icon]="Icon.SKIP_FORWARD" />
        </button>
      </div>

      <div class="ra-scrub">
        <input
          type="range"
          class="ra-scrubber"
          min="0"
          [max]="scrubMax"
          [value]="progress() * scrubMax"
          [style.--ra-fill]="fillPercent()"
          aria-label="Seek"
          (input)="onSeek($event)"
        />
        <div class="ra-times">
          <span>{{ elapsedLabel() }}</span>
          <span>{{ totalLabel() }}</span>
        </div>
      </div>

      <div class="ra-control">
        <span class="ra-control-label" id="ra-speed-label">Speed</span>
        <div class="ra-segments" role="group" aria-labelledby="ra-speed-label">
          @for (speed of speeds; track speed) {
            <button
              type="button"
              class="ra-segment"
              [class.active]="rate() === speed"
              [attr.aria-pressed]="rate() === speed"
              (click)="onSpeed(speed)"
            >
              {{ speedLabel(speed) }}
            </button>
          }
        </div>
      </div>

      <div class="ra-control">
        <span class="ra-control-label" id="ra-highlight-label">Highlight</span>
        <div class="ra-segments" role="group" aria-labelledby="ra-highlight-label">
          <button
            type="button"
            class="ra-segment"
            [class.active]="highlightMode() === 'word'"
            [attr.aria-pressed]="highlightMode() === 'word'"
            (click)="onHighlight('word')"
          >
            Word
          </button>
          <button
            type="button"
            class="ra-segment"
            [class.active]="highlightMode() === 'sentence'"
            [attr.aria-pressed]="highlightMode() === 'sentence'"
            (click)="onHighlight('sentence')"
          >
            Sentence
          </button>
        </div>
      </div>

      <div class="ra-control">
        <span class="ra-control-label" id="ra-voice-label">Voice</span>
        @if (voiceOptions().length > 0) {
          <app-dropdown
            [options]="voiceOptions()"
            [value]="selectedVoiceUri()"
            [fullWidth]="true"
            ariaLabel="Voice"
            (valueChange)="onVoice($event)"
          />
        } @else {
          <p class="ra-empty">No voices available.</p>
        }
      </div>
    </div>
  } @else {
    <p class="ra-empty">No document to read.</p>
  }
</app-tool-panel>
