<ng-template
  [appDockPanel]="documentPanel"
  panelTitle="Document"
  [panelIcon]="Icon.MARKDOWN"
  panelRole="main"
>
  <app-markdown-document
    [documentId]="tabId()"
    [isActive]="isActive()"
    (ready)="onReady()"
    (contentChange)="onContentChange()"
    (selectionChange)="onSelectionChange($event)"
  />
</ng-template>

<ng-template
  appDockPanel="outline"
  panelTitle="Outline"
  [panelIcon]="Icon.OUTLINE"
  [defaultSize]="320"
  [maxSize]="720"
>
  <app-markdown-outline-panel />
</ng-template>

<ng-template
  appDockPanel="review"
  panelTitle="Review"
  [panelIcon]="Icon.REVIEW"
  [minInlineSize]="20"
  [defaultSize]="320"
  [maxSize]="720"
>
  <app-markdown-review-panel />
</ng-template>

<ng-template
  appDockPanel="reader"
  panelTitle="Reader"
  [panelIcon]="Icon.READER"
  [defaultSize]="320"
  [maxSize]="720"
>
  <app-markdown-reader-panel />
</ng-template>

<ng-template
  appDockPanel="agent"
  panelTitle="Agent"
  [panelIcon]="Icon.AGENT"
  [defaultSize]="360"
  [maxSize]="900"
>
  <app-agent-conversation-panel [tabId]="tabId()" [context]="fileContext()" language="markdown" />
</ng-template>

<ng-template
  appDockPanel="find"
  panelTitle="Find and Replace"
  [panelIcon]="Icon.SEARCH"
  [defaultSize]="320"
  [maxSize]="520"
>
  <app-find-panel
    [adapter]="findAdapter"
    [keepsSearch]="true"
    [(findText)]="findText"
    [(replaceText)]="replaceText"
    [(requestedMode)]="findMode"
    (closed)="onFindClosed()"
  />
</ng-template>

<app-dock-container />
