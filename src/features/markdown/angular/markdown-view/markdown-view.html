<ng-template
  [appDockPanel]="documentPanel"
  panelTitle="Document"
  [panelIcon]="Icon.MARKDOWN"
  panelRole="main"
>
  <app-markdown-document
    [documentId]="tabId()"
    [isActive]="isActive()"
    [removeOnDestroy]="!moving()"
    (ready)="onReady()"
    (contentChange)="onContentChange()"
    (selectionChange)="onSelectionChange($event)"
  />
</ng-template>

<ng-template
  appDockPanel="outline"
  panelTitle="Outline"
  [panelIcon]="Icon.OUTLINE"
  [sides]="DockSides.Horizontal"
  [minInlineSize]="16"
  [defaultInlineSize]="320"
  [maxInlineSize]="720"
>
  <app-markdown-outline-panel />
</ng-template>

<ng-template
  appDockPanel="review"
  panelTitle="Review"
  [panelIcon]="Icon.REVIEW"
  [sides]="DockSides.Horizontal"
  [minInlineSize]="20"
  [defaultInlineSize]="320"
  [maxInlineSize]="720"
>
  <app-markdown-review-panel />
</ng-template>

<ng-template
  appDockPanel="reader"
  panelTitle="Reader"
  [panelIcon]="Icon.READER"
  [sides]="DockSides.Horizontal"
  [minInlineSize]="16"
  [defaultInlineSize]="320"
  [maxInlineSize]="720"
>
  <app-markdown-reader-panel />
</ng-template>

<ng-template
  appDockPanel="agent"
  panelTitle="Agent"
  [panelIcon]="Icon.AGENT"
  [sides]="DockSides.Horizontal"
  [minInlineSize]="22.5"
  [defaultInlineSize]="360"
  [maxInlineSize]="900"
>
  <app-agent-conversation-panel [tabId]="tabId()" />
</ng-template>

<ng-template
  appDockPanel="find"
  panelTitle="Find and Replace"
  [panelIcon]="Icon.SEARCH"
  [sides]="DockSides.Horizontal"
  [minInlineSize]="16"
  [defaultInlineSize]="320"
  [maxInlineSize]="520"
>
  <app-find-panel
    [focuses]="dockReveal.isInUse('find')"
    [adapter]="findAdapter"
    [keepsSearch]="true"
    [(findText)]="findText"
    [(replaceText)]="replaceText"
    [(requestedMode)]="findMode"
    (closed)="onFindClosed()"
  />
</ng-template>

<app-dock-container />
