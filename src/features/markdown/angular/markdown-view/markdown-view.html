<app-panel-layout>
  <app-markdown-document
    main
    [documentId]="tabId()"
    [isActive]="isActive()"
    (ready)="onReady()"
    (contentChange)="onContentChange()"
    (selectionChange)="onSelectionChange($event)"
  />

  @if (activePanel() !== 'none') {
    <app-panel
      [edge]="panelPosition() === 'left' ? 'left' : 'right'"
      [(size)]="panelSize"
      [minSize]="220"
      [maxSize]="720"
    >
      @switch (activePanel()) {
        @case ('outline') {
          <app-markdown-outline-panel />
        }
        @case ('review') {
          <app-markdown-review-panel />
        }
        @case ('agent') {
          <app-markdown-agent-panel [documentId]="tabId()" />
        }
        @case ('reader') {
          <app-markdown-reader-panel />
        }
      }
    </app-panel>
  }
</app-panel-layout>
