<app-ribbon-overflow>
  <app-ribbon-strip-group title="Session">
    <app-ribbon-strip-menu-button
      [icon]="Icon.TERMINAL"
      label="New"
      [items]="newShellItems()"
      (action)="onNew()"
      (selected)="onNewShell($event)"
    />
    <app-ribbon-strip-menu-button
      [icon]="Icon.CLEAR"
      label="Clear"
      [items]="clearItems"
      (action)="onClear()"
      (selected)="onClearVariant($event)"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Clipboard">
    <app-ribbon-strip-button [icon]="Icon.CUT" label="Cut" (action)="onCut()" />
    <app-ribbon-strip-button [icon]="Icon.COPY" label="Copy" (action)="onCopy()" />
    <app-ribbon-strip-button [icon]="Icon.PASTE" label="Paste" (action)="onPaste()" />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Actions">
    <app-ribbon-strip-button [icon]="Icon.LIST" label="List" (action)="onList()" />
    <app-ribbon-strip-button [icon]="Icon.LIST_ALL" label="List All" (action)="onListAll()" />
    <app-ribbon-strip-button [icon]="Icon.FOLDER_OPEN" label="Open" (action)="onOpen()" />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Locations">
    <app-ribbon-strip-button [icon]="Icon.HOME" label="Home" (action)="onHome()" />
    <app-ribbon-strip-button [icon]="Icon.ROOT" label="Root" (action)="onRoot()" />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="View">
    <app-ribbon-strip-column>
      <app-ribbon-strip-check
        label="Scroll Lock"
        [checked]="scrollLocked()"
        (toggled)="onScrollLock($event)"
      />
    </app-ribbon-strip-column>
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="AI">
    <app-ribbon-strip-button [icon]="Icon.AGENT" label="Agent" (action)="onAgent()" />
  </app-ribbon-strip-group>
</app-ribbon-overflow>
