<app-panel-layout>
  <div main class="terminal-main">
    <app-terminal
      [terminalId]="tabId()"
      [cwd]="cwd()"
      [isActive]="isActive()"
      (ready)="onPaneReady()"
      (titleChange)="onTitleChange($event)"
      (exited)="onExited()"
    />
  </div>

  @if (agentMounted()) {
    <app-panel
      edge="right"
      [visible]="agentVisible()"
      [(size)]="agentSizeSignal"
      [minSize]="240"
      [maxSize]="900"
    >
      <app-terminal-agent-panel [tabId]="tabId()" [isActive]="isActive() && agentVisible()" />
    </app-panel>
  }
</app-panel-layout>
