<ng-template
  [appDockPanel]="terminalPanel"
  panelTitle="Terminal"
  [panelIcon]="Icon.TERMINAL"
  panelRole="main"
>
  <div class="terminal-main">
    <app-terminal
      [terminalId]="tabId()"
      [cwd]="cwd()"
      [shell]="defaultShell()"
      [isActive]="isActive()"
      (ready)="onPaneReady()"
      (shellChange)="onShellChange($event)"
      (titleChange)="onTitleChange($event)"
      (exited)="onExited($event)"
      (findRequested)="showFind()"
    />
  </div>
</ng-template>

<ng-template
  [appDockPanel]="agentPanel"
  panelTitle="Agent"
  [panelIcon]="Icon.AGENT"
  [defaultSize]="360"
  [maxSize]="900"
>
  <app-agent-conversation-panel [tabId]="tabId()" [isActive]="isActive()" surface="terminal" />
</ng-template>

<ng-template
  [appDockPanel]="findPanel"
  panelTitle="Find"
  [panelIcon]="Icon.SEARCH"
  [defaultSize]="320"
  [maxSize]="520"
>
  <app-find-panel
    [adapter]="findAdapter"
    [keepsSearch]="true"
    [(findText)]="findText"
    (closed)="onFindClosed()"
  />
</ng-template>

<app-dock-container />
