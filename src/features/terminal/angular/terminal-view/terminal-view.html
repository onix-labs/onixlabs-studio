<app-panel-layout layoutKey="terminal">
  <div main class="terminal-main">
    <app-terminal
      [terminalId]="tabId()"
      [cwd]="cwd()"
      [shell]="defaultShell()"
      [isActive]="isActive()"
      (ready)="onPaneReady()"
      (titleChange)="onTitleChange($event)"
      (exited)="onExited()"
      (shellChange)="onShellChange($event)"
    />
  </div>

  @if (agentMounted()) {
    <app-panel
      panelId="agent"
      defaultEdge="right"
      [visible]="agentVisible()"
      [defaultSize]="360"
      [minSize]="240"
      [maxSize]="900"
    >
      <app-terminal-agent-panel [tabId]="tabId()" [isActive]="isActive() && agentVisible()" />
    </app-panel>
  }
</app-panel-layout>
