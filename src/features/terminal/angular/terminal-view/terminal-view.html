<app-panel-layout layoutKey="terminal">
  <div main class="terminal-main">
    <app-terminal
      [terminalId]="tabId()"
      [cwd]="cwd()"
      [shell]="defaultShell()"
      [isActive]="isActive()"
      (ready)="onPaneReady()"
      (shellChange)="onShellChange($event)"
      (titleChange)="onTitleChange($event)"
      (findRequested)="showFind()"
    />
  </div>

  <!-- The agent panel mounts eagerly (hidden until shown) so this tab's live agent registers with
       Mission Control on open, whether or not the panel has been opened in the tab. -->
  <app-panel
    panelId="agent"
    defaultEdge="right"
    [visible]="agentVisible()"
    [defaultSize]="360"
    [minSize]="240"
    [maxSize]="900"
  >
    <app-terminal-agent-panel [tabId]="tabId()" [isActive]="isActive() && agentVisible()" />
  </app-panel>

  @if (findVisible()) {
    <app-panel
      panelId="find"
      defaultEdge="right"
      [defaultSize]="320"
      [minSize]="260"
      [maxSize]="520"
    >
      <app-find-panel [adapter]="findAdapter" (closed)="onFindClosed()" />
    </app-panel>
  }
</app-panel-layout>
