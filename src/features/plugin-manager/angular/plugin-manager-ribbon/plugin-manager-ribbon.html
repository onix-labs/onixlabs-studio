<app-ribbon-overflow>
  <app-ribbon-strip-group title="Plugins">
    <app-ribbon-strip-button
      [icon]="Icon.REFRESH"
      label="Refresh"
      [disabled]="busy()"
      (action)="onRefresh()"
    />
    <!-- Which group of the list is open: one at a time, so these are toggles rather than checks, and
         the pressed one follows a group opened from its own header. -->
    <app-ribbon-strip-button
      [icon]="Icon.CHECK"
      label="Installed"
      [toggle]="true"
      [pressed]="browse.shownGroup() === 'installed'"
      [disabled]="!browse.hasGroup('installed')"
      (action)="onGroup('installed')"
    />
    <app-ribbon-strip-button
      [icon]="Icon.DOWNLOAD"
      label="Available"
      [toggle]="true"
      [pressed]="browse.shownGroup() === 'available'"
      [disabled]="!browse.hasGroup('available')"
      (action)="onGroup('available')"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Search">
    <app-ribbon-strip-column>
      <app-text-field
        class="plugin-ribbon__search"
        kind="search"
        placeholder="Search…"
        ariaLabel="Search plugins"
        [(value)]="browse.query"
        (escape)="browse.clearQuery()"
      />
      <app-ribbon-strip-field
        label="Sort"
        [options]="sortOptions"
        [value]="browse.sort()"
        (changed)="onSort($event)"
      />
    </app-ribbon-strip-column>
  </app-ribbon-strip-group>
</app-ribbon-overflow>
