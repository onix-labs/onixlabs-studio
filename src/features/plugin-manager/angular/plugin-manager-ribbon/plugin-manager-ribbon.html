<app-ribbon-overflow>
  <app-ribbon-strip-group title="Plugins">
    <app-ribbon-strip-button
      [icon]="Icon.REFRESH"
      label="Refresh"
      [disabled]="busy()"
      (action)="onRefresh()"
    />
  </app-ribbon-strip-group>

  <app-ribbon-strip-group title="Agent">
    <app-ribbon-strip-button
      [icon]="Icon.AGENT"
      label="Agent"
      [toggle]="true"
      [pressed]="agentShown()"
      (action)="onToggleAgent()"
    />
  </app-ribbon-strip-group>
</app-ribbon-overflow>
