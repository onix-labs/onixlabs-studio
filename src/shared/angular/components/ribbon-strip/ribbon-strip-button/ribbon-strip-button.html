<button
  type="button"
  class="ribbon-button"
  [class.ribbon-button--tone-success]="tone() === 'success'"
  [class.ribbon-button--tone-warning]="tone() === 'warning'"
  [class.ribbon-button--tone-danger]="tone() === 'danger'"
  [class.ribbon-button--tone-info]="tone() === 'info'"
  [disabled]="disabled()"
  [attr.aria-label]="iconOnly() ? label() : null"
  [appTooltip]="iconOnly() ? label() : undefined"
  [attr.aria-pressed]="toggle() ? pressed() : null"
  (click)="onClick()"
>
  <app-icon [icon]="icon()" [size]="1.5" [rotation]="iconRotation()" />
  @if (!iconOnly()) {
    <span>{{ label() }}</span>
  }
</button>
