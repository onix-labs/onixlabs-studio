<div
  class="ribbon-menu-button"
  [class.ribbon-menu-button--tone-success]="tone() === 'success'"
  [class.ribbon-menu-button--tone-warning]="tone() === 'warning'"
  [class.ribbon-menu-button--tone-danger]="tone() === 'danger'"
  [class.ribbon-menu-button--tone-info]="tone() === 'info'"
>
  <button
    type="button"
    class="ribbon-menu-button__action"
    [disabled]="disabled()"
    (click)="onAction()"
  >
    <app-icon [icon]="icon()" [size]="1.5" />
    <span>{{ label() }}</span>
  </button>
  <!-- The chevron is a control in its own right — it opens a different thing from the button beside
       it — and showed only a glyph, with no name for either a screen reader or a pointer. It takes its
       name from what it drops down: "More Save actions". -->
  <button
    type="button"
    class="ribbon-menu-button__menu"
    [disabled]="disabled()"
    [attr.aria-label]="menuName()"
    [appTooltip]="menuName()"
    [appTooltipDisabled]="disabled()"
    [cdkMenuTriggerFor]="menu.panel() ?? null"
    [cdkMenuPosition]="menu.position()"
  >
    <app-icon [icon]="Icon.CARET_DOWN" [size]="0.75" />
  </button>
</div>

<app-menu #menu [items]="items()" placement="down-start" (selected)="onSelect($event)" />
