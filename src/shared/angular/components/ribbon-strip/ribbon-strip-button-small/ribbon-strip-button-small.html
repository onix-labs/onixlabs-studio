<button
  type="button"
  class="ribbon-button-small"
  [disabled]="disabled()"
  [attr.aria-label]="iconOnly() ? label() : null"
  [appTooltip]="iconOnly() ? label() : undefined"
  [attr.aria-pressed]="toggle() ? pressed() : null"
  (click)="onClick()"
>
  <app-icon [icon]="icon()" [size]="1" [rotation]="iconRotation()" />
  @if (!iconOnly()) {
    <span>{{ label() }}</span>
  }
</button>
