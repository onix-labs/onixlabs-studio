<div class="category-list">
  @if (searchable()) {
    <app-text-field
      class="category-list__search"
      kind="search"
      [placeholder]="searchPlaceholder()"
      [ariaLabel]="searchPlaceholder()"
      [(value)]="query"
      (escape)="query.set('')"
    />
  }
  <!-- A view's own filters beside the search, such as Containers' "Only show running". -->
  <ng-content select="[categoryListFilters]" />
  @if (title()) {
    <h3 class="category-list__title">{{ title() }}</h3>
  }
  <!-- The entries are the shared list's rows, so selection, hover and keyboard read as every other
       list in Studio does. -->
  <app-list-view
    [rows]="rows()"
    [selectedId]="selectedId()"
    [emptyText]="emptyText()"
    (rowClick)="selectedIdChange.emit($event.id)"
  >
    <ng-template let-row>
      @let item = itemOf(row);
      <span
        class="category-list__item"
        [class.category-list__item--nested]="item.nested"
        [class.category-list__item--muted]="item.muted"
        [class.category-list__item--selected]="selectedId() === item.id"
      >
        <app-icon class="category-list__icon" [icon]="item.icon" />
        <span class="category-list__label">{{ item.label }}</span>
        @if (item.badge) {
          <app-icon
            class="category-list__badge"
            [icon]="item.badge"
            [attr.title]="item.badgeLabel ?? null"
            [attr.aria-label]="item.badgeLabel ?? null"
          />
        } @else if (item.count !== undefined && item.count !== null) {
          <span class="category-list__count">{{ item.count }}</span>
        }
      </span>
      @if (item.action) {
        <button
          type="button"
          class="category-list__action"
          [attr.aria-label]="item.actionLabel ?? null"
          [appTooltip]="item.actionLabel ?? ''"
          (click)="$event.stopPropagation(); actionClick.emit(item.id)"
          (keydown.enter)="$event.stopPropagation()"
          (keydown.space)="$event.stopPropagation()"
        >
          <app-icon [icon]="item.action" />
        </button>
      }
    </ng-template>
  </app-list-view>
</div>
