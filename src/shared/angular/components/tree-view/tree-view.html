<!-- One row, shared by both rendering modes so their markup can never diverge. A row being named is
     inert to the keys and clicks that would activate it: its field stops them before they get here. -->
<ng-template #rowTemplate let-row>
  <div
    class="tree-row"
    role="treeitem"
    tabindex="0"
    [attr.data-tree-id]="row.id"
    [class.active]="selectedId() !== null && row.id === selectedId()"
    [class.tree-row--disabled]="row.disabled === true"
    [style.padding-left.px]="indentFor(row.depth)"
    [attr.aria-expanded]="row.expandable ? row.expanded : null"
    [attr.aria-selected]="selectedId() !== null ? row.id === selectedId() : null"
    [cdkContextMenuTriggerFor]="hasContextMenu() ? (contextMenu.panel() ?? null) : null"
    [appMenuSubject]="row"
    [cdkContextMenuDisabled]="!rowHasMenu(row)"
    (click)="rowClick.emit(row)"
    (dblclick)="rowDoubleClick.emit(row)"
    (keydown.enter)="activate($event, row)"
    (keydown.space)="activate($event, row)"
  >
    @if (row.expandable) {
      <app-icon
        class="tree-chevron"
        [icon]="row.expanded ? Icon.CARET_DOWN_FILL : Icon.CARET_RIGHT_FILL"
      />
    } @else {
      <span class="tree-spacer"></span>
    }
    <!-- The content template is told when its row is being named, so it can drop the label and the
         decorations the field takes the place of; its leading icon stays, so the row keeps its shape. -->
    @let editing = isEditing(row);
    <ng-container
      [ngTemplateOutlet]="content() ?? null"
      [ngTemplateOutletContext]="{ $implicit: row, editing }"
    />
    <!-- Keyed on the edit session, so every edit gets a field of its own. The virtual scroller keeps
         the views of removed rows and hands them to the next rows it inserts; without the key, a
         placeholder opened after another was cancelled would inherit the finished field — one that
         has already reported its edit and never takes focus again. -->
    @if (editing) {
      @for (session of [editSession()]; track session) {
        <app-row-edit-field
          [initial]="editValue()"
          [selection]="editSelection()"
          [(value)]="editDraft"
          (commit)="onEditCommit(row, $event)"
          (abandon)="editCancel.emit(row)"
        />
      }
    }
  </div>
</ng-template>

@if (virtualActive()) {
  <cdk-virtual-scroll-viewport
    class="tree-list tree-list--virtual"
    role="tree"
    [itemSize]="itemSize"
  >
    <ng-container *cdkVirtualFor="let row of rows(); trackBy: trackRow">
      <ng-container
        [ngTemplateOutlet]="rowTemplate"
        [ngTemplateOutletContext]="{ $implicit: row }"
      />
    </ng-container>
  </cdk-virtual-scroll-viewport>
} @else {
  <div class="tree-list" role="tree">
    @for (row of rows(); track row.id) {
      <ng-container
        [ngTemplateOutlet]="rowTemplate"
        [ngTemplateOutletContext]="{ $implicit: row }"
      />
    }
  </div>
}

<!-- One menu shared by every row: the row it was opened on travels with the trigger's data (kept
     current by appMenuSubject, since CDK builds the portal once), so the items and their subject are
     resolved together when it opens. -->
<app-menu #contextMenu [itemsFor]="menuItemsFor" (chosen)="onContextChoice($event)" />
