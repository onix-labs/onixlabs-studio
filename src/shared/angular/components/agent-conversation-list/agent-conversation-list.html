<div class="conversations">
  <div class="conversations__toolbar">
    <input
      class="conversations__search"
      type="text"
      [value]="query()"
      (input)="onSearch($event)"
      placeholder="Search chats"
      aria-label="Search chats"
    />
    <div class="conversations__actions">
      <button
        type="button"
        class="conversations__action conversations__select-all"
        [disabled]="!hasRows()"
        (click)="onToggleSelectAll()"
        [attr.aria-label]="selectAllLabel() + ' conversations'"
      >
        <app-icon [icon]="Icon.SELECT_ALL" />
        <span>{{ selectAllLabel() }}</span>
      </button>
      <button
        type="button"
        class="conversations__action conversations__delete"
        [disabled]="!hasChecked()"
        (click)="onRequestDelete()"
        [attr.aria-label]="'Delete ' + checkedCount() + ' conversation(s)'"
      >
        <app-icon [icon]="Icon.TRASH" />
        <span>Delete@if (checkedCount() > 0) {&nbsp;({{ checkedCount() }})}</span>
      </button>
    </div>
  </div>

  <app-list-view
    [rows]="rows()"
    [selectedId]="activeId()"
    emptyText="No saved conversations yet."
    (rowClick)="onRowClick($event)"
  >
    <ng-template let-row>
      @let summary = summaryOf(row);
      <app-checkbox
        class="conversations__check"
        [checked]="isChecked(summary.id)"
        (checkedChange)="onToggle(summary.id, $event)"
        (click)="$event.stopPropagation()"
      />
      <span class="conversations__text">
        <span class="conversations__title">
          <app-highlighted-text [text]="summary.title" [query]="query()" />
        </span>
        <span class="conversations__meta">
          {{ summary.messageCount }} message{{ summary.messageCount === 1 ? '' : 's' }} ·
          {{ formatWhen(summary.updatedAt) }}
        </span>
      </span>
    </ng-template>
  </app-list-view>
</div>

<app-modal
  [open]="confirmOpen()"
  [dismissable]="true"
  [width]="26"
  ariaLabel="Delete conversations"
  (dismiss)="onCancelDelete()"
>
  <h2 class="conversations__confirm-title">Delete conversations?</h2>
  <p class="conversations__confirm-body">
    {{ checkedCount() }} conversation{{ checkedCount() === 1 ? '' : 's' }} will be permanently
    deleted. This cannot be undone.
  </p>
  <div class="conversations__confirm-actions">
    <button type="button" class="conversations__button" (click)="onCancelDelete()">Cancel</button>
    <button
      type="button"
      class="conversations__button conversations__button--danger"
      (click)="onConfirmDelete()"
    >
      Delete
    </button>
  </div>
</app-modal>
