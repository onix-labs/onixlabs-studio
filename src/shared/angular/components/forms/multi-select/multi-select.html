<!-- The face: what is ticked, or the placeholder, on one ellipsized line beside a caret that turns
     while the panel is open. It is the menu trigger, so the CDK owns opening, dismissal and focus
     return. -->
<button
  #face
  type="button"
  class="multi-select"
  [class.multi-select--open]="open()"
  [class.multi-select--empty]="value().length === 0"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  [cdkMenuTriggerFor]="panel"
  [cdkMenuPosition]="menuPosition"
  (cdkMenuOpened)="onOpened()"
  (cdkMenuClosed)="onClosed()"
>
  <span class="multi-select__label">{{ faceLabel() }}</span>
  <app-icon class="multi-select__caret" [icon]="Icon.CARET_DOWN_FILL" [size]="0.8" />
</button>

<!-- `cdkMenu` must be this template's root node: on an inner element the CDK silently falls back to
     an inline menu, which never dismisses. Rows are the atom's own keep-open checkbox items, so a
     click ticks a row and leaves the panel up for the next one. -->
<ng-template #panel>
  <div class="multi-select__panel" cdkMenu [style.min-inline-size.px]="faceWidth()">
    @for (option of options(); track option.value) {
      <button
        type="button"
        class="multi-select__option"
        appMultiSelectOption
        [cdkMenuItemChecked]="isTicked(option)"
        [cdkMenuItemDisabled]="option.disabled ?? false"
        (cdkMenuItemTriggered)="toggle(option)"
      >
        <span class="multi-select__box" aria-hidden="true"></span>
        <span class="multi-select__option-label">{{ option.label }}</span>
      </button>
    }
  </div>
</ng-template>
