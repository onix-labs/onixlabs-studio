<input
  type="password"
  class="password-field"
  autocomplete="off"
  [id]="controlId"
  [value]="value()"
  [placeholder]="shownPlaceholder()"
  [disabled]="disabled()"
  (input)="onInput($event)"
/>
@if (label(); as caption) {
  <label class="password-field__floating-label" [for]="controlId">{{ caption }}</label>
}
