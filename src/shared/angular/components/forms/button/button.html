<!-- Content is projected after the label so a caller can add an adornment (a count, a chevron) to a
     labelled button. A button whose whole content is projected should still state its label, since
     that is what decides whether it is padded for text. -->
<button
  class="button"
  [type]="type()"
  [disabled]="nonInteractive()"
  [attr.aria-busy]="loading() ? true : null"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-pressed]="pressed()"
  [attr.title]="nativeTooltip()"
  [appTooltip]="bubble()"
>
  <!-- The caller's icon and the loading spinner are both present while loading; the stylesheet shows
       one at a time (spinner at rest, and — for an interactive loading button — the icon on hover), so
       the swap is a pure CSS crossfade with no re-render. -->
  @if (icon(); as glyph) {
    <app-icon
      class="button__icon button__icon--content"
      [icon]="glyph"
      [rotation]="iconRotation()"
    />
  }
  @if (loading()) {
    <app-icon class="button__icon button__icon--spinner button__icon--spin" [icon]="spinnerIcon" />
  }
  @if (label(); as text) {
    <span class="button__label">{{ text }}</span>
  }
  <ng-content />
</button>
