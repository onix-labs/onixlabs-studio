<textarea
  #control
  class="textarea"
  [class.textarea--seamless]="variant() === 'seamless'"
  [class.textarea--fixed]="fixedHeight()"
  [style.block-size]="fixedHeight() ? rows() + 'lh' : null"
  [rows]="rows()"
  [value]="value()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  (input)="onInput($event)"
  (keydown)="keyDown.emit($event)"
  (paste)="pasted.emit($event)"
  (blur)="blurred.emit()"
></textarea>
