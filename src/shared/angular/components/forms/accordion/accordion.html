<div class="accordion">
  <button
    type="button"
    class="accordion__header"
    [attr.aria-expanded]="expanded()"
    (click)="toggle()"
  >
    <app-icon [icon]="expanded() ? Icon.CARET_DOWN : Icon.CARET_RIGHT" />
    <span>{{ heading() }}</span>
  </button>
  @if (expanded()) {
    <div class="accordion__body">
      <ng-content />
    </div>
  }
</div>
