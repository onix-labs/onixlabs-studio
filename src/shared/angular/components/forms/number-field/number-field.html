<input
  type="number"
  class="number-field"
  [value]="zeroIsEmpty() && value() === 0 ? '' : value()"
  [attr.placeholder]="placeholder()"
  [attr.aria-label]="ariaLabel()"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [disabled]="disabled()"
  (input)="onInput($event)"
  (change)="onChange($event)"
/>
