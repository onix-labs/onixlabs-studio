<div
  class="quick-open"
  role="dialog"
  [attr.aria-label]="mode() === 'line' ? 'Go to Line' : 'Go to Symbol'"
>
  <app-text-field
    class="quick-open__field"
    [kind]="mode() === 'line' ? 'text' : 'search'"
    [(value)]="picker.query"
    [placeholder]="placeholder()"
    [ariaLabel]="mode() === 'line' ? 'Line, or line:column' : 'Symbol name'"
    (keydown.enter)="commit($event)"
    (escape)="dismissed.emit()"
    (keydown.arrowdown)="step($event, 1)"
    (keydown.arrowup)="step($event, -1)"
  />

  @if (mode() === 'line') {
    <p
      class="quick-open__hint"
      [class.quick-open__hint--invalid]="picker.lineEntry().kind === 'invalid'"
      aria-live="polite"
    >
      {{ picker.lineHint() }}
    </p>
  } @else if (symbols() === null) {
    <p class="quick-open__hint" aria-live="polite">Reading the file's symbols…</p>
  } @else {
    <app-list-view
      class="quick-open__list"
      [rows]="picker.rows()"
      [selectedId]="picker.selectedId()"
      [emptyText]="picker.emptyText()"
      (rowClick)="pick($event)"
    >
      <ng-template let-row>
        @let symbol = symbolOf(row);
        <app-icon class="quick-open__icon" [icon]="symbol.icon" aria-hidden="true" />
        <span class="quick-open__name">{{ symbol.name }}</span>
        @if (symbol.container.length > 0) {
          <span class="quick-open__container">{{ symbol.container }}</span>
        }
      </ng-template>
    </app-list-view>
  }
</div>
