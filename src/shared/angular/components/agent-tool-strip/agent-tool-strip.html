<div class="strip">
  <app-button
    variant="none"
    [icon]="Icon.CHAT_NEW"
    ariaLabel="New chat"
    tooltip="New chat"
    [disabled]="!conversation.hasMessages()"
    (click)="conversation.newChat()"
  />
  <app-button
    variant="none"
    tone="danger"
    [icon]="Icon.STOP"
    ariaLabel="Stop"
    tooltip="Stop"
    [disabled]="!conversation.isRunning()"
    (click)="conversation.stop()"
  />
  <app-button
    variant="none"
    [icon]="Icon.COMPACT"
    ariaLabel="Compact conversation"
    tooltip="Compact conversation"
    [disabled]="conversation.isRunning() || !conversation.hasMessages()"
    (click)="conversation.compact()"
  />

  <!-- Remote Control is on or off here; how much a peer may do once on is the global posture, set in
       Settings. Either way round the press only opens the confirmation — the toggle flips on Yes. It
       sits with the session actions rather than the fields: it is a button, and the fields either side
       of it are the ones that give way when the strip narrows. -->
  @if (supportsRemoteControl()) {
    <app-button
      variant="none"
      [icon]="Icon.REMOTE_CONTROL"
      [pressed]="remoteControlEnabled()"
      [ariaLabel]="remoteControlLabel()"
      [tooltip]="remoteControlLabel()"
      (click)="onRemoteControlToggle()"
    />
  }

  <!-- One field for the pair: the models of every connection, grouped under their provider's label. -->
  <app-dropdown
    class="strip__field"
    ariaLabel="Provider and model"
    [fullWidth]="true"
    [options]="engineOptions()"
    [value]="engineSelection()"
    (valueChange)="onEngine($event)"
  />

  <app-button
    variant="none"
    [icon]="Icon.ATTACH"
    ariaLabel="Attach file"
    tooltip="Attach file"
    (click)="conversation.attachFile()"
  />
  <app-button
    variant="none"
    [icon]="Icon.FOLDER_PLUS"
    ariaLabel="Add folder"
    tooltip="Add folder"
    (click)="conversation.attachFolder()"
  />
  <app-button
    variant="none"
    [icon]="Icon.SELECTION"
    ariaLabel="Attach selection"
    tooltip="Attach selection"
    [disabled]="!hasSelection()"
    (click)="conversation.attachSelection()"
  />

  <app-button
    class="strip__end"
    variant="none"
    [icon]="Icon.SCROLL_TO_TOP"
    ariaLabel="Scroll to top"
    tooltip="Scroll to top"
    (click)="conversation.scrollToTop()"
  />
  <app-button
    variant="none"
    [icon]="Icon.SCROLL_TO_LAST_PROMPT"
    ariaLabel="Scroll to last prompt"
    tooltip="Scroll to last prompt"
    (click)="conversation.scrollToLastPrompt()"
  />
  <app-button
    variant="none"
    [icon]="Icon.SCROLL_TO_BOTTOM"
    ariaLabel="Scroll to bottom"
    tooltip="Scroll to bottom"
    (click)="conversation.scrollToBottom()"
  />
  <app-button
    variant="none"
    [icon]="Icon.RECENT"
    ariaLabel="Conversation history"
    tooltip="Conversation history"
    [pressed]="historyPressed()"
    (click)="onHistoryToggle()"
  />
</div>

<app-agent-remote-modal
  [open]="remoteConfirmOpen()"
  [enabling]="!remoteControlEnabled()"
  (confirmed)="onRemoteControlConfirmed()"
  (dismissed)="onRemoteControlDismissed()"
/>
