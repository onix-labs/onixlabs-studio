<div class="strip">
  <app-button
    variant="none"
    [icon]="Icon.PLUS"
    ariaLabel="New chat"
    tooltip="New chat"
    (click)="conversation.newChat()"
  />
  <app-button
    variant="none"
    [icon]="Icon.STOP"
    ariaLabel="Stop"
    tooltip="Stop"
    [disabled]="!conversation.isRunning()"
    (click)="conversation.stop()"
  />
  <app-button
    variant="none"
    [icon]="Icon.COMPACT"
    ariaLabel="Compact conversation"
    tooltip="Compact conversation"
    [disabled]="conversation.isRunning() || !conversation.hasMessages()"
    (click)="conversation.compact()"
  />

  <app-dropdown
    class="strip__field"
    ariaLabel="Provider"
    [fullWidth]="true"
    [options]="providerOptions()"
    [value]="provider()"
    (valueChange)="onProvider($event)"
  />
  <app-dropdown
    class="strip__field"
    ariaLabel="Model"
    [fullWidth]="true"
    [options]="modelOptions()"
    [value]="model()"
    (valueChange)="onModel($event)"
  />

  <app-button
    variant="none"
    [icon]="Icon.ATTACH"
    ariaLabel="Attach file"
    tooltip="Attach file"
    (click)="conversation.attachFile()"
  />
  <app-button
    variant="none"
    [icon]="Icon.FOLDER_PLUS"
    ariaLabel="Add folder"
    tooltip="Add folder"
    (click)="conversation.attachFolder()"
  />
  <app-button
    variant="none"
    [icon]="Icon.SELECTION"
    ariaLabel="Attach selection"
    tooltip="Attach selection"
    (click)="conversation.attachSelection()"
  />

  <app-button
    class="strip__history"
    variant="none"
    [icon]="Icon.RECENT"
    ariaLabel="Conversation history"
    tooltip="Conversation history"
    [pressed]="historyPressed()"
    (click)="onHistoryToggle()"
  />
</div>
