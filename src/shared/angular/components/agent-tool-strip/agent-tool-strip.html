<!-- Every enablement here comes from the one table in agent-controls.ts, shared with the ribbon. -->
<div class="strip">
  <app-button
    variant="none"
    [icon]="Icon.CHAT_NEW"
    ariaLabel="New chat"
    tooltip="New chat"
    [disabled]="!controls().newChat"
    (click)="conversation.newChat()"
  />
  <app-button
    variant="none"
    tone="danger"
    [icon]="Icon.STOP"
    ariaLabel="Stop"
    tooltip="Stop"
    [disabled]="!controls().stop"
    (click)="conversation.stop()"
  />
  <app-button
    variant="none"
    [icon]="Icon.COMPACT"
    ariaLabel="Compact conversation"
    tooltip="Compact conversation"
    [disabled]="!controls().compact"
    (click)="conversation.compact()"
  />

  <!-- Remote Control is on or off here; how much a peer may do once on is the global posture, set in
       Settings. Either way round the press only opens the confirmation — the toggle flips on Yes. It
       sits with the session actions rather than the fields: it is a button, and the fields either side
       of it are the ones that give way when the strip narrows. -->
  @if (supportsRemoteControl()) {
    <app-button
      variant="none"
      [icon]="Icon.REMOTE_CONTROL"
      [pressed]="remoteControlEnabled()"
      [ariaLabel]="remoteControlLabel()"
      [tooltip]="remoteControlLabel()"
      [disabled]="!controls().remoteControl"
      (click)="onRemoteControlToggle()"
    />
  }

  <span class="strip__divider" aria-hidden="true"></span>

  <!-- One field for the pair: the models of every connection, grouped under their provider's label. -->
  <app-dropdown
    class="strip__field"
    ariaLabel="Provider and model"
    [fullWidth]="true"
    [options]="engineOptions()"
    [value]="engineSelection()"
    [disabled]="!controls().engine"
    (valueChange)="onEngine($event)"
  />

  <span class="strip__divider" aria-hidden="true"></span>

  <!-- The three ways to attach context share one button: they are one decision (what to attach),
       and three icons side by side made the strip too busy to read. -->
  <app-button
    variant="none"
    [icon]="Icon.PLUS"
    ariaLabel="Attach"
    tooltip="Attach"
    [disabled]="!controls().attach"
    [cdkMenuTriggerFor]="attachMenu.panel() ?? null"
    [cdkMenuPosition]="attachMenu.position()"
  />
  <app-menu
    #attachMenu
    [items]="attachItems()"
    placement="down-start"
    (selected)="onAttachMenu($event)"
  />

  <!-- The transcript's own controls (history and the scroll jumps) act on what is shown rather than on
       the conversation, so they sit in the "…" menu at the far end, as on every other strip. -->
  <app-button
    class="strip__end"
    variant="none"
    [icon]="Icon.DOTS_THREE_BOLD"
    ariaLabel="More Actions"
    tooltip="More Actions"
    [cdkMenuTriggerFor]="moreMenu.panel() ?? null"
    [cdkMenuPosition]="moreMenu.position()"
  />
  <app-menu #moreMenu [items]="moreItems()" placement="down-end" (selected)="onMoreMenu($event)" />
</div>

<app-agent-remote-modal
  [open]="remoteConfirmOpen()"
  [enabling]="!remoteControlEnabled()"
  (confirmed)="onRemoteControlConfirmed()"
  (dismissed)="onRemoteControlDismissed()"
/>
