<div class="explorer-toolbar">
  <app-text-field
    class="explorer-toolbar__search"
    kind="search"
    [placeholder]="searchPlaceholder()"
    [ariaLabel]="searchPlaceholder()"
    [value]="query()"
    (valueChange)="onSearchValue($event)"
  />
  <div class="explorer-toolbar__actions">
    <!-- Narrows the tree to what has changed, for the explorers that can (#1053). With nothing to
         narrow to — no repository, or no changes — it stays put but cannot be pressed, and says why. -->
    @if (changesOnly(); as filter) {
      <app-button
        variant="none"
        [icon]="Icon.GIT_DIFF"
        ariaLabel="Show Changed Files Only"
        [tooltip]="
          filter.unavailable === null
            ? 'Show Changed Files Only'
            : 'Show Changed Files Only (' + filter.unavailable + ')'
        "
        [pressed]="filter.on"
        [disabled]="filter.unavailable !== null"
        (click)="changesOnlyToggle.emit()"
      />
    }
    <app-button
      variant="none"
      [icon]="Icon.PLUS_SQUARE_DUOTONE"
      ariaLabel="Expand All"
      tooltip="Expand All"
      (click)="expandAll.emit()"
    />
    <app-button
      variant="none"
      [icon]="Icon.MINUS_SQUARE_DUOTONE"
      ariaLabel="Collapse All"
      tooltip="Collapse All"
      (click)="collapseAll.emit()"
    />
    <!-- A panel's own strip buttons, after the folding every explorer shares and before its menu. -->
    <ng-content />
    @if (moreItems().length > 0) {
      <app-button
        variant="none"
        [icon]="Icon.DOTS_THREE_BOLD"
        ariaLabel="More Actions"
        tooltip="More Actions"
        [cdkMenuTriggerFor]="moreMenu.panel() ?? null"
        [cdkMenuPosition]="moreMenu.position()"
      />
    }
  </div>
</div>

<app-menu
  #moreMenu
  [items]="moreItems()"
  placement="down-end"
  (selected)="moreSelected.emit($event)"
/>
