<div class="explorer-toolbar">
  <app-text-field
    class="explorer-toolbar__search"
    kind="search"
    [placeholder]="searchPlaceholder()"
    [ariaLabel]="searchPlaceholder()"
    [value]="query()"
    (valueChange)="onSearchValue($event)"
  />
  <div class="explorer-toolbar__actions">
    <!-- Narrows the tree to the files that matter now (#1182 follow-up): those version control sees as
         changed, or with problems of the severities ticked — additive, and nothing ticked shows
         everything. Pressed, in the accent, while anything is ticked. -->
    @if (filter(); as state) {
      <app-button
        variant="none"
        [icon]="Icon.FILTER"
        ariaLabel="Filter"
        tooltip="Filter"
        [pressed]="state.selected.size > 0"
        [cdkMenuTriggerFor]="filterMenu.panel() ?? null"
        [cdkMenuPosition]="filterMenu.position()"
      />
    }
    <app-button
      variant="none"
      [icon]="Icon.PLUS_SQUARE_DUOTONE"
      ariaLabel="Expand All"
      tooltip="Expand All"
      (click)="expandAll.emit()"
    />
    <app-button
      variant="none"
      [icon]="Icon.MINUS_SQUARE_DUOTONE"
      ariaLabel="Collapse All"
      tooltip="Collapse All"
      (click)="collapseAll.emit()"
    />
    <!-- A panel's own strip buttons, after the folding every explorer shares and before its menu. -->
    <ng-content />
    @if (moreItems().length > 0) {
      <app-button
        variant="none"
        [icon]="Icon.DOTS_THREE_BOLD"
        ariaLabel="More Actions"
        tooltip="More Actions"
        [cdkMenuTriggerFor]="moreMenu.panel() ?? null"
        [cdkMenuPosition]="moreMenu.position()"
      />
    }
  </div>
</div>

<app-menu
  #moreMenu
  [items]="moreItems()"
  placement="down-end"
  (selected)="moreSelected.emit($event)"
/>

<app-menu #filterMenu [items]="filterItems()" placement="down-end" (selected)="onFilter($event)" />
