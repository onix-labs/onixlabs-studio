<app-button
  variant="none"
  [icon]="Icon.QUICK_RESPONSE"
  ariaLabel="Quick responses"
  tooltip="Quick responses"
  [cdkMenuTriggerFor]="menu"
  [cdkMenuPosition]="menuPosition"
  (cdkMenuClosed)="cancelEdit()"
/>

<!-- `cdkMenu` must be this template's root node: on an inner element the CDK silently falls back to
     an inline menu, which never dismisses. -->
<ng-template #menu>
  <div #panel class="quick-responses__panel" cdkMenu>
    <!-- Only the replies scroll. The list is the panel's one scrolling child so the add field below it
         stays put however long the list grows, rather than being pushed out of reach past the foot of
         a scrolled panel. -->
    <div class="quick-responses__list" cdkDropList (cdkDropListDropped)="onDrop($event)">
      @for (response of responses(); track response.id) {
        <!-- The CDK parks a drag preview on `<body>` by default, where the row's styling — all of it
             written against the panel's classes — stops matching and the clone re-lays-out under the
             cursor. Rendering it into the row's own parent keeps those selectors applying. The preview
             is a popover in the top layer, so the list's own scrolling never clips it. -->
        <div
          class="quick-responses__item"
          cdkDrag
          cdkDragLockAxis="y"
          cdkDragPreviewContainer="parent"
        >
          <!-- Dragging starts from the grip alone: the rest of the row is the button that picks the
               reply, and a row that moved when pulled anywhere would be hard to simply click. -->
          <span
            class="quick-responses__grip"
            cdkDragHandle
            aria-label="Drag to reorder"
            title="Drag to reorder"
          >
            <app-icon [icon]="Icon.GRIP_VERTICAL" [size]="1" />
          </span>
          @if (editingId() === response.id) {
            <!-- Editing in place (#1420). Its keys stay its own, as the add field's do: the menu runs
                 type-ahead on printable keys and closes on Escape, which here cancels the edit.
                 Enter's default is cancelled too: saving hands focus to a row's pick mid-keystroke,
                 and the browser would then press it — sending a reply and closing the panel. -->
            <app-text-field
              #editField
              class="quick-responses__edit"
              [(value)]="editDraft"
              [ariaLabel]="'Edit quick response: ' + response.text"
              (enter)="saveEdit(response)"
              (escape)="cancelEdit(response.id)"
              (keydown)="$event.stopPropagation()"
              (keydown.enter)="$event.preventDefault()"
            />
          } @else {
            <button
              type="button"
              class="quick-responses__select"
              [attr.data-response-id]="response.id"
              cdkMenuItem
              (cdkMenuItemTriggered)="choose(response)"
            >
              <span class="quick-responses__text">{{ response.text }}</span>
            </button>
            <!-- Everything else a row can do, in its own small menu (#1420): Edit, the other of the
                 two things picking does, and Delete. Opened inside this panel, it joins the panel's
                 menu stack, so a press in it is not a click away from the panel — nor from a
                 collapsed dock panel showing this one as a flyout (#1057). Not being one of the
                 panel's items, it opens on a click alone and is closed as the panel moves on
                 (`appMenuClickTrigger`); otherwise each opened on hover and none ever closed. -->
            <app-button
              #rowTrigger="cdkMenuTriggerFor"
              appMenuClickTrigger
              variant="none"
              size="small"
              [icon]="Icon.DOTS_THREE_BOLD"
              [ariaLabel]="'More actions: ' + response.text"
              tooltip="More Actions"
              [cdkMenuTriggerFor]="rowMenu"
              [cdkMenuTriggerData]="{ $implicit: response, trigger: rowTrigger }"
              [cdkMenuPosition]="rowMenuPosition"
            />
          }
        </div>
      } @empty {
        <p class="quick-responses__empty">
          <app-icon [icon]="Icon.QUICK_RESPONSE" aria-hidden="true" />
          <span>No quick responses yet</span>
        </p>
      }
    </div>

    <!-- The CDK menu runs type-ahead over its items on every printable key, so a field inside the
         panel has to keep its keystrokes to itself or typing would move the menu's focus instead. -->
    <div class="quick-responses__add">
      <app-text-field
        [(value)]="draft"
        placeholder="Enter quick response…"
        ariaLabel="Enter quick response"
        (enter)="add()"
        (keydown)="$event.stopPropagation()"
      />
    </div>
  </div>
</ng-template>

<!-- A row's own menu. Edit and Delete change the list the panel shows, so they leave the panel open
     and close only this menu (`appMenuKeepOpen`); the other action closes everything and acts, as
     picking the row does. -->
<ng-template #rowMenu let-response let-rowTrigger="trigger">
  <div class="app-menu-panel" cdkMenu appMenuPointerGuard>
    <button
      type="button"
      class="app-menu-panel__item"
      cdkMenuItem
      (appMenuKeepOpen)="startEdit(response, rowTrigger)"
    >
      <app-icon [icon]="Icon.PENCIL" />
      <span class="app-menu-panel__item-label">Edit</span>
    </button>
    <button
      type="button"
      class="app-menu-panel__item"
      cdkMenuItem
      (cdkMenuItemTriggered)="chooseAlternate(response)"
    >
      <app-icon [icon]="alternate().icon" />
      <span class="app-menu-panel__item-label">{{ alternate().label }}</span>
    </button>
    <button
      type="button"
      class="app-menu-panel__item"
      cdkMenuItem
      (appMenuKeepOpen)="remove(response, rowTrigger)"
    >
      <app-icon [icon]="Icon.TRASH" />
      <span class="app-menu-panel__item-label">Delete</span>
    </button>
  </div>
</ng-template>
