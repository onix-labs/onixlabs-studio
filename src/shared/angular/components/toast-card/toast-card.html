<!-- Header: the severity icon, the title, and the close button on one line, vertically centred. -->
<div class="toast__header">
  <app-icon class="toast__icon" [icon]="iconFor(notification().severity)" [size]="1.4" />
  <p class="toast__title">{{ notification().title }}</p>
  <app-button
    class="toast__close"
    variant="none"
    size="small"
    [tone]="toneFor(notification().severity)"
    [icon]="Icon.CLOSE"
    [ariaLabel]="closeVerb() + ': ' + notification().title"
    (pointerdown)="$event.preventDefault()"
    (click)="closed.emit(); $event.stopPropagation()"
  />
</div>
@if (notification().detail) {
  <p class="toast__detail">{{ notification().detail }}</p>
}
@if (notification().actions.length > 0) {
  <div class="toast__actions">
    @for (action of notification().actions; track action.label) {
      <app-button
        variant="none"
        size="small"
        [tone]="toneFor(notification().severity)"
        [label]="action.label"
        (pointerdown)="$event.preventDefault()"
        (click)="acted.emit(action); $event.stopPropagation()"
      />
    }
  </div>
}
