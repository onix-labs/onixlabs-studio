<app-panel-toolbar class="popout-tab-strip" role="tablist">
  @for (panel of panels(); track panel.id) {
    <button
      class="panel-toolbar__button popout-tab-strip__tab"
      [class.panel-toolbar__button--active]="panel.id === activeId()"
      (click)="activated.emit(panel.id)"
      role="tab"
      [attr.aria-selected]="panel.id === activeId()"
    >
      <app-icon class="popout-tab-strip__icon" [icon]="panel.icon" />
      <span class="popout-tab-strip__name">{{ panel.title }}</span>
      <span
        class="popout-tab-strip__close"
        role="button"
        tabindex="0"
        aria-label="Move back to the dock"
        title="Move back to the dock"
        (click)="dockBack(panel.id, $event)"
      >
        <app-icon [icon]="Icon.CLOSE" />
      </span>
    </button>
  }
</app-panel-toolbar>
