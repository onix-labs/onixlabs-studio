<div class="property-grid" role="table" [attr.aria-label]="ariaLabel()">
  <div class="property-grid__row property-grid__row--header" role="row">
    @if (checkable()) {
      <span class="property-grid__cell property-grid__cell--tick" aria-hidden="true"></span>
    }
    <span class="property-grid__cell property-grid__cell--heading" role="columnheader">
      {{ nameHeader() }}
    </span>
    <span class="property-grid__cell property-grid__cell--heading" role="columnheader">
      {{ valueHeader() }}
    </span>
    <span class="property-grid__cell property-grid__cell--gutter" aria-hidden="true"></span>
  </div>

  <!-- The stored rows and the blank one are rendered by a single loop, tracked by id. That is what
       keeps the caret still as the blank row becomes real: the consumer stores the new row under the
       id the blank row already had, so this very element carries on being the row being typed into. -->
  @for (row of displayRows(); track row.id) {
    @let draft = isDraft(row);

    <div class="property-grid__row" [class.property-grid__row--draft]="draft" role="row">
      @if (checkable()) {
        <span class="property-grid__cell property-grid__cell--tick" role="cell">
          <app-checkbox
            [checked]="row.enabled !== false"
            [disabled]="draft"
            (checkedChange)="edit(row.id, { enabled: $event })"
          />
        </span>
      }
      <span class="property-grid__cell" role="cell">
        <app-text-field
          variant="none"
          [value]="row.name"
          [placeholder]="draft ? namePlaceholder() : ''"
          [ariaLabel]="draft ? 'New ' + nameHeader() : nameHeader()"
          (valueChange)="write(row, { name: $event })"
        />
      </span>
      <span class="property-grid__cell" role="cell">
        <app-text-field
          variant="none"
          [value]="row.value"
          [placeholder]="draft ? valuePlaceholder() : ''"
          [ariaLabel]="draft ? 'New ' + valueHeader() : valueHeader()"
          (valueChange)="write(row, { value: $event })"
        />
      </span>
      <span class="property-grid__cell property-grid__cell--gutter" role="cell">
        @if (!draft) {
          <app-button
            variant="none"
            size="small"
            [icon]="Icon.CLOSE"
            [ariaLabel]="'Remove ' + (row.name || nameHeader())"
            tooltip="Remove"
            (click)="remove.emit(row.id)"
          />
        }
      </span>
    </div>
  }
</div>
