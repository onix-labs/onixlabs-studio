<div class="markdown-toolstrip">
  <app-button
    variant="none"
    [icon]="Icon.UNDO_BOLD"
    ariaLabel="Undo"
    tooltip="Undo"
    (click)="onUndo()"
  />
  <app-button
    variant="none"
    [icon]="Icon.REDO_BOLD"
    ariaLabel="Redo"
    tooltip="Redo"
    (click)="onRedo()"
  />
  <span class="markdown-toolstrip__divider" aria-hidden="true"></span>
  <!-- What the cursor is in, and the way to turn it into another kind of block: the markdown tab's
       style field, here too (#882). -->
  <app-dropdown
    class="markdown-toolstrip__format"
    ariaLabel="Format"
    [fullWidth]="true"
    [options]="blockTypeOptions"
    [value]="blockType()"
    (valueChange)="onBlockType($event)"
  />
  <span class="markdown-toolstrip__divider" aria-hidden="true"></span>
  <app-button
    variant="none"
    [icon]="Icon.BOLD_BOLD"
    ariaLabel="Bold"
    tooltip="Bold"
    (click)="onBold()"
  />
  <app-button
    variant="none"
    [icon]="Icon.ITALIC_BOLD"
    ariaLabel="Italic"
    tooltip="Italic"
    (click)="onItalic()"
  />
  <app-button
    variant="none"
    [icon]="Icon.STRIKETHROUGH_BOLD"
    ariaLabel="Strikethrough"
    tooltip="Strikethrough"
    (click)="onStrikethrough()"
  />
  <app-button
    variant="none"
    [icon]="Icon.CODE_INLINE_BOLD"
    ariaLabel="Inline code"
    tooltip="Inline code"
    (click)="onInlineCode()"
  />
  <span class="markdown-toolstrip__divider" aria-hidden="true"></span>
  <app-button
    variant="none"
    [icon]="Icon.BULLET_LIST_BOLD"
    ariaLabel="Bullet list"
    tooltip="Bullet list"
    (click)="onBulletList()"
  />
  <app-button
    variant="none"
    [icon]="Icon.NUMBERED_LIST_BOLD"
    ariaLabel="Numbered list"
    tooltip="Numbered list"
    (click)="onOrderedList()"
  />
  <app-button
    variant="none"
    [icon]="Icon.TASK_LIST_BOLD"
    ariaLabel="Task list"
    tooltip="Task list"
    (click)="onTaskList()"
  />
  <span class="markdown-toolstrip__divider" aria-hidden="true"></span>
  <app-button
    variant="none"
    [icon]="Icon.TABLE_BOLD"
    ariaLabel="Insert table"
    tooltip="Insert table"
    (click)="onTable()"
  />
  <app-button
    variant="none"
    [icon]="Icon.DIVIDER_BOLD"
    ariaLabel="Insert divider"
    tooltip="Insert divider"
    (click)="onDivider()"
  />
  <!-- The file's commands, behind the menu every document strip ends with (#882): Open in Tab first,
       for the full editor, then those the code strip offers too. -->
  <span class="markdown-toolstrip__spacer"></span>
  <app-button
    variant="none"
    [icon]="Icon.DOTS_THREE_BOLD"
    ariaLabel="More Actions"
    tooltip="More Actions"
    [cdkMenuTriggerFor]="moreMenu.panel() ?? null"
    [cdkMenuPosition]="moreMenu.position()"
  />
</div>
<app-menu #moreMenu [items]="menuItems()" placement="down-end" (selected)="onMenu($event)" />
