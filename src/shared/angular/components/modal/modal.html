<!-- The inline presentation: the modal's own backdrop and panel, drawn over the raising window's
     content. It is used for callers that still project plain content, and wherever a modal window
     cannot be opened. When the modal is presented in its own window this stays hidden, and the
     content below is never instantiated — the window's host renders the caller's template instead.

     The backdrop is a convenience click-to-dismiss surface; keyboard parity is provided by the
     Escape handler on the host, and the panel within holds the real focusable controls. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<section
  class="modal"
  [class.modal--visible]="inlineVisible()"
  [class.modal--expanded]="expanded()"
  (click)="onBackdrop($event)"
>
  <div
    class="modal__panel"
    role="dialog"
    aria-modal="true"
    [class.modal__panel--expanded]="expanded()"
    [attr.aria-label]="ariaLabel()"
    [style.--modal-panel-inline-size]="panelInlineSize()"
  >
    @if (expandable() || dismissable()) {
      <div class="modal__controls">
        @if (expandable()) {
          <button
            type="button"
            class="modal__control"
            [attr.aria-label]="expanded() ? 'Restore' : 'Expand'"
            (click)="toggleExpanded()"
          >
            <app-icon [icon]="expanded() ? Icon.ARROWS_IN : Icon.ARROWS_OUT" />
          </button>
        }
        @if (dismissable()) {
          <button
            type="button"
            class="modal__control"
            aria-label="Close"
            (click)="requestDismiss()"
          >
            <app-icon [icon]="Icon.CLOSE" />
          </button>
        }
      </div>
    }

    <!-- Templated content renders here only when the modal fell back to the inline presentation;
         normally it is instantiated in the modal's own window instead. -->
    @if (inlineVisible() && content(); as marked) {
      <ng-container [ngTemplateOutlet]="marked.template" />
    }

    <ng-content />
  </div>
</section>
