@if (hasServers()) {
  <button
    type="button"
    class="lsp-status-menu__trigger"
    title="Language Servers"
    aria-label="Language Servers"
    [appTooltip]="'Language Servers'"
    [cdkMenuTriggerFor]="menu"
    [cdkMenuPosition]="menuPosition"
  >
    <app-icon class="lsp-status-menu__trigger-icon" [icon]="Icon.ARTICLE" />
  </button>
}

<ng-template #menu>
  <div class="lsp-status-menu__panel" cdkMenu>
    <p class="lsp-status-menu__heading">Language Servers</p>
    @for (server of servers(); track server.sessionId) {
      <div class="lsp-status-menu__item lsp-status-menu__item--{{ server.state }}">
        <app-icon class="lsp-status-menu__item-icon" [icon]="iconFor(server.state)" />
        <span class="lsp-status-menu__item-text">
          <span class="lsp-status-menu__item-name"
            >{{ server.name }}
            @if (server.version) {
              <span class="lsp-status-menu__item-version">{{ server.version }}</span>
            }
          </span>
          <span class="lsp-status-menu__item-status">{{ statusText(server) }}</span>
        </span>
        <!-- A plain button rather than a cdkMenuItem, and the pointer-down kept from moving focus,
             so the flyout stays open: the point of pressing Restart is to watch the row go
             Starting… → Ready, which it cannot do from a closed menu. Same pattern as the tasks and
             notifications flyouts. -->
        <!-- A server stuck starting or loading (#1211) also offers its log, to see what it is doing. -->
        @if (server.stalled || server.loadStalled) {
          <app-button
            variant="none"
            size="small"
            [icon]="Icon.OUTPUT"
            ariaLabel="Show language server log"
            tooltip="Show Log"
            (pointerdown)="$event.preventDefault()"
            (click)="showLog(server); $event.stopPropagation()"
          />
        }
        <app-button
          variant="none"
          size="small"
          [icon]="Icon.RESTART"
          ariaLabel="Restart language server"
          tooltip="Restart"
          [disabled]="server.state === 'starting' && !server.stalled && !server.loadStalled"
          (pointerdown)="$event.preventDefault()"
          (click)="restart(server); $event.stopPropagation()"
        />
      </div>
    }
  </div>
</ng-template>
