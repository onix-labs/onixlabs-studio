<button
  type="button"
  class="notifications-menu__trigger"
  [class.notifications-menu__trigger--alert]="unseenCount() > 0"
  [title]="triggerTitle()"
  [attr.aria-label]="triggerTitle()"
  [cdkMenuTriggerFor]="menu"
  [cdkMenuPosition]="menuPosition"
  (cdkMenuOpened)="onOpened()"
>
  <app-icon [icon]="muted() ? Icon.BELL_SLASH : Icon.BELL" />
  @if (unseenCount() > 0) {
    <span class="notifications-menu__count">{{ countLabel() }}</span>
  }
</button>

<ng-template #menu>
  <div class="notifications-menu__panel" cdkMenu>
    <div class="notifications-menu__header">
      <p class="notifications-menu__heading">Notifications</p>
      <!-- Plain buttons rather than cdkMenuItems so muting and clearing keep the flyout open; the
           stopPropagation keeps the click from reaching the menu. -->
      <div class="notifications-menu__header-actions">
        <app-button
          variant="none"
          size="small"
          [label]="muted() ? 'Unmute' : 'Mute'"
          (pointerdown)="$event.preventDefault()"
          (click)="toggleMute(); $event.stopPropagation()"
        />
        @if (history().length > 0) {
          <app-button
            variant="none"
            size="small"
            label="Clear all"
            (pointerdown)="$event.preventDefault()"
            (click)="clearAll(); $event.stopPropagation()"
          />
        }
      </div>
    </div>
    @if (history().length === 0) {
      <p class="notifications-menu__empty">No notifications</p>
    }
    <!-- Each entry is drawn exactly as it appeared in the stack, by the same card. -->
    @for (entry of history(); track entry.id) {
      <app-toast-card
        class="notifications-menu__card"
        closeVerb="Remove"
        [notification]="entry"
        (closed)="remove(entry)"
        (acted)="act(entry, $event)"
      />
    }
  </div>
</ng-template>
