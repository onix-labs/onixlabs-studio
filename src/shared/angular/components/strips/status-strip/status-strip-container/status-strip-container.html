<footer>
  <!-- The view region: the active feature's own status, mounted through that view's injector so it
       reads the view's per-tab services. It is destroyed on tab switch, so it can never go stale.
       Both halves of the condition matter: without the view's injector the component would be built
       in the shell's, silently binding to root-scoped services instead of the tab's. A feature
       contributing no status (or one whose view has not registered yet) names the active tab. -->
  <div class="status-strip__view">
    @if (viewStatus(); as status) {
      @if (viewInjector(); as injector) {
        <ng-container *ngComponentOutlet="status; injector: injector" />
      } @else {
        <app-status-strip-segments [leading]="fallback()" />
      }
    } @else {
      <app-status-strip-segments [leading]="fallback()" />
    }
  </div>

  <!-- The ambient region: app-wide state that outlives any one tab. -->
  <div class="status-strip__ambient">
    @for (segment of ambient(); track segment.id) {
      <app-status-strip-segment [segment]="segment" />
    }
    <!-- The layout the active workspace is showing, named in full — the ribbon's View button has room
         only for the role ("Default"), not for whatever the layout is actually called. -->
    @if (layoutSegment(); as layout) {
      <app-status-strip-segment [segment]="layout" />
    }
    <!-- The drop-up triggers sit together as one cluster of controls, spaced far more tightly than
         the ambient segments beside them: a segment is a run of words that needs room to read as its
         own item, whereas these are icon buttons that read as a group. -->
    <div class="status-strip__menus">
      <app-status-strip-tasks-menu />
      <app-status-strip-lsp-menu />
      <app-status-strip-notifications-menu />
    </div>
  </div>
</footer>
