@if (visible) {
  <div class="window-controls">
    <button
      type="button"
      class="window-controls__button"
      aria-label="Minimize"
      [appTooltip]="'Minimize'"
      (click)="minimize()"
    >
      <app-icon [icon]="Icon.WINDOW_MINIMIZE" />
    </button>
    <button
      type="button"
      class="window-controls__button"
      aria-label="Maximize"
      [appTooltip]="'Maximize'"
      (click)="toggleMaximize()"
    >
      <app-icon [icon]="Icon.WINDOW_MAXIMIZE" />
    </button>
    <button
      type="button"
      class="window-controls__button window-controls__button--close"
      aria-label="Close"
      [appTooltip]="'Close'"
      (click)="close()"
    >
      <app-icon [icon]="Icon.WINDOW_CLOSE" />
    </button>
  </div>
}
