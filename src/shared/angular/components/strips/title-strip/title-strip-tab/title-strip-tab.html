<div
  role="tab"
  cdkDrag
  [attr.data-tab-type]="tab().type"
  [cdkDragDisabled]="isPinned()"
  [cdkDragConstrainPosition]="anchorDragToRail"
  [attr.tabindex]="isActive() ? 0 : -1"
  [attr.aria-selected]="isActive()"
  (mousedown)="onPress()"
  (keydown.enter)="selectTab.emit()"
  (cdkDragStarted)="onDragStarted($event)"
>
  <app-icon [icon]="tab().icon" [size]="1.5" [rotation]="tab().iconRotation ?? 0" />
  <span class="tab-title"
    ><bdi>{{ tab().title }}</bdi></span
  >
  <!-- One dot, never two: an edited document whose agent is also waiting says the more urgent of the
       two in colour and both of them in its label, rather than growing a second circle. -->
  @if (tab().attention || tab().dirty) {
    <span
      class="tab-dot"
      [class.tab-dot--attention]="tab().attention"
      [attr.aria-label]="dotLabel()"
    ></span>
  }
  <button
    type="button"
    aria-label="Close tab"
    [appTooltip]="'Close tab'"
    [attr.tabindex]="isActive() ? 0 : -1"
    (mousedown)="$event.stopPropagation()"
    (click)="onCloseClick($event)"
  >
    <app-icon [icon]="Icon.CLOSE" />
  </button>

  <div class="tab-chip" *cdkDragPreview>
    <app-icon [icon]="tab().icon" [size]="1.5" [rotation]="tab().iconRotation ?? 0" />
    <span class="tab-title"
      ><bdi>{{ tab().title }}</bdi></span
    >
    <button type="button" aria-hidden="true" tabindex="-1">
      <app-icon [icon]="Icon.CLOSE" />
    </button>
  </div>
</div>
