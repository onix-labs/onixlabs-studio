<div class="diff__body">
  <app-diff-editor
    class="diff__editor"
    [original]="original()"
    [modified]="modified()"
    [language]="language()"
    [inline]="inline()"
  />

  @if (!fileName()) {
    <div class="diff__empty">
      <app-icon [icon]="Icon.GIT_DIFF" [size]="2.5" />
      <p class="diff__empty-text">Select a changed file to compare its versions.</p>
    </div>
  }
</div>
