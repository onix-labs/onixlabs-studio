<app-panel-toolbar>
  <app-dropdown
    class="diff-panel__layout"
    ariaLabel="Diff layout"
    [options]="layoutOptions"
    [value]="inline() ? 'inline' : 'side-by-side'"
    (valueChange)="onLayoutChange($event)"
  />
  <span class="panel-toolbar__spacer"></span>
  <!-- Monaco owns what "the next change" is: where the hunks are, how they wrap, and scrolling both
       sides to them together. These only ask. -->
  <app-button
    variant="none"
    [icon]="Icon.ARROW_UP"
    ariaLabel="Previous Change"
    tooltip="Previous change"
    [disabled]="!hasFile()"
    (click)="previousChange()"
  />
  <app-button
    variant="none"
    [icon]="Icon.ARROW_DOWN"
    ariaLabel="Next Change"
    tooltip="Next change"
    [disabled]="!hasFile()"
    (click)="nextChange()"
  />

  <span class="diff-panel__divider" aria-hidden="true"></span>
  <!-- The change's own commands (#882): the file itself, to edit; and, for a working-tree change,
       staging it or discarding it. A commit's change is history, so it has neither. -->
  <app-button
    variant="none"
    [icon]="Icon.OPEN_FILE"
    ariaLabel="Open File"
    tooltip="Open File"
    [disabled]="!canOpenFile()"
    (click)="openFile()"
  />
  @if (isWorkingChange()) {
    <app-button
      variant="none"
      [icon]="isStaged() ? Icon.MINUS_CIRCLE : Icon.PLUS_CIRCLE"
      [ariaLabel]="isStaged() ? 'Unstage' : 'Stage'"
      [tooltip]="isStaged() ? 'Unstage' : 'Stage'"
      [disabled]="busy()"
      (click)="toggleStaged()"
    />
    <app-button
      variant="none"
      [icon]="Icon.RESTORE"
      ariaLabel="Discard Changes"
      [tooltip]="isStaged() ? 'Unstage it to discard its changes' : 'Discard Changes'"
      [disabled]="busy() || isStaged()"
      (click)="discard()"
    />
  }
  <!-- How the file changed is the document's status, so it is a chip on the status strip (#882). -->
  <app-button
    variant="none"
    [icon]="Icon.DOTS_THREE_BOLD"
    ariaLabel="More Actions"
    tooltip="More Actions"
    [cdkMenuTriggerFor]="moreMenu.panel() ?? null"
    [cdkMenuPosition]="moreMenu.position()"
  />
</app-panel-toolbar>
<app-menu #moreMenu [items]="menuItems()" placement="down-end" (selected)="onMenu($event)" />

@if (file(); as change) {
  <app-diff-view
    [fileName]="change.path"
    [original]="change.original"
    [modified]="change.modified"
    [language]="change.language"
    [inline]="inline()"
  />
}
