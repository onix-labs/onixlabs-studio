@if (root(); as root) {
  <div class="terminal-panel">
    <!-- The terminals are chosen from a dropdown rather than laid out as tabs: a row of tabs ran out
         of room with a few terminals open, and piled on top of one another past the point where any
         could be read or closed. The buttons act on the terminal shown. -->
    <app-panel-toolbar class="terminal-panel__tabs">
      @if (editingSession(); as editing) {
        <app-text-field
          #renameField
          class="terminal-panel__rename"
          ariaLabel="Rename terminal"
          [value]="editing.name"
          (blurred)="commitRenameValue(editing.id, renameField.value())"
          (enter)="commitRenameValue(editing.id, renameField.value())"
          (escape)="cancelRename()"
        />
      } @else {
        <app-dropdown
          class="terminal-panel__picker"
          [fullWidth]="true"
          [options]="terminalOptions()"
          [value]="activeId() ?? ''"
          ariaLabel="Terminal"
          data-testid="terminal-picker"
          (valueChange)="activate($event)"
        />
      }
      <app-button
        variant="none"
        [icon]="Icon.PENCIL"
        ariaLabel="Rename Terminal"
        tooltip="Rename Terminal"
        [disabled]="activeSession() === null"
        (click)="renameActive()"
      />
      <app-button
        variant="none"
        [icon]="Icon.PLUS"
        ariaLabel="New Terminal"
        tooltip="New Terminal"
        (click)="create()"
      />
      <app-button
        variant="none"
        [icon]="Icon.CLOSE"
        ariaLabel="Close Terminal"
        tooltip="Close Terminal"
        [disabled]="activeSession() === null"
        (click)="closeActive()"
      />
    </app-panel-toolbar>
    <div class="terminal-panel__bodies">
      <!-- Panes re-key on the session's generation: a relaunch-in-place replaces the PTY and its
           buffer, so the pane remounts and replays the fresh session instead of appending to the
           old screen. -->
      @for (session of sessions(); track session.id + ':' + session.generation) {
        <div
          class="terminal-panel__body"
          [class.terminal-panel__body--hidden]="session.id !== activeId()"
        >
          <app-terminal
            [terminalId]="session.id"
            [kind]="session.kind"
            [cwd]="session.cwd"
            [persistent]="true"
            [quietStart]="session.quiet === true"
            [isActive]="isActive() && session.id === activeId()"
            (shellChange)="onShell(session.id, $event)"
            (titleChange)="onTitle(session.id, $event)"
            (ready)="onReady(session.id)"
          />
        </div>
      }
    </div>
    <!-- The path leads and the shell trails, as they do on a terminal tab's status strip. -->
    <app-panel-status>
      <span class="panel-status__item">{{ root }}</span>
      <span class="panel-status__item panel-status__item--push">
        <app-icon [icon]="Icon.TERMINAL" />
        {{ shellName(activeSession()?.shell) }}
      </span>
    </app-panel-status>
  </div>
} @else {
  <div class="terminal-panel__empty">Open a folder to use the terminal.</div>
}
