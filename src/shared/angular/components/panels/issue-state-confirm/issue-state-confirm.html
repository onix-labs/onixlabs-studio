<!-- Asked before an issue's state changes on its host: everyone watching it is told, so a half-aimed
     click should not do it. -->
<app-modal
  [open]="actions.pending() !== null"
  [width]="30"
  [frameless]="true"
  ariaLabel="Change issue state"
  (dismiss)="actions.dismiss()"
>
  <ng-template appModalContent>
    @if (actions.pending(); as pending) {
      @if (pending.state === 'closed') {
        <h2 class="confirm__title">Close Issue #{{ pending.issue.number }}?</h2>
        <p class="confirm__issue">{{ pending.issue.title }}</p>
        <div class="confirm__fields">
          <app-dropdown
            label="Reason"
            ariaLabel="Why do you want to close this issue?"
            [fullWidth]="true"
            [options]="reasons()"
            [value]="reason()"
            (valueChange)="chooseReason($event)"
          />
          @if (reason() === 'duplicate') {
            <app-number-field
              variant="floating"
              label="Number of the issue this duplicates"
              [fullWidth]="true"
              [spinner]="false"
              [digitsOnly]="true"
              [value]="duplicateOf()"
              [min]="0"
              [zeroIsEmpty]="true"
              [live]="true"
              (valueChange)="duplicateOf.set($event)"
            />
          }
        </div>
        <app-button-row>
          <app-button variant="solid" label="Close" [disabled]="!canClose()" (click)="close()" />
          <app-button variant="none" label="Cancel" (click)="actions.dismiss()" />
        </app-button-row>
      } @else {
        <h2 class="confirm__title">Reopen Issue #{{ pending.issue.number }}?</h2>
        <p class="confirm__issue">{{ pending.issue.title }}</p>
        <app-button-row>
          <app-button variant="solid" label="Reopen" (click)="actions.confirm()" />
          <app-button variant="none" label="Cancel" (click)="actions.dismiss()" />
        </app-button-row>
      }
    }
  </ng-template>
</app-modal>
