<!-- Asked before an issue replaces a conversation that already holds something: starting a new one
     discards the transcript, and a click the user half-aimed should not lose it. -->
<app-modal
  [open]="issueAgent.pending() !== null"
  [width]="26"
  [frameless]="true"
  ariaLabel="Open issue in agent"
  (dismiss)="issueAgent.dismiss()"
>
  <ng-template appModalContent>
    <h2 class="confirm__title">Start a New Conversation?</h2>
    <p class="confirm__message">
      Your current conversation ends, and a new one starts about
      <strong>#{{ issueAgent.pending()?.number }} {{ issueAgent.pending()?.title }}</strong
      >.
    </p>
    <app-button-row>
      <app-button variant="solid" label="Start New" (click)="issueAgent.confirm()" />
      <app-button variant="none" label="Cancel" (click)="issueAgent.dismiss()" />
    </app-button-row>
  </ng-template>
</app-modal>
