<div class="dock-container" cdkDropListGroup [style.padding]="padding">
  <app-dock-node [node]="layout()" />
</div>
<!-- The main group's content, drawn over its slot rather than in it, so rearranging the layout never
     creates it afresh (see DockMain). -->
@if (mainPanelId(); as panelId) {
  <div class="dock-container__main" (mousedown)="focusMain()">
    <app-dock-panel-outlet [panelId]="panelId" />
  </div>
}
<app-dock-floating-layer />
<app-dock-overlay />
