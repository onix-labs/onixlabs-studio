@for (item of windows(); track item.window.panelId) {
  <div
    class="dock-float"
    [style.left.px]="item.window.left"
    [style.top.px]="item.window.top"
    [style.width.px]="item.window.width"
    [style.height.px]="item.window.height"
    [style.z-index]="item.window.z"
    (mousedown)="bringToFront(item.window.panelId)"
  >
    <div class="dock-float__title" (mousedown)="startMove(item.window, $event)">
      <app-icon class="dock-float__icon" [icon]="item.panel.icon" />
      <span class="dock-float__title-text">{{ item.panel.title }}</span>
      <span class="dock-float__title-buttons">
        <app-button
          variant="none"
          size="small"
          [icon]="Icon.DOCK"
          ariaLabel="Dock"
          tooltip="Dock"
          (click)="dockBack(item.window.panelId)"
          (mousedown)="$event.stopPropagation()"
        />
        <app-button
          variant="none"
          size="small"
          [icon]="Icon.CLOSE"
          ariaLabel="Close"
          tooltip="Close"
          (click)="close(item.window.panelId)"
          (mousedown)="$event.stopPropagation()"
        />
      </span>
    </div>
    <div class="dock-float__body">
      <app-dock-panel-outlet [panelId]="item.window.panelId" />
    </div>
    @for (handle of resizeHandles; track handle.id) {
      <span
        class="dock-float__resize dock-float__resize--{{ handle.id }}"
        aria-hidden="true"
        (mousedown)="startResize(item.window, handle, $event)"
      >
        @if (handle.id === 'se') {
          <app-icon [icon]="Icon.NOTCHES" />
        }
      </span>
    }
  </div>
}
