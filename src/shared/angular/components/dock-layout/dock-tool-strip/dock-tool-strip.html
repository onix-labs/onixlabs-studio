<!-- Stubbed tools; handlers are intentionally absent until the panels wire real actions. -->
@for (tool of tools(); track tool.id) {
  <button
    type="button"
    class="dock-tool-strip__tool"
    [title]="tool.label"
    [attr.aria-label]="tool.label"
    [appTooltip]="tool.label"
  >
    <app-icon [icon]="tool.icon" [rotation]="tool.iconRotation ?? 0" />
  </button>
}
