<ng-template #render let-node let-side="side">
  @if (isCollapsed(node)) {
    <app-dock-collapsed-strip [stack]="asStack(node)" [side]="side" />
  } @else if (isStack(node)) {
    <app-dock-tab-group [stack]="node" [side]="side" />
  } @else {
    <div
      class="dock-node__split"
      [class.dock-node__split--row]="node.dir === 'row'"
      [class.dock-node__split--col]="node.dir === 'col'"
    >
      @for (child of node.children; track child.id; let i = $index, last = $last) {
        <div
          class="dock-node__pane"
          [class.dock-node__pane--leaf]="isStack(child)"
          [class.dock-node__pane--collapsed]="isCollapsed(child)"
          [class.dock-node__pane--peeking]="isPeeking(child)"
          [class.dock-node__pane--end]="isEndAnchored(node, i)"
          [class.dock-node__pane--empty]="isEmptyPane(child)"
          [style.flex]="slotFlex(child, node.sizes[i])"
        >
          <ng-container
            [ngTemplateOutlet]="render"
            [ngTemplateOutletContext]="{ $implicit: child, side: sideOf(child, node.dir, i) }"
          />
        </div>
        @if (!last && hasSplitter(node, i)) {
          <app-dock-splitter
            [splitId]="node.id"
            [index]="i"
            [dir]="node.dir"
            [sizes]="node.sizes"
            [disabled]="isCollapsed(child) || isCollapsed(childAt(node, i + 1))"
          />
        }
      }
    </div>
  }
</ng-template>

<ng-container
  [ngTemplateOutlet]="render"
  [ngTemplateOutletContext]="{ $implicit: node(), side: 'left' }"
/>
