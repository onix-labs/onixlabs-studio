<div
  class="list-rows"
  role="listbox"
  cdkDropList
  (cdkDropListSorted)="onSorted($event)"
  (cdkDropListDropped)="onDrop()"
>
  @for (row of displayRows(); track row.id) {
    <!-- The drag preview is a clone of the row, and by default the CDK parks it on `<body>`. Out there
         it sits outside `app-list-view`, so any styling a consumer scoped to its own list — row padding
         most of all — stops applying and the clone re-lays-out: its content shifts, and the grip slides
         out from under the cursor that is dragging it. Rendering the preview into the row's own parent
         keeps those selectors matching, so the clone is laid out identically to the row it replaces. -->
    <div
      class="list-row"
      role="option"
      tabindex="0"
      cdkDrag
      cdkDragLockAxis="y"
      cdkDragPreviewContainer="parent"
      [cdkDragDisabled]="!reorderable()"
      (cdkDragStarted)="onDragStarted()"
      [cdkContextMenuTriggerFor]="hasContextMenu() ? (contextMenu.panel() ?? null) : null"
      [cdkContextMenuTriggerData]="{ $implicit: row }"
      [cdkContextMenuDisabled]="!rowHasMenu(row)"
      [attr.data-list-id]="row.id"
      [class.active]="selectedId() !== null && row.id === selectedId()"
      [attr.aria-selected]="selectedId() !== null ? row.id === selectedId() : null"
      (click)="rowClick.emit(row)"
      (keydown.enter)="activate($event, row)"
      (keydown.space)="activate($event, row)"
    >
      <ng-container
        [ngTemplateOutlet]="content() ?? null"
        [ngTemplateOutletContext]="{ $implicit: row }"
      />
      @if (reorderable()) {
        <span
          class="list-row__grip"
          cdkDragHandle
          aria-label="Drag to reorder"
          title="Drag to reorder"
        >
          <app-icon [icon]="gripIcon()" [size]="1" />
        </span>
      }
    </div>
  } @empty {
    @if (emptyText().length > 0) {
      <div class="list-empty">{{ emptyText() }}</div>
    }
  }
</div>

<!-- One menu shared by every row: the row it was opened on travels with the trigger's data, so the
     items and their subject are resolved together when it opens. -->
<app-menu #contextMenu [itemsFor]="menuItemsFor" (chosen)="onContextChoice($event)" />
