@if (hasTabs()) {
  <app-title-strip-container class="title-strip" />
  @if (activeChrome().ribbon) {
    <app-ribbon-strip-container class="ribbon-strip" />
  }
  <main class="content">
    <app-content-host />
  </main>
  @if (activeChrome().status) {
    <app-status-strip-container class="status-strip" />
  }
}

<!-- The setup wizard, mounted before the welcome screen because it precedes it: on a first launch and
     after every version change it is what the user meets, and the welcome screen stands aside until
     it is done. Mounted here rather than in a pop-out host so there is exactly one, in the main
     window. -->
<app-setup-wizard-host />

<!-- The welcome screen stays mounted so it can animate in and out; it manages its own visible state. -->
<app-welcome-screen class="welcome-screen" />

<!-- The run-configuration Configure dialog stays mounted; the directory ribbon toggles its state. -->
<app-configure-dialog />

<!-- The plugin consent terms, mounted once here so every surface that installs a plugin asks the
     same question in the same window. -->
<app-plugin-consent-host />

<!-- The About dialog, mounted once here because the Help menu entry that opens it lives in the
     native menu bar and can only call back into the renderer. -->
<app-about-host />

<!-- The backdrop dims and blocks the main window while a modal window is open over it. -->
<app-modal-backdrop />

<!-- Toast notifications overlay the content cell's bottom-right corner, above the status strip.
     Main window only by design: pop-out windows share the renderer, so their actions raise
     through the same store and surface here. -->
<app-toast-host class="toast-host" />
