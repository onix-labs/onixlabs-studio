@if (hasTabs()) {
  <app-title-strip-container class="title-strip" />
  @if (activeChrome().ribbon) {
    <app-ribbon-strip-container class="ribbon-strip" />
  }
  <main class="content">
    <app-content-host />
  </main>
  @if (activeChrome().status) {
    <app-status-strip-container class="status-strip" />
  }
}

<!-- The welcome screen stays mounted so it can animate in and out; it manages its own visible state. -->
<app-welcome-screen class="welcome-screen" />

<!-- The shortcuts cheat sheet stays mounted; the shell's global accelerator toggles its state. -->
<app-shortcuts-overlay />
