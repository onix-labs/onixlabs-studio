<header class="popout__titlebar">
  <span class="popout__title">{{ title }}</span>
  @if (panelKind === 'terminal') {
    <button
      type="button"
      class="popout__pin"
      aria-label="Dock back into the workspace"
      title="Dock back into the workspace"
      (click)="dockBack()"
    >
      <app-icon [icon]="Icon.POP_IN" />
    </button>
  }
  <button
    type="button"
    class="popout__pin"
    [class.popout__pin--active]="pinned()"
    [attr.aria-pressed]="pinned()"
    aria-label="Keep window on top"
    title="Keep window on top"
    (click)="togglePin()"
  >
    <app-icon [icon]="pinned() ? Icon.PIN_FILLED : Icon.PIN" />
  </button>
  <app-window-controls />
</header>

<main class="popout__content">
  @if (panelKind === 'terminal') {
    <app-terminal-popout-panel />
  } @else {
    <app-terminal [terminalId]="scratchId" [isActive]="true" />
  }
</main>
