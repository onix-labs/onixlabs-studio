@if (documentPanel(); as panel) {
  <ng-container
    *ngComponentOutlet="
      panel;
      inputs: { documentId: documentId(), isActive: isActive(), removeOnDestroy: false }
    "
  />
} @else if (isMarkdown()) {
  <app-markdown-view
    [documentId]="documentId()"
    [isActive]="isActive()"
    [removeOnDestroy]="false"
  />
} @else {
  <app-code-view [tabId]="documentId()" [isActive]="isActive()" [removeOnDestroy]="false" />
}
