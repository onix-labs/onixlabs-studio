@if (workspace.hasWorkspace()) {
  <div class="tree-list" role="tree">
    @for (row of workspace.rows(); track row.node.path) {
      <button
        type="button"
        class="tree-row"
        role="treeitem"
        [class.active]="row.node.path === workspace.selectedPath()"
        [class.bold]="row.node.type === 'directory' && row.node.expanded"
        [style.padding-left.px]="indentFor(row.depth)"
        [attr.aria-expanded]="row.node.type === 'directory' ? row.node.expanded : null"
        [attr.aria-selected]="row.node.path === workspace.selectedPath()"
        (click)="onRowClick(row.node)"
      >
        @if (row.node.type === 'directory') {
          <app-icon
            class="tree-chevron"
            [icon]="row.node.expanded ? Icon.CARET_DOWN : Icon.CARET_RIGHT"
          />
        } @else {
          <span class="tree-spacer"></span>
        }

        <app-icon
          class="tree-icon"
          [class.tree-icon--folder]="row.node.type === 'directory'"
          [icon]="iconFor(row.node)"
        />
        <span class="tree-name">{{ row.node.name }}</span>

        @if (row.node.loading) {
          <app-icon class="tree-loading" [icon]="Icon.SPINNER" />
        }
      </button>
    }
  </div>
} @else {
  <div class="tree-empty">
    <p>You haven't opened a folder yet.</p>
    <button type="button" class="tree-open-btn" (click)="workspace.openFolder()">
      <app-icon [icon]="Icon.FOLDER_OPEN" />
      Open Folder…
    </button>
  </div>
}
