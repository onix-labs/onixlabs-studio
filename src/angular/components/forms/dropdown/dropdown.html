<select
  #select
  class="dropdown"
  [attr.aria-label]="ariaLabel()"
  [disabled]="disabled()"
  (change)="onChange($event)"
>
  @for (option of options(); track option.value) {
    <option [value]="option.value" [disabled]="option.disabled" [selected]="option.value === value()">
      {{ option.label }}
    </option>
  }
</select>
