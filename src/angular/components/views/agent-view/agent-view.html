<div class="agent">
  <div class="agent__messages" role="log" aria-label="Conversation">
    @for (message of messages; track message.id) {
      <div class="agent__message" [class.agent__message--user]="message.role === 'user'">
        <span class="agent__avatar" aria-hidden="true">
          <i [class]="message.role === 'user' ? 'ti ti-user' : 'ti ti-robot'"></i>
        </span>
        <p class="agent__bubble">{{ message.text }}</p>
      </div>
    }
  </div>

  <form class="agent__composer" (submit)="$event.preventDefault()">
    <textarea
      class="agent__input"
      rows="1"
      placeholder="Message the agent…"
      aria-label="Message the agent"
      disabled
    ></textarea>
    <button type="submit" class="agent__send" aria-label="Send" disabled>
      <i class="ti ti-send" aria-hidden="true"></i>
    </button>
  </form>
</div>
