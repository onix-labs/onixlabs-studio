<div class="settings">
  <h1 class="settings__title">Settings</h1>

  <section class="settings__section">
    <h2 class="settings__section-title">Appearance</h2>

    <div class="settings__field">
      <span class="settings__field-label" id="theme-mode-label">Theme</span>
      <div class="segmented" role="radiogroup" aria-labelledby="theme-mode-label">
        @for (option of modeOptions; track option.value) {
          <button
            type="button"
            class="segmented__option"
            role="radio"
            [class.segmented__option--selected]="mode() === option.value"
            [attr.aria-checked]="mode() === option.value"
            (click)="selectMode(option.value)"
          >
            <i [class]="option.icon" aria-hidden="true"></i>
            <span>{{ option.label }}</span>
          </button>
        }
      </div>
    </div>
  </section>
</div>
