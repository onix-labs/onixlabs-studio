@for (setting of booleanSettings; track setting.key) {
  <app-setting-row [label]="setting.label" [description]="setting.description">
    <app-toggle
      [checked]="global()[setting.key]"
      (checkedChange)="onGlobalToggle(setting.key, $event)"
    />
  </app-setting-row>
}

<app-setting-row label="Current line highlight" description="How the active line is highlighted.">
  <app-dropdown
    [options]="highlightOptions"
    [value]="global().currentLineHighlight"
    (valueChange)="onHighlightChange($event)"
  />
</app-setting-row>

<app-setting-row label="Cursor blinking" description="How the cursor blinks.">
  <app-dropdown
    [options]="cursorBlinkingOptions"
    [value]="global().cursorBlinking"
    (valueChange)="onCursorBlinkingChange($event)"
  />
</app-setting-row>

<app-setting-row
  label="Smooth caret animation"
  description="Animate the cursor sliding between positions."
>
  <app-dropdown
    [options]="cursorSmoothCaretAnimationOptions"
    [value]="global().cursorSmoothCaretAnimation"
    (valueChange)="onCursorSmoothCaretAnimationChange($event)"
  />
</app-setting-row>

<app-setting-row label="Tab size" description="Number of spaces per indentation level.">
  <app-number-field
    [min]="1"
    [max]="8"
    [value]="global().tabSize"
    (valueChange)="onGlobalNumberChange('tabSize', $event)"
  />
</app-setting-row>

<app-setting-row label="Font family" description="Editor font family.">
  <app-text-field
    [value]="global().fontFamily"
    placeholder="JetBrains Mono"
    (valueChange)="onFontFamilyChange($event)"
  />
</app-setting-row>

<app-setting-row label="Font size" description="Editor font size in pixels.">
  <app-number-field
    [min]="8"
    [max]="48"
    [value]="global().fontSize"
    (valueChange)="onFontSizeChange($event)"
  />
</app-setting-row>

<div class="profiles">
  <div class="profiles__header">
    <h3 class="profiles__title">Language profiles</h3>
    <button type="button" class="profiles__add" (click)="addProfile()">
      <app-icon [icon]="Icon.PLUS" />
      <span>Add profile</span>
    </button>
  </div>

  @for (profile of profiles(); track profile.id) {
    <app-accordion [heading]="profile.name">
      <app-setting-row label="Languages" description="Languages this profile applies to.">
        <app-language-select
          [languages]="languageOptions"
          [value]="profile.languages"
          (valueChange)="onLanguagesChange(profile.id, $event)"
        />
      </app-setting-row>

      @for (setting of booleanSettings; track setting.key) {
        <div class="override">
          <!-- The label wraps the checkbox's projected native input, associating them at runtime;
               the lint rule cannot see through the component boundary to verify this statically. -->
          <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
          <label class="override__check">
            <app-checkbox
              [checked]="isOverridden(profile, setting.key)"
              (checkedChange)="onOverrideToggle(profile, setting.key, $event)"
            />
            <span>Override {{ setting.label }}</span>
          </label>
          <app-toggle
            [checked]="resolvedValue(profile, setting.key)"
            [disabled]="!isOverridden(profile, setting.key)"
            (checkedChange)="onOverrideValue(profile, setting.key, $event)"
          />
        </div>
      }

      @for (setting of numberSettings; track setting.key) {
        <div class="override">
          <!-- The label wraps the checkbox's projected native input, associating them at runtime;
               the lint rule cannot see through the component boundary to verify this statically. -->
          <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
          <label class="override__check">
            <app-checkbox
              [checked]="isOverridden(profile, setting.key)"
              (checkedChange)="onOverrideToggle(profile, setting.key, $event)"
            />
            <span>Override {{ setting.label }}</span>
          </label>
          <app-number-field
            [min]="setting.min"
            [max]="setting.max"
            [value]="resolvedNumber(profile, setting.key)"
            [disabled]="!isOverridden(profile, setting.key)"
            (valueChange)="onNumberOverrideValue(profile, setting.key, $event)"
          />
        </div>
      }

      <button type="button" class="profiles__delete" (click)="deleteProfile(profile.id)">
        <app-icon [icon]="Icon.TRASH" />
        <span>Delete profile</span>
      </button>
    </app-accordion>
  }
</div>
