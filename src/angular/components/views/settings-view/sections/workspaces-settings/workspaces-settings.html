<app-setting-row
  label="Expand All scope"
  description="How the File Explorer's Expand All button behaves. Loaded folders only expands directories already read from disk; Entire tree reads and expands the whole workspace (slower on large folders)."
>
  <app-dropdown
    [options]="expandAllOptions"
    [value]="fileExplorerExpandAll()"
    (valueChange)="onExpandAllChange($event)"
  />
</app-setting-row>
