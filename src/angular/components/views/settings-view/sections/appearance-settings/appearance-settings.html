<app-setting-row label="Accent" description="The colour used for highlights and focus.">
  <div class="swatches" role="radiogroup" aria-label="Accent">
    @for (color of accentColors; track color) {
      <button
        type="button"
        class="swatch"
        role="radio"
        [class.swatch--selected]="accent() === color"
        [style.background]="'var(--accent-' + color + ')'"
        [attr.aria-checked]="accent() === color"
        [attr.aria-label]="color"
        [attr.title]="color"
        (click)="selectAccent(color)"
      ></button>
    }
  </div>
</app-setting-row>

<app-setting-row label="Theme" description="Light, dark, or follow the operating system.">
  <app-button-group
    ariaLabel="Theme"
    [options]="modeOptions"
    [value]="mode()"
    (valueChange)="selectMode($event)"
  />
</app-setting-row>

<app-setting-row
  label="Ribbon Alignment"
  description="How the ribbon's controls are aligned within the ribbon strip."
>
  <app-button-group
    ariaLabel="Ribbon alignment"
    [options]="ribbonAlignmentOptions"
    [value]="ribbonAlignment()"
    (valueChange)="selectRibbonAlignment($event)"
  />
</app-setting-row>

<app-setting-row label="Modern UI Features" [description]="modernUiFeaturesHint">
  <app-button-group
    ariaLabel="Modern UI features"
    [options]="modernUiFeaturesOptions"
    [value]="modernUiFeatures()"
    (valueChange)="selectModernUiFeatures($event)"
  />
</app-setting-row>

<app-setting-row
  label="Hardware Acceleration"
  description="Use the GPU to render the interface. Turning this off can fix rendering glitches on some graphics hardware, but may reduce smoothness. Changing it restarts the application."
>
  <app-toggle
    [checked]="hardwareAcceleration()"
    (checkedChange)="setHardwareAcceleration($event)"
  />
</app-setting-row>

@if (restartRequired()) {
  <p class="restart-notice" role="status">
    <span>Restart required for the hardware acceleration change to take effect.</span>
    <button type="button" class="restart-notice__action" (click)="relaunch()">Relaunch now</button>
  </p>
}
