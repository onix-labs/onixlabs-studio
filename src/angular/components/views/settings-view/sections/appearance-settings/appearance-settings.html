<app-setting-row label="Theme" description="Light, dark, or follow the operating system.">
  <div class="segmented" role="radiogroup" aria-label="Theme">
    @for (option of modeOptions; track option.value) {
      <button
        type="button"
        class="segmented__option"
        role="radio"
        [class.segmented__option--selected]="mode() === option.value"
        [attr.aria-checked]="mode() === option.value"
        (click)="selectMode(option.value)"
      >
        <i [class]="option.icon" aria-hidden="true"></i>
        <span>{{ option.label }}</span>
      </button>
    }
  </div>
</app-setting-row>

<app-setting-row label="Accent" description="The colour used for highlights and focus.">
  <div class="swatches" role="radiogroup" aria-label="Accent">
    @for (color of accentColors; track color) {
      <button
        type="button"
        class="swatch"
        role="radio"
        [class.swatch--selected]="accent() === color"
        [style.background]="'var(--accent-' + color + ')'"
        [attr.aria-checked]="accent() === color"
        [attr.aria-label]="color"
        [attr.title]="color"
        (click)="selectAccent(color)"
      ></button>
    }
  </div>
</app-setting-row>
