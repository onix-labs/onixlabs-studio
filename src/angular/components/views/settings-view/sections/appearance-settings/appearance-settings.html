<app-settings-section sectionId="appearance" />

<app-setting-row
  label="Hardware Acceleration"
  description="Use the GPU to render the interface. Turning this off can fix rendering glitches on some graphics hardware, but may reduce smoothness. Changing it restarts the application."
>
  <app-toggle
    [checked]="hardwareAcceleration()"
    (checkedChange)="setHardwareAcceleration($event)"
  />
</app-setting-row>

@if (restartRequired()) {
  <p class="restart-notice" role="status">
    <span>Restart required for the hardware acceleration change to take effect.</span>
    <button type="button" class="restart-notice__action" (click)="relaunch()">Relaunch now</button>
  </p>
}
