<div class="terminal-shell">
  <div class="terminal-main">
    <div #container class="terminal"></div>
  </div>

  @if (agentMounted()) {
    <div
      class="terminal-shell__splitter"
      [class.terminal-shell__splitter--hidden]="!agentVisible()"
      (mousedown)="onAgentSplitterDown($event)"
    ></div>
    <div
      class="terminal-shell__agent"
      [class.terminal-shell__agent--hidden]="!agentVisible()"
      [style.flex-basis.px]="agentSize()"
    >
      <app-terminal-agent-panel [tabId]="terminalId()" [isActive]="isActive() && agentVisible()" />
    </div>
  }
</div>
