<div
  #editorWrapper
  class="editor-wrapper"
  [class.narrow]="marginClass() === 'narrow'"
  [class.medium]="marginClass() === 'medium'"
  [class.wide]="marginClass() === 'wide'"
  [class.full-width]="marginClass() === 'full-width'"
  [class.image-fixed]="imageSizing() === 'fixed'"
>
  <div #editorContainer class="editor-container"></div>
</div>
