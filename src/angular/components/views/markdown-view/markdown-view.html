<div class="markdown-layout">
  <div class="editor-scroll">
    <div
      #editorWrapper
      class="editor-wrapper"
      [class.narrow]="marginClass() === 'narrow'"
      [class.medium]="marginClass() === 'medium'"
      [class.wide]="marginClass() === 'wide'"
      [class.full-width]="marginClass() === 'full-width'"
      [class.image-fixed]="imageSizing() === 'fixed'"
      [class.image-align-left]="imageAlignment() === 'left'"
      [class.image-align-center]="imageAlignment() === 'center'"
      [class.image-align-right]="imageAlignment() === 'right'"
    >
      <div #editorContainer class="editor-container"></div>
    </div>
  </div>

  @if (isActive() && activePanel() !== 'none') {
    <div
      class="markdown-layout__splitter"
      role="separator"
      aria-orientation="vertical"
      (mousedown)="onPanelSplitterDown($event)"
    ></div>
    <aside class="tool-panel" [style.flex-basis.px]="panelSize()">
      @switch (activePanel()) {
        @case ('outline') {
          <app-markdown-outline-panel />
        }
        @case ('review') {
          <app-markdown-review-panel />
        }
        @case ('agent') {
          <app-markdown-agent-panel />
        }
        @case ('reader') {
          <app-markdown-reader-panel />
        }
      }
    </aside>
  }
</div>
