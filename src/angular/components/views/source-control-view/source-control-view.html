<div class="sc">
  <aside class="sc__rail" [style.inline-size.px]="sidebarSize()">
    <app-source-control-sidebar />
  </aside>

  <div
    class="sc__splitter sc__splitter--vertical"
    (mousedown)="onSplitterDown($event, 'sidebar')"
  ></div>

  <section class="sc__center">
    <div class="sc__graph">
      <app-commit-graph />
    </div>

    <div
      class="sc__splitter sc__splitter--horizontal"
      (mousedown)="onSplitterDown($event, 'diff')"
    ></div>

    <div class="sc__diff" [style.block-size.px]="diffSize()">
      <app-diff-view
        [fileName]="repository.selectedFile()?.path ?? ''"
        [status]="repository.selectedFile()?.status ?? null"
        [original]="repository.selectedFile()?.original ?? ''"
        [modified]="repository.selectedFile()?.modified ?? ''"
        [language]="repository.selectedFile()?.language ?? 'plaintext'"
        [inline]="inlineDiff()"
      />
    </div>
  </section>

  <div
    class="sc__splitter sc__splitter--vertical"
    (mousedown)="onSplitterDown($event, 'detail')"
  ></div>

  <aside class="sc__detail" [style.inline-size.px]="detailSize()">
    <app-commit-detail />
  </aside>
</div>
