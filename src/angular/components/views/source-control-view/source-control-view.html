@if (repository.isBound()) {
  <app-dock-container />
} @else {
  <div class="sc-empty">
    <app-icon class="sc-empty__icon" [icon]="Icon.SOURCE_CONTROL" [size]="3" />
    <h1 class="sc-empty__title">No repository open</h1>
    <p class="sc-empty__hint">Open a git repository to view its history, branches, and changes.</p>
    <button type="button" class="sc-empty__button" (click)="openRepositoryHere()">
      Open Repository…
    </button>
  </div>
}

<app-modal
  [open]="newBranchOpen()"
  [dismissable]="true"
  [width]="28"
  ariaLabel="New branch"
  (dismiss)="closeNewBranch()"
>
  <h2 class="sc-modal__title">New branch</h2>
  <input
    class="sc-modal__input"
    type="text"
    placeholder="branch-name"
    [value]="newBranchName()"
    (input)="onNewBranchInput($event)"
    (keydown.enter)="confirmNewBranch()"
  />
  <div class="sc-modal__actions">
    <button type="button" class="sc-modal__button" (click)="closeNewBranch()">Cancel</button>
    <button
      type="button"
      class="sc-modal__button sc-modal__button--primary"
      [disabled]="newBranchName().trim().length === 0"
      (click)="confirmNewBranch()"
    >
      Create
    </button>
  </div>
</app-modal>
