<div
  #tabList
  class="tab-list"
  [class.tab-list--scrollable]="overflowing()"
  role="tablist"
  cdkDropList
  cdkDropListOrientation="horizontal"
  [cdkDropListSortPredicate]="sortPredicate"
  (cdkDropListDropped)="onDrop($event)"
  (wheel)="onWheel($event)"
>
  @for (tab of tabs(); track tab.id) {
    <app-title-strip-tab
      [tab]="tab"
      [isActive]="tab.id === activeTabId()"
      (selectTab)="onSelect(tab)"
      (closeTab)="onClose(tab)"
    />
  }
</div>
