<!-- The window-lock is a switch whose sliding knob carries the lock glyph. The native checkbox
     provides the semantics; the track and knob are drawn around it. The lint rule cannot see the
     association through the absolutely-positioned knob. -->
<!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
<label
  class="window-lock"
  [class.window-lock--active]="windowLock.locked()"
  [title]="windowLock.locked() ? 'Window locked in place' : 'Lock window in place'"
>
  <input
    type="checkbox"
    role="switch"
    class="window-lock__input"
    [checked]="windowLock.locked()"
    (change)="onLockChange($event)"
    aria-label="Lock window in place"
  />
  <i
    class="window-lock__icon ti"
    [class.ti-lock]="windowLock.locked()"
    [class.ti-lock-open]="!windowLock.locked()"
    aria-hidden="true"
  ></i>
  <span class="window-lock__knob"></span>
</label>

<app-title-strip-button-list />
<app-title-strip-tab-list />
<app-window-controls />
