<div
  role="tab"
  cdkDrag
  [cdkDragDisabled]="isPinned()"
  [cdkDragConstrainPosition]="anchorDragToRail"
  [attr.tabindex]="isActive() ? 0 : -1"
  [attr.aria-selected]="isActive()"
  (mousedown)="onPress()"
  (keydown.enter)="selectTab.emit()"
  (cdkDragStarted)="onDragStarted($event)"
>
  <app-icon [icon]="tab().icon" [size]="1.5" />
  <span>{{ tab().title }}</span>
  @if (tab().dirty) {
    <span class="tab-dirty" aria-label="Unsaved changes"></span>
  }
  <button
    type="button"
    aria-label="Close tab"
    [attr.tabindex]="isActive() ? 0 : -1"
    (mousedown)="$event.stopPropagation()"
    (click)="onCloseClick($event)"
  >
    <app-icon [icon]="Icon.CLOSE" />
  </button>

  <div class="tab-chip" *cdkDragPreview>
    <app-icon [icon]="tab().icon" [size]="1.5" />
    <span>{{ tab().title }}</span>
    <button type="button" aria-hidden="true" tabindex="-1">
      <app-icon [icon]="Icon.CLOSE" />
    </button>
  </div>
</div>
