<footer>
  <div class="status-strip__group">
    @for (segment of leading(); track segment.id) {
      <span class="status-strip__segment">
        @if (segment.icon; as icon) {
          <app-icon [icon]="icon" />
        }
        {{ segment.text }}
      </span>
    }
  </div>
  <div class="status-strip__group">
    @for (segment of trailing(); track segment.id) {
      <span class="status-strip__segment">
        @if (segment.icon; as icon) {
          <app-icon [icon]="icon" />
        }
        {{ segment.text }}
      </span>
    }
    @if (lspIndicator(); as indicator) {
      <span
        class="status-strip__segment status-strip__lsp"
        [class]="'status-strip__segment status-strip__lsp status-strip__lsp--' + indicator.state"
        [title]="indicator.label"
      >
        <app-icon [icon]="indicator.icon" />
        {{ indicator.label }}
      </span>
    }
    <app-icon [icon]="Icon.NOTCHES" />
  </div>
</footer>
