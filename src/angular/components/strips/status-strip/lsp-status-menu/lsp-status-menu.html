@if (summary(); as summary) {
  <button
    type="button"
    class="lsp-status-menu__trigger"
    [class]="'lsp-status-menu__trigger lsp-status-menu__trigger--' + summary.state"
    [title]="summary.label"
    [cdkMenuTriggerFor]="menu"
    [cdkMenuPosition]="menuPosition"
  >
    <app-icon [icon]="summary.icon" />
    <span class="lsp-status-menu__trigger-label">{{ summary.label }}</span>
    <app-icon [icon]="Icon.CARET_UP" />
  </button>
}

<ng-template #menu>
  <div class="lsp-status-menu__panel" cdkMenu>
    <p class="lsp-status-menu__heading">Language Servers</p>
    @for (server of servers(); track server.sessionId) {
      <div class="lsp-status-menu__item lsp-status-menu__item--{{ server.state }}">
        <app-icon class="lsp-status-menu__item-icon" [icon]="iconFor(server.state)" />
        <span class="lsp-status-menu__item-text">
          <span class="lsp-status-menu__item-name">{{ server.name }}</span>
          <span class="lsp-status-menu__item-status">{{ statusText(server) }}</span>
        </span>
        <button
          type="button"
          class="lsp-status-menu__restart"
          title="Restart"
          aria-label="Restart language server"
          [disabled]="server.state === 'starting'"
          (click)="restart(server)"
        >
          <app-icon [icon]="Icon.RESTART" />
        </button>
      </div>
    }
  </div>
</ng-template>
