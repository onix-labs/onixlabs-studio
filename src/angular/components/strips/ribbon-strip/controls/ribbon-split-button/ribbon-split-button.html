<div class="ribbon-split">
  <button type="button" class="ribbon-split__action" [disabled]="disabled()" (click)="onAction()">
    <app-icon [icon]="icon()" [size]="1.5" />
    <span>{{ label() }}</span>
  </button>
  <button type="button" class="ribbon-split__menu" [disabled]="disabled()" (click)="onMenu()">
    <span>{{ menuLabel() }}</span>
    <app-icon [icon]="Icon.CARET_DOWN" [size]="0.75" />
  </button>
</div>
