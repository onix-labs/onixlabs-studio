<app-ribbon-group title="File">
  <app-ribbon-button [icon]="Icon.SAVE" label="Save" (action)="onSave()" />
  <app-ribbon-button [icon]="Icon.PRINT" label="Print" (action)="onPrint()" />
</app-ribbon-group>

<app-ribbon-group title="Clipboard">
  <app-ribbon-menu-button
    [icon]="Icon.CUT"
    label="Cut"
    [items]="cutItems"
    (action)="onCut()"
    (selected)="onCutVariant($event)"
  />
  <app-ribbon-menu-button
    [icon]="Icon.COPY"
    label="Copy"
    [items]="copyItems"
    (action)="onCopy()"
    (selected)="onCopyVariant($event)"
  />
  <app-ribbon-menu-button
    [icon]="Icon.PASTE"
    label="Paste"
    [items]="pasteItems"
    (action)="onPaste()"
    (selected)="onPasteVariant($event)"
  />
</app-ribbon-group>

<app-ribbon-group title="Format">
  <app-ribbon-column>
    <app-ribbon-field
      label="Style"
      [options]="blockOptions"
      [value]="blockLabel()"
      (changed)="onBlockChange($event)"
    />
    <app-ribbon-row>
      <app-ribbon-button-small
        [icon]="Icon.BOLD"
        label="Bold"
        [iconOnly]="true"
        (action)="onBold()"
      />
      <app-ribbon-button-small
        [icon]="Icon.ITALIC"
        label="Italic"
        [iconOnly]="true"
        (action)="onItalic()"
      />
      <app-ribbon-button-small
        [icon]="Icon.STRIKETHROUGH"
        label="Strike"
        [iconOnly]="true"
        (action)="onStrikethrough()"
      />
      <app-ribbon-button-small
        [icon]="Icon.CODE_INLINE"
        label="Code"
        [iconOnly]="true"
        (action)="onInlineCode()"
      />
    </app-ribbon-row>
  </app-ribbon-column>
</app-ribbon-group>

<app-ribbon-group title="Lists">
  <app-ribbon-column>
    <app-ribbon-button-small [icon]="Icon.BULLET_LIST" label="Bullets" (action)="onBulletList()" />
    <app-ribbon-button-small
      [icon]="Icon.NUMBERED_LIST"
      label="Numbers"
      (action)="onOrderedList()"
    />
    <app-ribbon-button-small [icon]="Icon.TASK_LIST" label="Tasks" (action)="onTaskList()" />
  </app-ribbon-column>
</app-ribbon-group>

<app-ribbon-group title="Insert">
  <app-ribbon-button [icon]="Icon.TABLE" label="Table" (action)="onTable()" />
  <app-ribbon-button [icon]="Icon.DIVIDER" label="Divider" (action)="onDivider()" />
</app-ribbon-group>
