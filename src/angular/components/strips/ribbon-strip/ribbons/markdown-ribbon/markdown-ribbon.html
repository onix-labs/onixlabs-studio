<app-ribbon-group title="Format">
  <app-ribbon-button icon="ti ti-bold" label="Bold" (action)="onBold()" />
  <app-ribbon-button icon="ti ti-italic" label="Italic" (action)="onItalic()" />
  <app-ribbon-button icon="ti ti-strikethrough" label="Strike" (action)="onStrikethrough()" />
  <app-ribbon-button icon="ti ti-code" label="Code" (action)="onInlineCode()" />
</app-ribbon-group>

<app-ribbon-group title="Structure">
  <app-ribbon-column>
    <app-ribbon-field
      label="Style"
      [options]="blockOptions"
      [value]="blockLabel()"
      (changed)="onBlockChange($event)"
    />
  </app-ribbon-column>
  <app-ribbon-column>
    <app-ribbon-button-small icon="ti ti-list" label="Bullets" (action)="onBulletList()" />
    <app-ribbon-button-small
      icon="ti ti-list-numbers"
      label="Numbered"
      (action)="onOrderedList()"
    />
  </app-ribbon-column>
</app-ribbon-group>

<app-ribbon-group title="Insert">
  <app-ribbon-button icon="ti ti-table" label="Table" (action)="onTable()" />
  <app-ribbon-button icon="ti ti-separator-horizontal" label="Divider" (action)="onDivider()" />
</app-ribbon-group>
