<app-ribbon-strip-group title="File">
  <app-ribbon-strip-menu-button
    [icon]="Icon.SAVE"
    label="Save"
    [items]="saveItems"
    (action)="onSave()"
    (selected)="onSaveVariant($event)"
  />
  <app-ribbon-strip-menu-button
    [icon]="Icon.PRINT"
    label="Print"
    [items]="printItems"
    (action)="onPrint()"
    (selected)="onPrintVariant($event)"
  />
</app-ribbon-strip-group>

<app-ribbon-strip-group title="Edit">
  <app-ribbon-strip-menu-button
    [icon]="Icon.CUT"
    label="Cut"
    [items]="cutItems"
    (action)="onCut()"
    (selected)="onCutVariant($event)"
  />
  <app-ribbon-strip-menu-button
    [icon]="Icon.COPY"
    label="Copy"
    [items]="copyItems"
    (action)="onCopy()"
    (selected)="onCopyVariant($event)"
  />
  <app-ribbon-strip-menu-button
    [icon]="Icon.PASTE"
    label="Paste"
    [items]="pasteItems"
    (action)="onPaste()"
    (selected)="onPasteVariant($event)"
  />
</app-ribbon-strip-group>

<app-ribbon-strip-group title="Format">
  <app-ribbon-strip-column [spread]="true">
    <app-ribbon-strip-row>
      <app-ribbon-strip-button-small
        [icon]="Icon.BOLD"
        label="Bold"
        [iconOnly]="true"
        (action)="onBold()"
      />
      <app-ribbon-strip-button-small
        [icon]="Icon.ITALIC"
        label="Italic"
        [iconOnly]="true"
        (action)="onItalic()"
      />
      <app-ribbon-strip-button-small
        [icon]="Icon.STRIKETHROUGH"
        label="Strike"
        [iconOnly]="true"
        (action)="onStrikethrough()"
      />
      <app-ribbon-strip-button-small
        [icon]="Icon.CODE_INLINE"
        label="Code"
        [iconOnly]="true"
        (action)="onInlineCode()"
      />
    </app-ribbon-strip-row>
    <app-ribbon-strip-field
      label="Style"
      [options]="blockOptions"
      [value]="blockLabel()"
      (changed)="onBlockChange($event)"
    />
  </app-ribbon-strip-column>
</app-ribbon-strip-group>

<app-ribbon-strip-group title="Lists">
  <app-ribbon-strip-column>
    <app-ribbon-strip-button-small [icon]="Icon.BULLET_LIST" label="Bullets" (action)="onBulletList()" />
    <app-ribbon-strip-button-small
      [icon]="Icon.NUMBERED_LIST"
      label="Numbers"
      (action)="onOrderedList()"
    />
    <app-ribbon-strip-button-small [icon]="Icon.TASK_LIST" label="Tasks" (action)="onTaskList()" />
  </app-ribbon-strip-column>
</app-ribbon-strip-group>

<app-ribbon-strip-group title="Insert">
  <div class="insert-grid">
    <button type="button" class="insert-button" title="Table" aria-label="Table" (click)="onTable()">
      <app-icon [icon]="Icon.TABLE" />
    </button>
    <button type="button" class="insert-button" title="Image" aria-label="Image" (click)="onImage()">
      <app-icon [icon]="Icon.IMAGE" />
    </button>
    <button
      type="button"
      class="insert-button"
      title="Divider"
      aria-label="Divider"
      (click)="onDivider()"
    >
      <app-icon [icon]="Icon.DIVIDER" />
    </button>
    <button type="button" class="insert-button" title="Link" aria-label="Link" (click)="onLink()">
      <app-icon [icon]="Icon.LINK" />
    </button>
    <button type="button" class="insert-button" title="Math" aria-label="Math" (click)="onMath()">
      <app-icon [icon]="Icon.MATH" />
    </button>
    <button
      type="button"
      class="insert-button"
      title="Diagram"
      aria-label="Diagram"
      (click)="onDiagram()"
    >
      <app-icon [icon]="Icon.DIAGRAM" />
    </button>
    <button
      type="button"
      class="insert-button"
      title="Footnote"
      aria-label="Footnote"
      (click)="onFootnote()"
    >
      <app-icon [icon]="Icon.FOOTNOTE" />
    </button>
    <button
      type="button"
      class="insert-button"
      title="Collapse"
      aria-label="Collapse"
      (click)="onCollapse()"
    >
      <app-icon [icon]="Icon.COLLAPSE" />
    </button>
    <button type="button" class="insert-button" title="Emoji" aria-label="Emoji" (click)="onEmoji()">
      <app-icon [icon]="Icon.EMOJI" />
    </button>
  </div>
</app-ribbon-strip-group>

<app-markdown-image-modal
  [open]="imageOpen()"
  (submitted)="onImageSubmit($event)"
  (closed)="imageOpen.set(false)"
/>
<app-markdown-link-modal
  [open]="linkOpen()"
  (submitted)="onLinkSubmit($event)"
  (closed)="linkOpen.set(false)"
/>
<app-markdown-math-modal
  [open]="mathOpen()"
  (submitted)="onMathSubmit($event)"
  (closed)="mathOpen.set(false)"
/>
<app-markdown-collapse-modal
  [open]="collapseOpen()"
  (submitted)="onCollapseSubmit($event)"
  (closed)="collapseOpen.set(false)"
/>
<app-markdown-footnote-modal
  [open]="footnoteOpen()"
  (submitted)="onFootnoteSubmit($event)"
  (closed)="footnoteOpen.set(false)"
/>
<app-markdown-emoji-modal
  [open]="emojiOpen()"
  (submitted)="onEmojiSubmit($event)"
  (closed)="emojiOpen.set(false)"
/>
