<app-ribbon-strip-group title="File">
  <app-ribbon-strip-menu-button
    [icon]="Icon.SAVE"
    label="Save"
    [items]="saveItems"
    (action)="onSave()"
    (selected)="onSaveVariant($event)"
  />
  <app-ribbon-strip-menu-button
    [icon]="Icon.PRINT"
    label="Print"
    [items]="printItems"
    (action)="onPrint()"
    (selected)="onPrintVariant($event)"
  />
</app-ribbon-strip-group>

<app-ribbon-strip-group title="Edit">
  <app-ribbon-strip-menu-button
    [icon]="Icon.CUT"
    label="Cut"
    [items]="cutItems"
    (action)="onCut()"
    (selected)="onCutVariant($event)"
  />
  <app-ribbon-strip-menu-button
    [icon]="Icon.COPY"
    label="Copy"
    [items]="copyItems"
    (action)="onCopy()"
    (selected)="onCopyVariant($event)"
  />
  <app-ribbon-strip-menu-button
    [icon]="Icon.PASTE"
    label="Paste"
    [items]="pasteItems"
    (action)="onPaste()"
    (selected)="onPasteVariant($event)"
  />
</app-ribbon-strip-group>

<app-ribbon-strip-group title="Format">
  <app-ribbon-strip-column [spread]="true">
    <app-ribbon-strip-field
      label="Style"
      [options]="blockOptions"
      [value]="blockLabel()"
      (changed)="onBlockChange($event)"
    />
    <app-ribbon-strip-row>
      <app-ribbon-strip-button-small
        [icon]="Icon.BOLD"
        label="Bold"
        [iconOnly]="true"
        (action)="onBold()"
      />
      <app-ribbon-strip-button-small
        [icon]="Icon.ITALIC"
        label="Italic"
        [iconOnly]="true"
        (action)="onItalic()"
      />
      <app-ribbon-strip-button-small
        [icon]="Icon.STRIKETHROUGH"
        label="Strike"
        [iconOnly]="true"
        (action)="onStrikethrough()"
      />
      <app-ribbon-strip-button-small
        [icon]="Icon.CODE_INLINE"
        label="Code"
        [iconOnly]="true"
        (action)="onInlineCode()"
      />
    </app-ribbon-strip-row>
  </app-ribbon-strip-column>
</app-ribbon-strip-group>

<app-ribbon-strip-group title="Insert">
  <app-ribbon-strip-menu-button
    [icon]="Icon.BULLET_LIST"
    label="Lists"
    [items]="listItems"
    (action)="onBulletList()"
    (selected)="onListVariant($event)"
  />
  <app-ribbon-strip-menu-button
    [icon]="Icon.TABLE"
    label="Blocks"
    [items]="blockItems"
    (action)="onTable()"
    (selected)="onBlockVariant($event)"
  />
  <app-ribbon-strip-menu-button
    [icon]="Icon.IMAGE"
    label="Media"
    [items]="mediaItems"
    (action)="onImage()"
    (selected)="onMediaVariant($event)"
  />
  <app-ribbon-strip-menu-button
    [icon]="Icon.LINK"
    label="Inline"
    [items]="inlineItems"
    (action)="onLink()"
    (selected)="onInlineVariant($event)"
  />
</app-ribbon-strip-group>

<app-markdown-image-modal
  [open]="imageOpen()"
  (submitted)="onImageSubmit($event)"
  (closed)="imageOpen.set(false)"
/>
<app-markdown-link-modal
  [open]="linkOpen()"
  (submitted)="onLinkSubmit($event)"
  (closed)="linkOpen.set(false)"
/>
<app-markdown-math-modal
  [open]="mathOpen()"
  (submitted)="onMathSubmit($event)"
  (closed)="mathOpen.set(false)"
/>
<app-markdown-collapse-modal
  [open]="collapseOpen()"
  (submitted)="onCollapseSubmit($event)"
  (closed)="collapseOpen.set(false)"
/>
<app-markdown-footnote-modal
  [open]="footnoteOpen()"
  (submitted)="onFootnoteSubmit($event)"
  (closed)="footnoteOpen.set(false)"
/>
<app-markdown-emoji-modal
  [open]="emojiOpen()"
  (submitted)="onEmojiSubmit($event)"
  (closed)="emojiOpen.set(false)"
/>
