<app-ribbon-group title="Format">
  <app-ribbon-button [icon]="Icon.BOLD" label="Bold" (action)="onBold()" />
  <app-ribbon-button [icon]="Icon.ITALIC" label="Italic" (action)="onItalic()" />
  <app-ribbon-button [icon]="Icon.STRIKETHROUGH" label="Strike" (action)="onStrikethrough()" />
  <app-ribbon-button [icon]="Icon.CODE_INLINE" label="Code" (action)="onInlineCode()" />
</app-ribbon-group>

<app-ribbon-group title="Structure">
  <app-ribbon-column>
    <app-ribbon-field
      label="Style"
      [options]="blockOptions"
      [value]="blockLabel()"
      (changed)="onBlockChange($event)"
    />
  </app-ribbon-column>
  <app-ribbon-column>
    <app-ribbon-button-small [icon]="Icon.BULLET_LIST" label="Bullets" (action)="onBulletList()" />
    <app-ribbon-button-small
      [icon]="Icon.NUMBERED_LIST"
      label="Numbered"
      (action)="onOrderedList()"
    />
  </app-ribbon-column>
</app-ribbon-group>

<app-ribbon-group title="Insert">
  <app-ribbon-button [icon]="Icon.TABLE" label="Table" (action)="onTable()" />
  <app-ribbon-button [icon]="Icon.DIVIDER" label="Divider" (action)="onDivider()" />
</app-ribbon-group>
