<app-ribbon-group title="Solution">
  <app-ribbon-button [icon]="Icon.BUILD" label="Build" />
  <app-ribbon-button [icon]="Icon.REBUILD" label="Rebuild" />
  <app-ribbon-button [icon]="Icon.CLEAN" label="Clean" />
</app-ribbon-group>

<app-ribbon-group title="Run">
  <app-ribbon-split-button [icon]="Icon.PLAY" label="Start" menuLabel="Debug" />
</app-ribbon-group>

<app-ribbon-group title="Target">
  <app-ribbon-column>
    <app-ribbon-field label="Configuration" [options]="['Debug', 'Release']" value="Debug" />
    <app-ribbon-field label="Platform" [options]="['Any CPU', 'x64', 'ARM64']" value="Any CPU" />
  </app-ribbon-column>
</app-ribbon-group>

<app-ribbon-group title="Source Control">
  <app-ribbon-column>
    <app-ribbon-button-small [icon]="Icon.GIT_COMMIT" label="Commit" />
    <app-ribbon-button-small [icon]="Icon.ARROW_UP" label="Push" />
    <app-ribbon-button-small [icon]="Icon.ARROW_DOWN" label="Pull" />
  </app-ribbon-column>
</app-ribbon-group>
