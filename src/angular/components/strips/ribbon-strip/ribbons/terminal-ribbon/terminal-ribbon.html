<app-ribbon-group title="Session">
  <app-ribbon-button icon="ti ti-eraser" label="Clear" (action)="onClear()" />
  <app-ribbon-button icon="ti ti-refresh" label="Restart" (action)="onRestart()" />
</app-ribbon-group>

<app-ribbon-group title="Clipboard">
  <app-ribbon-button icon="ti ti-scissors" label="Cut" (action)="onCut()" />
  <app-ribbon-button icon="ti ti-copy" label="Copy" (action)="onCopy()" />
  <app-ribbon-button icon="ti ti-clipboard" label="Paste" (action)="onPaste()" />
</app-ribbon-group>

<app-ribbon-group title="Actions">
  <app-ribbon-button icon="ti ti-list" label="List" (action)="onList()" />
  <app-ribbon-button icon="ti ti-list-details" label="List All" (action)="onListAll()" />
  <app-ribbon-button icon="ti ti-folder-open" label="Open" (action)="onOpen()" />
</app-ribbon-group>

<app-ribbon-group title="Locations">
  <app-ribbon-button icon="ti ti-home" label="Home" (action)="onHome()" />
  <app-ribbon-button icon="ti ti-folder-root" label="Root" (action)="onRoot()" />
</app-ribbon-group>

<app-ribbon-group title="View">
  <app-ribbon-column>
    <app-ribbon-check label="Scroll Lock" />
    <app-ribbon-check label="Word Wrap" [checked]="true" />
  </app-ribbon-column>
</app-ribbon-group>

<app-ribbon-group title="AI">
  <app-ribbon-button icon="ti ti-robot" label="Agent" />
</app-ribbon-group>
