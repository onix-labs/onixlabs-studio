@if (registry.ribbonFor(activeType()); as ribbon) {
  <div class="ribbon"><ng-container *ngComponentOutlet="ribbon" /></div>
} @else {
  @switch (activeType()) {
    @case ('directory') {
      <div class="ribbon"><app-directory-ribbon /></div>
    }
    @case ('code') {
      <div class="ribbon"><app-code-ribbon /></div>
    }
    @case ('markdown') {
      <div class="ribbon"><app-markdown-ribbon /></div>
    }
    @case ('terminal') {
      <div class="ribbon"><app-terminal-ribbon /></div>
    }
    @case ('agent') {
      <div class="ribbon"><app-agent-ribbon /></div>
    }
    @case ('source-control') {
      <div class="ribbon"><app-source-control-ribbon /></div>
    }
  }
}
