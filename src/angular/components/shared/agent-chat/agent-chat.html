<div class="agent">
  <div class="agent__messages" role="log" aria-label="Conversation">
    @for (message of messages(); track message.id) {
      <div class="agent__message" [class.agent__message--user]="message.role === 'user'">
        <span class="agent__avatar" aria-hidden="true">
          <app-icon [icon]="message.role === 'user' ? Icon.USER : Icon.AGENT" />
        </span>
        <p class="agent__bubble">{{ message.text }}</p>
      </div>
    }
  </div>

  <form class="agent__composer" (submit)="$event.preventDefault(); send()">
    <textarea
      #input
      class="agent__input"
      rows="1"
      placeholder="Message the agent…"
      aria-label="Message the agent"
      [value]="draft()"
      (input)="onInput(input.value)"
      (keydown)="onKeydown($event)"
    ></textarea>
    <button
      type="submit"
      class="agent__send"
      aria-label="Send"
      [disabled]="draft().trim().length === 0"
    >
      <app-icon [icon]="Icon.SEND" />
    </button>
  </form>
</div>
